<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>د. علياء رشدي — مركز الأمل لطب الخصوبة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #8B6FA8; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState, useEffect } from "react";
import {
  Flower2, Calendar, ShieldCheck, Check, Quote, Send, ArrowLeft, Heart,
  Stethoscope, FlaskConical, Baby, Sparkles,
} from "lucide-react";

/* ============================== الهوية البصرية — عيادة د. علياء رشدي ============================== */
const FONT_ID = "dr-alia-fonts";
function useFonts() {
  useEffect(() => {
    if (document.getElementById(FONT_ID)) return;
    const l = document.createElement("link");
    l.id = FONT_ID; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap";
    document.head.appendChild(l);
  }, []);
}

const C = {
  bg: "#FAF8FB", surface: "#FFFFFF", border: "#EAE2EF",
  ink: "#2A2432", muted: "#847C8C",
  lavender: "#8B6FA8", lavenderSoft: "rgba(139,111,168,0.12)",
  blush: "#E4A3AE", blushSoft: "rgba(228,163,174,0.14)",
  gold: "#C9A227",
};
const font = { display: "'Fraunces', serif", body: "'Cairo', sans-serif" };
const shadow = { sm: "0 1px 3px rgba(42,36,50,0.06)", md: "0 10px 28px rgba(42,36,50,0.08)", lg: "0 26px 56px rgba(42,36,50,0.16)" };

const DOCTOR = { name: "د. علياء رشدي", title: "استشاري الحقن المجهري وعلاج تأخر الإنجاب", creds: "زمالة أوروبية في طب الخصوبة (ESHRE) — 13 سنة خبرة", clinic: "مركز الأمل لطب الخصوبة", address: "شارع البطل أحمد عبد العزيز، المهندسين، الجيزة" };

const STATS = [{ v: "+2,100", l: "قصة نجاح" }, { v: "13", l: "سنة خبرة" }, { v: "62%", l: "نسبة نجاح الحقن المجهري" }, { v: "5.0", l: "تقييم المريضات" }];

const JOURNEY = [
  { n: "01", t: "استشارة أولى مطمئنة", d: "جلسة هادئة لفهم حالتك بالكامل من غير أي ضغط أو أحكام مسبقة", icon: Heart },
  { n: "02", t: "تحاليل وتقييم شامل", d: "خطة فحوصات دقيقة لتحديد السبب الحقيقي وأفضل مسار علاج", icon: FlaskConical },
  { n: "03", t: "خطة علاج مخصصة", d: "سواء تنشيط تبويض أو حقن مجهري، الخطة بتتصمم على حالتك إنتِ", icon: Stethoscope },
  { n: "04", t: "متابعة لحد لحظة الفرحة", d: "معاكِ خطوة بخطوة لحد ما تسمعي خبر الحمل بإذن الله", icon: Baby },
];

/* ============================== رحلة العلاج التفاعلية ============================== */
function JourneyStepper() {
  const [step, setStep] = useState(0);
  const current = JOURNEY[step];
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 28, padding: 32, boxShadow: shadow.md }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 22, justifyContent: "center" }}>
        <Sparkles size={16} color={C.lavender} />
        <span style={{ fontFamily: font.display, fontWeight: 600, fontSize: 19, color: C.ink }}>رحلتك معانا خطوة بخطوة</span>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 28 }}>
        {JOURNEY.map((j, i) => (
          <div key={i} onClick={() => setStep(i)} style={{
            width: i === step ? 34 : 10, height: 10, borderRadius: 999, cursor: "pointer",
            background: i <= step ? C.lavender : C.border, transition: "all 0.3s cubic-bezier(.2,.8,.2,1)",
          }} />
        ))}
      </div>
      <div style={{ textAlign: "center", padding: "0 20px 20px" }}>
        <div style={{ width: 60, height: 60, borderRadius: "50%", background: C.lavenderSoft, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px" }}>
          <current.icon size={26} color={C.lavender} />
        </div>
        <div style={{ fontFamily: font.body, fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 6 }}>خطوة {current.n}</div>
        <div style={{ fontFamily: font.display, fontWeight: 600, fontSize: 21, color: C.ink, marginBottom: 10 }}>{current.t}</div>
        <p style={{ fontFamily: font.body, fontSize: 13, color: C.muted, lineHeight: 1.9, maxWidth: 380, marginInline: "auto" }}>{current.d}</p>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 10 }}>
        <button onClick={() => setStep((s) => Math.max(0, s - 1))} disabled={step === 0} style={{ padding: "9px 18px", borderRadius: 999, border: `1px solid ${C.border}`, background: "transparent", fontFamily: font.body, fontSize: 12.5, cursor: step === 0 ? "not-allowed" : "pointer", opacity: step === 0 ? 0.4 : 1, color: C.ink }}>السابق</button>
        <button onClick={() => setStep((s) => Math.min(JOURNEY.length - 1, s + 1))} disabled={step === JOURNEY.length - 1} style={{ padding: "9px 18px", borderRadius: 999, border: "none", background: C.lavender, color: "#fff", fontFamily: font.body, fontSize: 12.5, cursor: step === JOURNEY.length - 1 ? "not-allowed" : "pointer", opacity: step === JOURNEY.length - 1 ? 0.5 : 1 }}>التالي</button>
      </div>
    </div>
  );
}

/* ============================== الأقسام ============================== */

function Navbar() {
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(250,248,251,0.92)", backdropFilter: "blur(12px)", borderBottom: `1px solid ${C.border}` }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", padding: "16px 30px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 40, height: 40, borderRadius: 14, background: `linear-gradient(135deg, ${C.lavender}, ${C.blush})`, display: "flex", alignItems: "center", justifyContent: "center" }}><Flower2 size={19} color="#fff" /></div>
          <div><div style={{ fontFamily: font.display, fontWeight: 600, fontSize: 16, color: C.ink }}>{DOCTOR.name}</div><div style={{ fontFamily: font.body, fontSize: 9.5, color: C.muted }}>{DOCTOR.clinic}</div></div>
        </div>
        <button style={{ display: "flex", alignItems: "center", gap: 8, background: C.lavender, color: "#fff", border: "none", borderRadius: 999, padding: "11px 22px", fontFamily: font.body, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}><Calendar size={15} /> ابدئي استشارتك</button>
      </div>
    </div>
  );
}

function Hero() {
  return (
    <div style={{ maxWidth: 1200, margin: "0 auto", padding: "64px 30px 46px", display: "grid", gridTemplateColumns: "1fr 0.85fr", gap: 50, alignItems: "center" }} className="hero-grid">
      <div>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 7, background: C.blushSoft, borderRadius: 999, padding: "7px 15px", marginBottom: 20 }}>
          <ShieldCheck size={13} color="#A85A64" /><span style={{ fontFamily: font.body, fontSize: 11.5, fontWeight: 700, color: "#A85A64" }}>{DOCTOR.creds}</span>
        </div>
        <h1 style={{ fontFamily: font.display, fontWeight: 400, fontSize: 42, color: C.ink, lineHeight: 1.35, margin: "0 0 18px" }}>
          حلمك بالأمومة <span style={{ color: C.lavender, fontStyle: "italic", fontWeight: 600 }}>مش لوحدك فيه</span>
        </h1>
        <p style={{ fontFamily: font.body, fontSize: 14.5, color: C.muted, lineHeight: 1.9, maxWidth: 460, marginBottom: 28 }}>
          {DOCTOR.title} — دعم طبي ونفسي متكامل في رحلة تأخر الإنجاب، بخصوصية تامة واهتمام حقيقي بحالتك.
        </p>
        <div style={{ display: "flex", gap: 12, marginBottom: 40 }}>
          <button style={{ display: "flex", alignItems: "center", gap: 8, background: C.lavender, color: "#fff", border: "none", borderRadius: 999, padding: "13px 24px", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><Calendar size={16} /> احجزي استشارة خاصة</button>
          <button style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: C.lavender, border: `1.5px solid ${C.lavender}`, borderRadius: 999, padding: "13px 24px", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><ArrowLeft size={16} /> قصص نجاح</button>
        </div>
        <div style={{ display: "flex", gap: 30 }}>
          {STATS.map((s, i) => (
            <div key={i}><div style={{ fontFamily: font.display, fontWeight: 600, fontSize: 22, color: C.ink }}>{s.v}</div><div style={{ fontFamily: font.body, fontSize: 10.5, color: C.muted, marginTop: 3 }}>{s.l}</div></div>
          ))}
        </div>
      </div>
      <div style={{ position: "relative" }}>
        <div style={{ position: "absolute", top: -20, right: -20, width: 200, height: 200, borderRadius: "50%", background: C.lavenderSoft, zIndex: 0 }} />
        <div style={{ position: "relative", aspectRatio: "4/5", borderRadius: 32, background: `linear-gradient(155deg, ${C.lavender}, ${C.blush})`, boxShadow: shadow.lg, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Flower2 size={54} color="rgba(255,255,255,0.35)" />
        </div>
      </div>
    </div>
  );
}

function JourneySection() {
  return <div style={{ padding: "56px 30px" }}><div style={{ maxWidth: 640, margin: "0 auto" }}><JourneyStepper /></div></div>;
}

function TestimonialsSection() {
  const items = [
    { name: "أم آية (اسم مستعار)", text: "بعد سنين من المحاولة، د. علياء كانت مصدر الأمل والدعم الحقيقي، مش بس طبيبة." },
    { name: "أم كريم (اسم مستعار)", text: "الخصوصية والاحترام اللي حسيت بيهم في العيادة مش موجودين في أي مكان تاني." },
  ];
  return (
    <div style={{ background: C.surface, borderTop: `1px solid ${C.border}`, padding: "64px 30px" }}>
      <div style={{ maxWidth: 900, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.lavender, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 30 }}>قصص من قلب العيادة</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }} className="testimonials-grid">
          {items.map((t, i) => (
            <div key={i} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 20, padding: 24, textAlign: "right" }}>
              <Quote size={20} color={C.gold} style={{ marginBottom: 12 }} />
              <p style={{ fontFamily: font.body, fontSize: 13, color: C.ink, lineHeight: 1.8, margin: 0 }}>{t.text}</p>
              <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.muted, marginTop: 14, fontWeight: 600 }}>{t.name}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContactSection() {
  const [sent, setSent] = useState(false);
  return (
    <div style={{ padding: "64px 30px" }}>
      <div style={{ maxWidth: 520, margin: "0 auto", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 26, padding: 30, boxShadow: shadow.md, textAlign: "center" }}>
        <Heart size={26} color={C.lavender} style={{ margin: "0 auto 12px" }} />
        <h3 style={{ fontFamily: font.display, fontWeight: 600, fontSize: 20, color: C.ink, margin: "0 0 8px" }}>احجزي استشارتك الخاصة</h3>
        <p style={{ fontFamily: font.body, fontSize: 12.5, color: C.muted, marginBottom: 6 }}>{DOCTOR.address}</p>
        <p style={{ fontFamily: font.body, fontSize: 11, color: C.muted, marginBottom: 20 }}>خصوصية تامة لكل بياناتك</p>
        {sent ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, color: C.lavender, fontFamily: font.body, fontWeight: 700 }}><Check size={18} /> تم استلام طلبك بسرية تامة</div>
        ) : (
          <>
            <input placeholder="الاسم (أو اسم مستعار إن حبيتِ)" style={{ width: "100%", padding: "12px 14px", borderRadius: 14, border: `1px solid ${C.border}`, background: C.bg, fontFamily: font.body, fontSize: 13, outline: "none", textAlign: "right", boxSizing: "border-box", marginBottom: 10 }} />
            <input placeholder="رقم الموبايل" style={{ width: "100%", padding: "12px 14px", borderRadius: 14, border: `1px solid ${C.border}`, background: C.bg, fontFamily: font.body, fontSize: 13, outline: "none", textAlign: "right", boxSizing: "border-box", marginBottom: 16 }} />
            <button onClick={() => setSent(true)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: C.lavender, color: "#fff", border: "none", borderRadius: 999, padding: "13px 0", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><Send size={15} /> إرسال بسرية تامة</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================== التطبيق ============================== */

function DrAliaFertility() {
  useFonts();
  return (
    <div dir="rtl" style={{ background: C.bg, minHeight: "100vh", fontFamily: font.body, color: C.ink }}>
      <style>{`
        * { box-sizing: border-box; } input::placeholder { color: #B5ACBD; }
        @media (max-width: 900px) {
          .hero-grid { grid-template-columns: 1fr !important; }
          .testimonials-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
      <Navbar /><Hero /><JourneySection /><TestimonialsSection /><ContactSection />
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<DrAliaFertility />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
