/* ============================== عناصر أساسية ============================== */

function Badge({ children, tone = "primary" }) {
  const map = {
    primary: { c: C.primary, bg: C.primarySoft }, coral: { c: C.coral, bg: C.coralSoft },
    amber: { c: "#8A6414", bg: C.amberSoft }, success: { c: C.success, bg: "rgba(46,158,110,0.12)" },
    danger: { c: C.danger, bg: "rgba(225,85,80,0.12)" },
  };
  const t = map[tone];
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontFamily: font.body, fontWeight: 700, fontSize: 11.5, color: t.c, background: t.bg, padding: "4px 10px", borderRadius: 8, whiteSpace: "nowrap" }}>{children}</span>;
}

function Card({ children, style, onClick, hoverLift = true }) {
  const [h, setH] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{
      background: C.surface, border: `1px solid ${h && hoverLift ? "rgba(255,107,74,0.3)" : C.border}`,
      borderRadius: 18, boxShadow: h && hoverLift ? shadow.lg : shadow.sm,
      transform: h && hoverLift ? "translateY(-3px)" : "translateY(0)",
      transition: "all 0.3s cubic-bezier(.2,.8,.2,1)", cursor: onClick ? "pointer" : "default", ...style,
    }}>{children}</div>
  );
}

function Button({ children, variant = "primary", icon: Icon, onClick, style, small }) {
  const [h, setH] = useState(false);
  const variants = {
    primary: { background: h ? "#E85A3B" : C.coral, color: "#fff", border: "none", boxShadow: h ? "0 10px 26px rgba(255,107,74,0.32)" : "0 6px 18px rgba(255,107,74,0.22)" },
    navy: { background: h ? C.primaryDark : C.primary, color: "#fff", border: "none" },
    outline: { background: h ? C.coralSoft : "transparent", color: C.coral, border: `1.5px solid ${C.coral}` },
    ghost: { background: h ? "#EEF2F9" : "transparent", color: C.text, border: `1px solid ${C.border}` },
  };
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{
      display: "inline-flex", alignItems: "center", gap: 8, fontFamily: font.body, fontWeight: 700,
      fontSize: small ? 13 : 14.5, padding: small ? "8px 15px" : "11px 20px", borderRadius: 12,
      cursor: "pointer", transition: "all 0.2s ease", whiteSpace: "nowrap", ...variants[variant], ...style,
    }}>
      {Icon && <Icon size={small ? 14 : 16} />}{children}
    </button>
  );
}

function Input({ placeholder, icon: Icon, value, onChange, type = "text" }) {
  return (
    <div style={{ position: "relative" }}>
      {Icon && <Icon size={15} color={C.muted} style={{ position: "absolute", right: 13, top: "50%", transform: "translateY(-50%)" }} />}
      <input type={type} value={value} onChange={onChange} placeholder={placeholder} style={{
        width: "100%", background: "#F3F6FB", border: `1px solid ${C.border}`, borderRadius: 12,
        padding: "11px 12px", paddingRight: Icon ? 38 : 12, color: C.text, fontFamily: font.body,
        fontSize: 14, outline: "none", boxSizing: "border-box", textAlign: "right",
      }} />
    </div>
  );
}

function Select({ options }) {
  return (
    <select style={{
      width: "100%", background: "#F3F6FB", border: `1px solid ${C.border}`, borderRadius: 12,
      padding: "11px 12px", color: C.text, fontFamily: font.body, fontSize: 14, outline: "none",
      boxSizing: "border-box", textAlign: "right",
    }}>{options.map((o) => <option key={o}>{o}</option>)}</select>
  );
}

function FieldLabel({ children }) {
  return <label style={{ display: "block", fontSize: 12.5, fontFamily: font.body, color: C.muted, marginBottom: 6, fontWeight: 700 }}>{children}</label>;
}

function SectionHeader({ eyebrow, title, action }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, flexWrap: "wrap", gap: 12 }}>

        <h2 style={{ fontFamily: font.display, fontWeight: 800, fontSize: 26, color: C.text, margin: 0 }}>{title}</h2>
      </div>
      {action}
    </div>
  );
}

function Modal({ open, onClose, title, children, width = 500 }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(22,31,51,0.45)", backdropFilter: "blur(3px)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width, maxWidth: "90vw", maxHeight: "85vh", overflowY: "auto", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 22, padding: 28, boxShadow: shadow.lg, animation: "slideUp 0.28s cubic-bezier(.2,.8,.2,1)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <h3 style={{ fontFamily: font.display, fontWeight: 800, fontSize: 20, color: C.text, margin: 0 }}>{title}</h3>
          <div onClick={onClose} style={{ cursor: "pointer", color: C.muted, padding: 6 }}><X size={18} /></div>
        </div>
        {children}
      </div>
    </div>
  );
}

function Toast({ show, message }) {
  return (
    <div style={{
      position: "fixed", bottom: 26, left: 26, zIndex: 200, background: C.primary, color: "#fff",
      borderRadius: 14, padding: "13px 18px", display: "flex", alignItems: "center", gap: 10,
      fontFamily: font.body, fontSize: 13.5, fontWeight: 700, boxShadow: shadow.lg,
      transform: show ? "translateY(0)" : "translateY(16px)", opacity: show ? 1 : 0,
      pointerEvents: "none", transition: "all 0.3s cubic-bezier(.2,.8,.2,1)",
    }}><Check size={14} color={C.amber} /> {message}</div>
  );
}

function StatCard({ label, value, delta, positive, icon: Icon, prefix = "", tone = "coral" }) {
  const toneMap = { coral: C.coral, navy: C.primary, amber: "#B98A1E" };
  const tc = toneMap[tone];
  return (
    <Card style={{ padding: 20, flex: 1, minWidth: 190 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ width: 40, height: 40, borderRadius: 12, background: `${tc}17`, display: "flex", alignItems: "center", justifyContent: "center" }}><Icon size={18} color={tc} /></div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          {positive ? <ArrowUpRight size={13} color={C.success} /> : <ArrowDownRight size={13} color={C.danger} />}
          <span style={{ fontFamily: font.body, fontSize: 11.5, fontWeight: 700, color: positive ? C.success : C.danger }}>{delta}</span>
        </div>
      </div>
      <div style={{ fontFamily: font.display, fontWeight: 800, fontSize: 26, color: C.text, marginTop: 14 }}>{prefix}{value}</div>
      <div style={{ fontFamily: font.body, fontSize: 12.5, color: C.muted, marginTop: 4 }}>{label}</div>
    </Card>
  );
}

/* ============================== الطلاب ============================== */

function Students() {

  return (
    <div>
      <SectionHeader eyebrow="طلابك" title="الطلاب" action={<Button icon={Plus} onClick={() => setModalOpen(true)}>إضافة طالب</Button>} />

                <div style={{ width: 46, height: 46, borderRadius: 14, background: C.coralSoft, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: font.display, fontWeight: 800, fontSize: 15, color: C.coral }}>{p.name.slice(0, 1)}</div>
                <div>
                  <div style={{ fontFamily: font.display, fontWeight: 700, fontSize: 14.5, color: C.text }}>{p.name}</div>
                  <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.muted, marginTop: 2, direction: "ltr", textAlign: "right" }}>{p.phone}</div>

          <div><FieldLabel>الصف الدراسي</FieldLabel><Select options={["أولى ثانوي", "ثانية ثانوي", "ثالثة ثانوي", "إعدادي"]} /></div>
          <div style={{ gridColumn: "1 / -1" }}><FieldLabel>ملاحظات</FieldLabel><Input placeholder="مثال: يحتاج تقوية في الهندسة" /></div>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
          <Button icon={Check} onClick={save}>حفظ الطالب</Button>
          <Button variant="ghost" onClick={() => setModalOpen(false)}>إلغاء</Button>

          <div>

              <div style={{ width: 56, height: 56, borderRadius: 16, background: C.coralSoft, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: font.display, fontWeight: 800, fontSize: 19, color: C.coral }}>{selected.name.slice(0, 1)}</div>
              <div><div style={{ fontFamily: font.display, fontWeight: 800, fontSize: 17, color: C.text }}>{selected.name}</div><Badge tone="amber">{selected.tag}</Badge></div>
            </div>
            {[
              { icon: Phone, label: "ولي الأمر", v: selected.phone }, { icon: Clock, label: "آخر حصة", v: selected.last },
              { icon: Star, label: "متوسط الدرجات", v: selected.grade }, { icon: BookOpen, label: "ملاحظات", v: selected.note },

              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 0", borderBottom: `1px solid ${C.border}` }}>

      </Modal>
      <Toast show={toast} message="تم حفظ بيانات الطالب في العرض التجريبي." />

/* ============================== المصروفات ============================== */

function Payments() {
  const paid = PAYMENTS.filter(p => p.status === "مدفوع").reduce((a, b) => a + b.amount, 0);
  const unpaid = PAYMENTS.filter(p => p.status !== "مدفوع").reduce((a, b) => a + b.amount, 0);
  return (
    <div>
      <SectionHeader eyebrow="أموالك تحت السيطرة" title="المصروفات" action={<Button icon={Plus}>فاتورة جديدة</Button>} />
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 22 }}>
        <StatCard label="محصّل هذا الأسبوع" value={paid.toLocaleString()} prefix="ج.م " delta="+7%" positive icon={Banknote} tone="coral" />
        <StatCard label="مبالغ لسه مادفعتش" value={unpaid.toLocaleString()} prefix="ج.م " delta="فاتورة واحدة" positive={false} icon={Wallet} tone="navy" />
      </div>
      <Card style={{ padding: 0 }} hoverLift={false}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1.8fr 1fr 1fr 1fr", padding: "13px 20px", borderBottom: `1px solid ${C.border}`, fontFamily: font.body, fontSize: 11, color: C.muted, fontWeight: 700 }}>
          <div>الفاتورة</div><div>الطالب</div><div>المبلغ</div><div>الحالة</div><div>التاريخ</div>
        </div>
        {PAYMENTS.map((p) => (
          <div key={p.id} style={{ display: "grid", gridTemplateColumns: "1fr 1.8fr 1fr 1fr 1fr", padding: "14px 20px", borderBottom: `1px solid ${C.border}`, alignItems: "center" }}>
            <div style={{ fontFamily: font.body, fontSize: 12, color: C.muted, direction: "ltr", textAlign: "right" }}>{p.id}</div>
            <div style={{ fontFamily: font.body, fontSize: 13, color: C.text, fontWeight: 600 }}>{p.name}</div>
            <div style={{ fontFamily: font.display, fontWeight: 800, fontSize: 14, color: C.text }}>{p.amount} ج.م</div>
            <div><Badge tone={p.status === "مدفوع" ? "navy" : "danger"}>{p.status}</Badge></div>
            <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.muted }}>{p.date}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ============================== الإعدادات ============================== */

function Toggle({ defaultOn = false }) {
  const [on, setOn] = useState(defaultOn);
  return (
    <div onClick={() => setOn(!on)} style={{ width: 42, height: 24, borderRadius: 999, background: on ? C.coral : "#E1E7F2", cursor: "pointer", position: "relative", transition: "background 0.25s ease" }}>
      <div style={{ width: 18, height: 18, borderRadius: 999, background: "#fff", position: "absolute", top: 3, right: on ? 21 : 3, transition: "right 0.25s cubic-bezier(.2,.8,.2,1)" }} />
    </div>
  );
}

  const [tab, setTab] = useState("profile");
  const tabs = [{ id: "profile", l: "البيانات الشخصية" }, { id: "hours", l: "مواعيد الحصص" }, { id: "notif", l: "الإشعارات" }];
  return (
    <div>
      <SectionHeader eyebrow="خصّص سنترك" title="الإعدادات" />
      <div style={{ display: "grid", gridTemplateColumns: "200px 1fr", gap: 24 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
          {tabs.map((t) => (
            <div key={t.id} onClick={() => setTab(t.id)} style={{ padding: "11px 14px", borderRadius: 12, cursor: "pointer", fontFamily: font.body, fontSize: 13.5, fontWeight: 700, background: tab === t.id ? C.coralSoft : "transparent", color: tab === t.id ? C.coral : "#4A5471" }}>{t.l}</div>
          ))}
        </div>
        <Card style={{ padding: 26 }} hoverLift={false}>

                <div><div style={{ fontFamily: font.display, fontWeight: 800, fontSize: 18, color: C.text }}>{TUTOR.name}</div><div style={{ fontFamily: font.body, fontSize: 12.5, color: C.muted }}>{TUTOR.role}</div></div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <div><FieldLabel>الاسم</FieldLabel><Input placeholder={TUTOR.name} /></div>
                <div><FieldLabel>المادة</FieldLabel><Input placeholder="رياضيات" /></div>
                <div><FieldLabel>رقم الموبايل</FieldLabel><Input placeholder="01xxxxxxxxx" /></div>
                <div><FieldLabel>عنوان السنتر</FieldLabel><Input placeholder="المهندسين، الجيزة" /></div>

            </div>
          )}
          {tab === "hours" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>

                <div key={d} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: `1px solid ${C.border}` }}>
                  <span style={{ fontFamily: font.body, fontSize: 13.5, color: C.text, fontWeight: 600 }}>{d}</span>
                  {d === "الجمعة" ? <Badge tone="danger">إجازة</Badge> : <span style={{ fontFamily: font.body, fontSize: 12.5, color: C.muted }}>04:00 م — 09:00 م</span>}
                </div>
              ))}
            </div>
          )}
          {tab === "notif" && (
            <div>
              {[
                { l: "تذكير حصة لولي الأمر", d: "رسالة واتساب قبل الحصة بساعة" },
                { l: "تنبيه مصروفات متأخرة", d: "إشعار عند تأخر الدفع" },
                { l: "تقرير درجات أسبوعي", d: "ملخص أداء الطلاب لأولياء الأمور" },
              ].map((s, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 0", borderBottom: `1px solid ${C.border}` }}>
                  <div><div style={{ fontFamily: font.body, fontSize: 13.5, color: C.text, fontWeight: 700 }}>{s.l}</div><div style={{ fontFamily: font.body, fontSize: 11.5, color: C.muted, marginTop: 2 }}>{s.d}</div></div>

function DorosiApp() {
  useFonts();
  const [active, setActive] = useState("home");
  const label = NAV.find((n) => n.id === active)?.label;
  const screens = {
    home: <Home setActive={setActive} />, students: <Students />, sessions: <Sessions />,
    groups: <Groups />, payments: <Payments />, settings: <Settings />,
  };
  return (
    <div dir="rtl" style={{ display: "flex", height: "100vh", width: "100%", background: C.bg, fontFamily: font.body, color: C.text, overflow: "hidden" }}>
      <style>{`
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,107,74,0.25); border-radius: 8px; }
        input::placeholder { color: #A2ABC4; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      `}</style>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <Topbar label={label} />
        <div style={{ flex: 1, overflowY: "auto", padding: 28 }}>{screens[active]}</div>
      </div>
      <Sidebar active={active} setActive={setActive} />
    </div>
  );
}


const rootEl = document.getElementById("root");
