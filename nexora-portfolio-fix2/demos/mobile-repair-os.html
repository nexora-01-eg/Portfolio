<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تك فيكس — صيانة موبايلات وأجهزة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #3B82D6; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState } from "react";
import { Smartphone, Search, Bell, Plus, X, Wrench, Users, Package, ChevronRight } from "lucide-react";

const BG = "#090A0C"; const PANEL = "#121419"; const CARD = "#16181F"; const BORDER = "#26282F";
const TEXT = "#EEF1F5"; const MUTED = "#8B909B"; const GOLD = "#C9A227"; const GOLD_SOFT = "rgba(201,162,39,0.14)";
const BLUE = "#3B82D6"; const BLUE_SOFT = "rgba(59,130,214,0.16)"; const GREEN = "#3FA66B"; const RED = "#C24A4A";

const NAV = [{ icon: Wrench, label: "طلبات الصيانة" }, { icon: Users, label: "العملاء" }, { icon: Package, label: "قطع الغيار" }];

const stages = ["استلام", "تشخيص", "قيد الإصلاح", "اختبار", "جاهز"];

const initialTickets = [
  { device: "آيفون 13 برو", owner: "سيف الدين مراد", issue: "شاشة مكسورة", stage: 2 },
  { device: "سامسونج S22", owner: "ريهام عادل", issue: "بطارية ضعيفة", stage: 4 },
  { device: "آيفون 11", owner: "مينا فايز", issue: "مشكلة شحن", stage: 1 },
  { device: "شاومي نوت 12", owner: "أحمد سامي", issue: "مايفتحش", stage: 0 },
];

const customers = [{ name: "سيف الدين مراد", devices: 2 }, { name: "ريهام عادل", devices: 1 }, { name: "مينا فايز", devices: 3 }];

const parts = [{ name: "شاشة آيفون 13", stock: 6, price: "2,200 ج.م" }, { name: "بطارية سامسونج S22", stock: 4, price: "650 ج.م" }, { name: "منفذ شحن نوعي", stock: 20, price: "180 ج.م" }];

function Card({ children, className = "", style = {} }) { return <div className={`rounded-2xl border ${className}`} style={{ background: CARD, borderColor: BORDER, ...style }}>{children}</div>; }
function TopBar({ title, subtitle, onAdd, addLabel }) {
  return (
    <div className="flex items-center justify-between mb-8">
      <div><h1 className="text-2xl font-semibold tracking-tight">{title}</h1>{subtitle && <p className="text-sm mt-1" style={{ color: MUTED }}>{subtitle}</p>}</div>
      <div className="flex items-center gap-3">
        <div className="flex items-center gap-2 px-4 py-2.5 rounded-xl border" style={{ borderColor: BORDER, background: PANEL }}><Search size={15} style={{ color: MUTED }} /><span className="text-sm" style={{ color: MUTED }}>بحث...</span></div>
        {onAdd && <button onClick={onAdd} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm" style={{ background: BLUE, color: "#070F18" }}><Plus size={15} />{addLabel}</button>}
        <div className="w-10 h-10 rounded-xl border flex items-center justify-center" style={{ borderColor: BORDER, background: PANEL }}><Bell size={17} style={{ color: MUTED }} /></div>
      </div>
    </div>
  );
}
function Modal({ title, note, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24" style={{ background: "rgba(0,0,0,0.55)" }}>
      <Card className="w-full max-w-md p-7 relative" style={{ borderColor: BLUE }}>
        <button onClick={onClose} className="absolute left-5 top-5" style={{ color: MUTED }}><X size={18} /></button>
        <div className="text-lg font-semibold mb-1">{title}</div><div className="text-xs mb-6" style={{ color: MUTED }}>{note}</div>{children}
      </Card>
    </div>
  );
}
const inputStyle = { background: "#0E1015", borderColor: BORDER, color: TEXT };
const Field = ({ label, ...props }) => (<div className="mb-4"><label className="text-xs" style={{ color: MUTED }}>{label}</label><input {...props} className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl border text-sm outline-none" style={inputStyle} /></div>);

function NewTicketModal({ onClose, onCreate }) {
  const [device, setDevice] = useState(""); const [owner, setOwner] = useState(""); const [issue, setIssue] = useState("");
  return (
    <Modal title="استلام جهاز جديد" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="الجهاز" value={device} onChange={(e) => setDevice(e.target.value)} placeholder="مثال: أوبو رينو 8" />
      <Field label="اسم العميل" value={owner} onChange={(e) => setOwner(e.target.value)} placeholder="مثال: كريم صبحي" />
      <Field label="العطل" value={issue} onChange={(e) => setIssue(e.target.value)} placeholder="مثال: كسر في الكاميرا" />
      <button onClick={() => device.trim() && onCreate({ device, owner: owner || "—", issue: issue || "فحص عام", stage: 0 })} className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: BLUE, color: "#070F18" }}>استلام الجهاز</button>
    </Modal>
  );
}

function TicketsScreen({ tickets, onAdd }) {
  return (
    <>
      <TopBar title="طلبات الصيانة" subtitle={`${tickets.length} جهاز قيد المتابعة`} onAdd={onAdd} addLabel="استلام جهاز" />
      <div className="flex flex-col gap-5">
        {tickets.map((t) => (
          <Card key={t.device + t.owner} className="p-6">
            <div className="flex items-center justify-between mb-5">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: BLUE_SOFT }}><Smartphone size={17} style={{ color: BLUE }} /></div>
                <div><div className="text-sm font-medium">{t.device}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{t.owner} · {t.issue}</div></div>
              </div>
            </div>
            <div className="flex items-center">
              {stages.map((st, i) => (
                <React.Fragment key={st}>
                  <div className="flex flex-col items-center gap-2" style={{ minWidth: 80 }}>
                    <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs" style={{ background: i <= t.stage ? BLUE : "transparent", color: i <= t.stage ? "#070F18" : MUTED, border: `1.5px solid ${i <= t.stage ? BLUE : BORDER}` }}>{i + 1}</div>
                    <span className="text-xs text-center" style={{ color: i <= t.stage ? TEXT : MUTED }}>{st}</span>
                  </div>
                  {i !== stages.length - 1 && <div className="flex-1 h-0.5" style={{ background: i < t.stage ? BLUE : BORDER }} />}
                </React.Fragment>
              ))}
            </div>
          </Card>
        ))}
      </div>
    </>
  );
}
function CustomersScreen() {
  return (
    <>
      <TopBar title="العملاء" subtitle={`${customers.length} عملاء`} />
      <Card className="p-2">
        {customers.map((c, i) => (
          <div key={c.name} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== customers.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <span className="text-sm font-medium">{c.name}</span><span className="text-xs" style={{ color: MUTED }}>{c.devices} أجهزة</span>
          </div>
        ))}
      </Card>
    </>
  );
}
function PartsScreen() {
  return (
    <>
      <TopBar title="قطع الغيار" subtitle={`${parts.length} أصناف`} />
      <div className="grid grid-cols-3 gap-5">
        {parts.map((p) => (
          <Card key={p.name} className="p-5">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: BLUE_SOFT }}><Package size={16} style={{ color: BLUE }} /></div>
            <div className="text-sm font-medium">{p.name}</div>
            <div className="flex items-center justify-between mt-3"><span className="text-xs" style={{ color: p.stock < 5 ? RED : MUTED }}>{p.stock} بالمخزون</span><span className="text-sm" style={{ color: GOLD }}>{p.price}</span></div>
          </Card>
        ))}
      </div>
    </>
  );
}

function MobileRepairOS() {
  const [nav, setNav] = useState(0);
  const [tickets, setTickets] = useState(initialTickets);
  const [showModal, setShowModal] = useState(false);
  const screens = [<TicketsScreen tickets={tickets} onAdd={() => setShowModal(true)} />, <CustomersScreen />, <PartsScreen />];
  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans" style={{ background: BG, color: TEXT }}>
      <aside className="w-64 shrink-0 flex flex-col border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="px-6 py-7 flex items-center gap-3 border-b" style={{ borderColor: BORDER }}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: BLUE_SOFT, border: `1px solid ${BLUE}` }}><Smartphone size={19} style={{ color: BLUE }} /></div>
          <div><div className="text-base font-semibold tracking-tight">تك فيكس</div><div className="text-xs" style={{ color: MUTED }}>صيانة موبايلات وأجهزة</div></div>
        </div>
        <nav className="flex-1 px-3 py-5 flex flex-col gap-1">
          {NAV.map((item, i) => { const Icon = item.icon; const isActive = i === nav; return (
            <button key={item.label} onClick={() => setNav(i)} className="flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-colors text-right" style={{ background: isActive ? BLUE_SOFT : "transparent", color: isActive ? BLUE : MUTED, border: isActive ? `1px solid ${BLUE}` : "1px solid transparent" }}>
              <Icon size={17} /><span className="flex-1">{item.label}</span>{isActive && <ChevronRight size={14} />}
            </button>
          );})}
        </nav>
      </aside>
      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[nav]}</main>
      {showModal && <NewTicketModal onClose={() => setShowModal(false)} onCreate={(t) => { setTickets((p) => [t, ...p]); setShowModal(false); }} />}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<MobileRepairOS />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
