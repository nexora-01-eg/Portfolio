<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورشة — إدارة شغلك اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A1512;
  --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(193,97,59,0.20), transparent 60%),
             radial-gradient(ellipse 700px 500px at 0% 100%, rgba(201,162,39,0.10), transparent 55%),
             #1A1512;
  --raised:#221B16;
  --card: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.09);
  --clay:#C1613B;
  --clay-soft: rgba(193,97,59,0.18);
  --brass:#C9A227;
  --brass-soft: rgba(201,162,39,0.18);
  --olive:#8A9A5B;
  --olive-soft: rgba(138,154,91,0.18);
  --rust:#8C4A2F;
  --cream:#F3ECE4;
  --muted:#B8A995;
  --faint:#6E5F4E;
  --r-lg:24px;
  --ease: cubic-bezier(.22,1,.36,1);
  --shadow: 0 20px 46px -22px rgba(0,0,0,0.6);
  --font-display:'Almarai', sans-serif;
  --font-body:'Tajawal', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--cream); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; border-radius:8px; }
.device{ width:100%; max-width:430px; background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px), var(--raised); border-radius:32px; border:1px solid var(--border); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; }
.avatar{ width:44px; height:44px; border-radius:13px; background:linear-gradient(150deg, var(--brass), #7a611a); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:15px; color:#1A1512; flex-shrink:0; }
.hello .greet{ font-size:12px; color:var(--muted); }
.hello .name{ font-family:var(--font-display); font-weight:800; font-size:16px; margin-top:1px; }
.icon-btn{ width:38px; height:38px; border-radius:12px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
.icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }

.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(193,97,59,0.22), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; color:var(--clay); text-transform:uppercase; letter-spacing:.06em; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:800; font-size:22px; margin-top:12px; line-height:1.4; position:relative; z-index:1; }
.hero-title span{ color:var(--brass); }
.stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:18px; font-weight:800; }
.stat span{ font-size:10px; color:var(--muted); }

.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; }
.qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }

.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; }
.sec-head h2{ font-family:var(--font-display); font-weight:800; font-size:15.5px; }
.sec-head .more{ font-size:11px; color:var(--brass); }

.order-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:16px; margin-bottom:9px; }
.order-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.order-ic svg{ width:16px; height:16px; }
.order-info{ flex:1; min-width:0; }
.order-info .on{ font-weight:700; font-size:13px; }
.order-info .om{ font-size:11px; color:var(--muted); margin-top:2px; }
.stage{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; }
.stage.new{ background:var(--brass-soft); color:var(--brass); }
.stage.progress{ background:var(--clay-soft); color:var(--clay); }
.stage.done{ background:var(--olive-soft); color:var(--olive); }

.note-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; margin-bottom:9px; background:linear-gradient(120deg, var(--olive-soft), transparent); border:1px dashed rgba(138,154,91,0.4); }
.note-card .ic{ width:40px; height:40px; border-radius:12px; background:var(--olive-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.note-card .ic svg{ width:18px; height:18px; color:var(--olive); }
.note-card b{ font-size:12.5px; display:block; }
.note-card span{ font-size:11px; color:var(--muted); }

.chart-card{ padding:18px; margin-top:4px; }
.chart-top{ display:flex; justify-content:space-between; align-items:center; }
.chart-top h3{ font-family:var(--font-display); font-size:14px; font-weight:800; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--olive); background:var(--olive-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:800; font-size:24px; margin-top:8px; }
.chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }

.client-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); }
.client-row:first-child{ border-top:none; padding-top:0; }
.c-avatar{ width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:12px; font-weight:800; flex-shrink:0; }
.client-row .info{ flex:1; min-width:0; }
.client-row .cn{ font-size:12.5px; font-weight:700; }
.client-row .cm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.pay-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 8px; border-radius:20px; }
.pay-badge.paid{ background:var(--olive-soft); color:var(--olive); }
.pay-badge.due{ background:var(--clay-soft); color:var(--clay); }

.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:16px; background:linear-gradient(150deg, var(--clay), #7a3a20); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(193,97,59,0.55); z-index:20; }
.fab svg{ width:22px; height:22px; color:#1A1512; }

.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(26,21,18,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; }
.tab svg{ width:19px; height:19px; }
.tab.active{ color:var(--clay); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar">
    <div class="hello">
      <div class="avatar">هش</div>
      <div><div class="greet">صباح الخير يا معلم</div><div class="name">هشام النجار</div></div>
    </div>
    <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
  </div>

  <div class="scroll">
    <div class="glass hero-card">
      <div class="hero-eyebrow">شغل النهاردة</div>
      <div class="hero-title">عندك <span>٦ أوردرات</span> لازم تتسلّم<br>الأسبوع ده</div>
      <div class="stat-row">
        <div class="stat"><b id="s1">0</b><span>أوردرات مفتوحة</span></div>
        <div class="stat"><b id="s2">0</b><span>عملا جدد</span></div>
        <div class="stat"><b id="s3">0</b><span>مستحق ج.م</span></div>
      </div>
    </div>

    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--clay-soft); color:var(--clay);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>أوردر جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--brass-soft); color:var(--brass);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg></div><span>عميل جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--olive-soft); color:var(--olive);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--clay-soft); color:var(--clay);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7h-9M20 12h-9M20 17h-9M3 7h1v10H3zM3 17l3-3-3-3"/></svg></div><span>الجرد</span></div>
    </div>

    <div class="sec-head"><h2>أوردرات المتابعة</h2><span class="more">الكل</span></div>
    <div id="orderList"></div>

    <div class="sec-head"><h2>نمو الورشة</h2></div>
    <div class="glass chart-card">
      <div class="chart-top"><h3>مبيعات آخر ٧ أيام</h3><span class="chart-badge">▲ ٩٪</span></div>
      <div class="chart-num">١٨,٤٠٠ <small>جنيه هذا الأسبوع</small></div>
      <svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg>
    </div>

    <div class="sec-head"><h2>أحدث العملاء</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="clientList"></div>
  </div>

  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7h-9M20 12h-9M20 17h-9M3 7h1v10H3zM3 17l3-3-3-3"/></svg>الأوردرات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>العملا</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>

<script>
function animateCount(el,target,dur=1000){ const start=performance.now();
  function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); }
  requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),6); animateCount(document.getElementById('s2'),3); animateCount(document.getElementById('s3'),4200); },300);

const orders=[
  {name:'دولاب ٤ ضلف — عميل: وليد صابر', meta:'خشب زان · تسليم الخميس', stage:'progress', ic:'clay'},
  {name:'تنجيد صالون كامل — عميل: منى راضي', meta:'قماش مستورد · تسليم السبت', stage:'new', ic:'brass'},
  {note:true, title:'فاتورة الخشب استحقاقها بكرة', sub:'محل الأستاذ رمزي — ٢٤٠٠ جنيه'},
  {name:'مطبخ خطين — عميل: عمرو الديب', meta:'فورمايكا · تسليم الأحد', stage:'progress', ic:'clay'},
  {name:'باب دخلة — عميل: هالة نجيب', meta:'MDF مضغوط · جاهز', stage:'done', ic:'olive'},
];
document.getElementById('orderList').innerHTML = orders.map(o=>{
  if(o.note){
    return `<div class="note-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg></div><div><b>${o.title}</b><span>${o.sub}</span></div></div>`;
  }
  const labels={new:'جديد', progress:'شغل جاري', done:'خلص'};
  return `<div class="glass order-card">
    <div class="order-ic" style="background:var(--${o.ic}-soft); color:var(--${o.ic});"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 7h-9M20 12h-9M20 17h-9M3 7h1v10H3zM3 17l3-3-3-3"/></svg></div>
    <div class="order-info"><div class="on">${o.name}</div><div class="om">${o.meta}</div></div>
    <span class="stage ${o.stage}">${labels[o.stage]}</span>
  </div>`;
}).join('');

(function(){ const svg=document.getElementById('spark'); const vals=[18,22,20,26,24,30,34]; const W=340,H=70,pad=4,max=38;
  const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`;
  vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; });
  const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`;
  svg.innerHTML=`<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--olive)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--olive)" stop-opacity="0"/></linearGradient></defs>
  <path d="${fillD}" fill="url(#g2)" stroke="none"/><path d="${d}" fill="none" stroke="var(--olive)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();

const clients=[
  {name:'وليد صابر', meta:'دولاب ٤ ضلف', init:'وص', pay:'due'},
  {name:'منى راضي', meta:'تنجيد صالون', init:'مر', pay:'paid'},
  {name:'عمرو الديب', meta:'مطبخ خطين', init:'عد', pay:'due'},
  {name:'هالة نجيب', meta:'باب دخلة', init:'هن', pay:'paid'},
];
document.getElementById('clientList').innerHTML = clients.map(c=>`
  <div class="client-row"><div class="c-avatar">${c.init}</div>
    <div class="info"><div class="cn">${c.name}</div><div class="cm">${c.meta}</div></div>
    <span class="pay-badge ${c.pay}">${c.pay==='paid'?'اتحصّل':'مستحق'}</span>
  </div>`).join('');
</script>
</body>
</html>
