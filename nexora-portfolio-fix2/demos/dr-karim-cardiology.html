<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة د. كريم عبد الحميد — استشاري أمراض القلب والقسطرة</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#B91C3C; --crimson-dark:#8F1530; --crimson-soft:#FCE9ED;
  --gold:#D4A94F; --gold-soft:#FBF4E2;
  --bg:#FBF9F8; --surface:#FFFFFF;
  --text:#241417; --text-secondary:#4A3238; --muted:#8E7A7E; --faint:#DBC9CC;
  --border:#F1E4E6; --border-strong:#E3CDD1;
  --success:#1F9D5C; --success-soft:#E7F7EE;
  --warning:#D9932E; --warning-soft:#FBF1DF;
  --danger:#B91C3C; --danger-soft:#FCE9ED;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow-sm:0 2px 10px rgba(185,28,60,0.07);
  --shadow-md:0 12px 30px rgba(185,28,60,0.10);
  --shadow-lg:0 26px 56px rgba(185,28,60,0.20);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:900;margin:0;color:var(--text);letter-spacing:-.01em;}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 268px;min-height:100vh;}
.sidebar{background:linear-gradient(185deg,var(--crimson) 0%, var(--crimson-dark) 100%);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.15);}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
.brand-name{font-weight:900;font-size:15.5px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.68);margin-top:1px;}
.vip-tag{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--crimson-dark);font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;margin-top:6px;}
.nav-sec{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,0.8);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:var(--gold);color:var(--crimson-dark);}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:#fff;color:var(--crimson);font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);}
.trust-box{background:rgba(255,255,255,0.08);border-radius:14px;padding:12px;text-align:center;}
.trust-box .n{font-size:20px;font-weight:900;color:var(--gold);}
.trust-box .l{font-size:9.5px;color:rgba(255,255,255,0.7);margin-top:2px;}

.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(251,249,248,0.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;} .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:7px;left:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}

.content{padding:26px 28px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:26px;} .view-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-title{font-weight:800;font-size:15.5px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;border:1px solid transparent;transition:all .15s var(--ease);}
.btn-primary{background:var(--crimson);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--crimson-dark);transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--crimson-dark);}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--crimson-soft);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.stable{background:var(--success-soft);color:var(--success);}
.badge.watch{background:var(--warning-soft);color:var(--warning);}
.badge.critical{background:var(--danger-soft);color:var(--danger);}
.badge.gold{background:var(--gold-soft);color:#8A6425;}

.stat{padding:18px 20px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:700;}
.stat .value{font-size:24px;font-weight:900;}
.stat .trend{font-size:10.5px;font-weight:800;color:var(--success);margin-top:6px;display:inline-block;}

/* ECG signature */
.ecg-strip{position:relative;overflow:hidden;border-radius:var(--r-xl);background:linear-gradient(120deg,#3D0A16,#7A1230,#B91C3C);padding:26px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.ecg-left h2{color:#fff;font-size:21px;margin-bottom:5px;} .ecg-left p{color:rgba(255,255,255,0.75);font-size:12.5px;}
.ecg-svg{width:230px;height:56px;flex-shrink:0;}
.ecg-line{fill:none;stroke:#FFD166;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,209,102,0.7));}
.ecg-dash{stroke-dasharray:360;stroke-dashoffset:360;animation:dashDraw 2.6s linear infinite;}
@keyframes dashDraw{to{stroke-dashoffset:-360;}}
.ecg-stats{display:flex;gap:22px;flex-shrink:0;}
.ecg-stat{text-align:center;} .ecg-stat .v{font-size:22px;font-weight:900;} .ecg-stat .l{font-size:9.5px;color:rgba(255,255,255,0.62);text-transform:uppercase;margin-top:2px;}

/* Risk gauge */
.gauge{position:relative;width:96px;height:96px;}
.gauge svg{transform:rotate(-90deg);width:100%;height:100%;}
.gauge circle{fill:none;stroke-width:8;}
.gauge .track{stroke:var(--crimson-soft);}
.gauge .val{stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease);}
.gauge-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-label .num{font-size:19px;font-weight:900;} .gauge-label .txt{font-size:8.5px;color:var(--muted);margin-top:1px;}

/* Mini ECG per patient */
.mini-ecg{width:100%;height:38px;}
.mini-ecg path{fill:none;stroke:var(--crimson);stroke-width:1.8;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;font-size:10.5px;color:var(--faint);text-transform:uppercase;padding:0 12px 10px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--crimson-soft);}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;}

/* Calendar */
.cal-wrap{display:grid;grid-template-columns:64px repeat(5,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;}
.cal-head{padding:14px 8px;text-align:center;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--crimson-soft);}
.cal-time{font-size:10px;color:var(--faint);text-align:center;padding-top:8px;border-left:1px solid var(--border);height:70px;}
.cal-col{border-right:1px solid var(--border);position:relative;}
.cal-slot{height:70px;border-bottom:1px dashed var(--border);}
.appt-block{position:absolute;right:4px;left:4px;border-radius:10px;padding:7px 9px;font-size:10.5px;color:#fff;background:var(--crimson);cursor:pointer;}
.appt-block b{display:block;font-size:11px;color:var(--gold);}

/* Testimonial */
.testi-card{background:var(--crimson-soft);border-radius:var(--r-lg);padding:16px;}
.testi-card p{font-size:12.5px;color:var(--text-secondary);line-height:1.7;font-style:italic;}
.testi-stars{color:var(--gold);margin-bottom:8px;}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--crimson-dark);color:#fff;padding:11px 17px;border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1150px){ .shell{grid-template-columns:1fr 78px;} .brand-name,.brand-sub,.vip-tag,.nav-item span:not(.ic),.nav-sec,.trust-box .l,.nav-badge{display:none;} .cal-wrap{grid-template-columns:50px repeat(5,minmax(110px,1fr));overflow-x:auto;} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} .ecg-strip{flex-direction:column;align-items:flex-start;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">عيادة د. كريم عبد الحميد للقلب والقسطرة</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-gold" onclick="switchView('v-appointments')">+ حجز موعد</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-patients"></section>
      <section class="view" id="v-appointments"></section>
      <section class="view" id="v-ecg"></section>
      <section class="view" id="v-profile"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <img src="https://i.pravatar.cc/104?img=52">
      <div><div class="brand-name">د. كريم عبد الحميد</div><div class="brand-sub">استشاري أمراض القلب والقسطرة</div><span class="vip-tag">⭐ VIP CARDIAC CARE</span></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-appointments"><span class="ic">🗓️</span><span>المواعيد</span></div>
      <div class="nav-item" data-view="v-ecg"><span class="ic">💓</span><span>قراءات القلب وECG</span></div>
      <div class="nav-sec">المرضى</div>
      <div class="nav-item" data-view="v-patients"><span class="ic">🫀</span><span>ملفات المرضى</span><span class="nav-badge">2</span></div>
      <div class="nav-sec">الحساب</div>
      <div class="nav-item" data-view="v-profile"><span class="ic">🧑‍⚕️</span><span>الملف الشخصي</span></div>
      <div class="nav-item" data-view="v-settings"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="trust-box">
        <div class="n">+6,400</div>
        <div class="l">مريض تمت متابعته منذ 2011</div>
      </div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط. هذا مشروع عرض تصميمي وليس نظامًا طبيًا حقيقيًا */
const patients = [
  {name:"عادل حسني فهمي", age:61, condition:"رجفان أذيني", status:"watch", risk:58, bp:"138/88", hr:82, lastVisit:"منذ 4 أيام", img:22, ecg:"M0,20 L15,20 L20,5 L25,35 L30,15 L35,20 L60,20 L65,8 L70,30 L75,20 L100,20"},
  {name:"سميحة الجمل", age:54, condition:"ضغط دم مرتفع", status:"stable", risk:34, bp:"122/79", hr:71, lastVisit:"منذ أسبوع", img:44, ecg:"M0,20 L18,20 L23,10 L28,30 L33,18 L38,20 L60,20 L65,12 L70,28 L75,20 L100,20"},
  {name:"مصطفى الديب", age:68, condition:"قصور بالشريان التاجي", status:"critical", risk:81, bp:"151/95", hr:94, lastVisit:"أمس", img:13, ecg:"M0,20 L12,20 L17,2 L22,38 L27,20 L32,20 L60,20 L65,4 L70,36 L75,20 L100,20"},
  {name:"فاطمة راشد", age:45, condition:"متابعة ما بعد القسطرة", status:"stable", risk:22, bp:"118/75", hr:68, lastVisit:"منذ 3 أيام", img:47, ecg:"M0,20 L20,20 L25,11 L30,29 L35,20 L60,20 L65,13 L70,27 L75,20 L100,20"},
  {name:"جمال عوض الله", age:72, condition:"هبوط بالقلب المزمن", status:"watch", risk:64, bp:"142/90", hr:88, lastVisit:"منذ يومين", img:19, ecg:"M0,20 L14,20 L19,6 L24,34 L29,16 L34,20 L60,20 L65,9 L70,31 L75,20 L100,20"},
];
const appointments = [
  {patient:"عادل حسني فهمي", type:"متابعة رجفان أذيني", day:0, start:0, span:1},
  {patient:"سميحة الجمل", type:"فحص دوري", day:1, start:1, span:1},
  {patient:"مصطفى الديب", type:"استشارة قسطرة عاجلة", day:2, start:2, span:1},
  {patient:"فاطمة راشد", type:"متابعة ما بعد العملية", day:3, start:0, span:1},
  {patient:"جمال عوض الله", type:"تخطيط قلب دوري", day:4, start:3, span:1},
];
const days = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء'];
const hours = ['9:00 ص','11:00 ص','1:00 م','3:00 م'];
const testimonials = [
  {name:"عادل حسني فهمي", text:"دكتور كريم غيّر حياتي، متابعة دقيقة وشرح مريح جدًا لكل حالة.", rating:5},
  {name:"فاطمة راشد", text:"أفضل دكتور قسطرة تعاملت معه، متابعة بعد العملية ممتازة.", rating:5},
  {name:"جمال عوض الله", text:"صبور جدًا في الشرح ودايمًا مطمن المريض قبل أي حاجة.", rating:5},
];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','عيادة د. كريم عبد الحميد للقلب والقسطرة'],
    'v-patients':['ملفات المرضى', patients.length+' مريض تحت المتابعة'],
    'v-appointments':['المواعيد','الأسبوع الحالي'],
    'v-ecg':['قراءات القلب وECG','آخر تخطيطات القلب المسجلة'],
    'v-profile':['الملف الشخصي','السيرة المهنية لـ د. كريم عبد الحميد'],
    'v-settings':['الإعدادات','بيانات العيادة'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}
const statusMap = {stable:'مستقر',watch:'تحت الملاحظة',critical:'حرجة'};
function gauge(val){
  const r=40,c=2*Math.PI*r,off=c-(val/100)*c;
  const color = val>=65?'var(--danger)':val>=40?'var(--warning)':'var(--success)';
  return `<div class="gauge"><svg viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="${r}"></circle>
    <circle class="val" cx="50" cy="50" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
  </svg><div class="gauge-label"><div class="num">${val}%</div><div class="txt">مخاطر</div></div></div>`;
}
function miniEcg(path){
  return `<svg class="mini-ecg" viewBox="0 0 100 40"><path d="${path}"/></svg>`;
}

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، دكتور كريم 🩺</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦ — عيادة القلب والقسطرة</p></div>
      <button class="btn btn-outline" onclick="switchView('v-appointments')">عرض جدول اليوم</button></div>
    <div class="ecg-strip fade-el" style="margin-bottom:18px">
      <div class="ecg-left"><h2>نبض العيادة الآن</h2><p>لقطة حية لنشاط اليوم العلاجي</p></div>
      <svg class="ecg-svg" viewBox="0 0 230 56"><path class="ecg-line ecg-dash" d="M0,28 L30,28 L38,8 L48,48 L58,18 L66,28 L90,28 L98,12 L108,42 L118,28 L230,28"/></svg>
      <div class="ecg-stats">
        <div class="ecg-stat"><div class="v">76</div><div class="l">متوسط النبض</div></div>
        <div class="ecg-stat"><div class="v">${patients.length}</div><div class="l">مرضى اليوم</div></div>
        <div class="ecg-stat"><div class="v">98%</div><div class="l">رضا المرضى</div></div>
      </div>
    </div>
    <div class="grid g4" style="margin-bottom:18px">
      ${stat('مواعيد اليوم', appointments.length+' موعد','🗓️','var(--crimson)','2 استشارة عاجلة')}
      ${stat('حالات تحت الملاحظة',patients.filter(p=>p.status==='watch').length+' حالة','👁️','var(--warning)','متابعة أسبوعية')}
      ${stat('إيراد الشهر','٣٤٦٬٢٠٠ ج.م','💰','var(--success)','+9.1%')}
      ${stat('حالات حرجة',patients.filter(p=>p.status==='critical').length+' حالة','🚨','var(--danger)','بحاجة لتدخل عاجل')}
    </div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="card-title" style="margin-bottom:16px">مرضى بحاجة لمتابعة</div>
        ${patients.filter(p=>p.status!=='stable').map(p=>`
          <div class="flex justify-between items-center" style="padding:11px 0;border-bottom:1px dashed var(--border)">
            <div class="flex items-center gap3">${p.img?`<img class="avatar" width="36" height="36" src="https://i.pravatar.cc/72?img=${p.img}">`:''}<div><b style="font-size:13px">${p.name}</b><div class="muted" style="font-size:11px">${p.condition}</div></div></div>
            <span class="badge ${p.status}">${statusMap[p.status]}</span>
          </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:12px">آراء المرضى</div>
        <div class="testi-card">
          <div class="testi-stars">★★★★★</div>
          <p>"${testimonials[0].text}"</p>
          <div style="margin-top:10px;font-weight:800;font-size:12px">— ${testimonials[0].name}</div>
        </div>
      </div>
    </div>
  `;
}

function renderPatients(){
  const el = document.getElementById('v-patients');
  el.innerHTML = `
    <div class="view-head"><div><h1>ملفات المرضى</h1><p class="sub">${patients.length} مريض تحت المتابعة</p></div>
      <button class="btn btn-primary">+ مريض جديد</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>المريض</th><th>الحالة الطبية</th><th>ضغط الدم</th><th>نسبة الخطورة</th><th>آخر زيارة</th><th>الحالة</th></tr></thead>
      <tbody>${patients.map(p=>`
        <tr onclick="UI.toast('ملف ${p.name}')">
          <td><div class="cell-name"><img class="avatar" width="34" height="34" src="https://i.pravatar.cc/68?img=${p.img}">${p.name} <span class="muted" style="font-weight:500">(${p.age})</span></div></td>
          <td>${p.condition}</td><td>${p.bp}</td>
          <td style="width:80px">${gaugeSmall(p.risk)}</td>
          <td>${p.lastVisit}</td>
          <td><span class="badge ${p.status}">${statusMap[p.status]}</span></td>
        </tr>`).join('')}</tbody>
    </table></div></div>
  `;
}
function gaugeSmall(v){
  const color = v>=65?'var(--danger)':v>=40?'var(--warning)':'var(--success)';
  return `<div class="flex items-center gap2"><div style="flex:1;height:6px;background:var(--crimson-soft);border-radius:99px;overflow:hidden"><div style="height:100%;width:${v}%;background:${color}"></div></div><b style="font-size:11px">${v}%</b></div>`;
}

function renderAppointments(){
  const el = document.getElementById('v-appointments');
  el.innerHTML = `<div class="view-head"><div><h1>المواعيد</h1><p class="sub">الأسبوع الحالي</p></div>
    <button class="btn btn-gold">+ حجز موعد</button></div>
    <div class="cal-wrap" id="calWrap"></div>`;
  let html = `<div class="cal-head" style="background:#fff"></div>`;
  days.forEach(d=> html += `<div class="cal-head">${d}</div>`);
  html += `<div>`+hours.map(h=>`<div class="cal-time">${h}</div>`).join('')+`</div>`;
  for(let d=0; d<5; d++){
    html += `<div class="cal-col">`;
    hours.forEach(()=> html += `<div class="cal-slot"></div>`);
    appointments.filter(a=>a.day===d).forEach(a=>{
      html += `<div class="appt-block" style="top:${a.start*70+4}px;height:${a.span*70-8}px" onclick="UI.toast('${a.patient} — ${a.type}')">
        <b>${a.patient}</b>${a.type}
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('calWrap').innerHTML = html;
}

function renderECG(){
  const el = document.getElementById('v-ecg');
  el.innerHTML = `
    <div class="view-head"><div><h1>قراءات القلب وECG</h1><p class="sub">آخر تخطيطات القلب المسجلة</p></div>
      <button class="btn btn-primary">+ تسجيل قراءة جديدة</button></div>
    <div class="grid g2">
      ${patients.map(p=>`
        <div class="card card-pad">
          <div class="flex justify-between items-center" style="margin-bottom:10px">
            <div class="flex items-center gap2"><img class="avatar" width="32" height="32" src="https://i.pravatar.cc/64?img=${p.img}"><b style="font-size:13px">${p.name}</b></div>
            <span class="badge ${p.status}">${statusMap[p.status]}</span>
          </div>
          ${miniEcg(p.ecg)}
          <div class="flex justify-between" style="margin-top:10px;font-size:11.5px">
            <span class="muted">نبض القلب: <b style="color:var(--text)">${p.hr} bpm</b></span>
            <span class="muted">ضغط الدم: <b style="color:var(--text)">${p.bp}</b></span>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function renderProfile(){
  const el = document.getElementById('v-profile');
  el.innerHTML = `
    <div class="view-head"><div><h1>الملف الشخصي</h1><p class="sub">السيرة المهنية المعروضة للمرضى</p></div>
      <button class="btn btn-outline">تعديل الملف</button></div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="flex items-center gap3" style="margin-bottom:16px">
          <img src="https://i.pravatar.cc/120?img=52" width="72" height="72" style="border-radius:50%">
          <div><h3 style="font-size:19px">د. كريم عبد الحميد</h3><div class="muted" style="font-size:12.5px;margin-top:3px">استشاري أمراض القلب والقسطرة القلبية</div><div class="testi-stars" style="margin-top:6px">★★★★★ <span class="muted" style="font-size:11px">(4.9 من 312 تقييم)</span></div></div>
        </div>
        <p class="muted" style="font-size:13px;line-height:1.8;margin-bottom:16px">استشاري أمراض القلب والقسطرة، خبرة تزيد عن 15 عامًا في تشخيص وعلاج أمراض الشرايين التاجية، عضو الجمعية المصرية لأمراض القلب، وحاصل على زمالة القسطرة القلبية من ألمانيا.</p>
        <div class="grid g3">
          <div><div class="muted" style="font-size:10.5px">التخصص</div><b style="font-size:12.5px">قسطرة قلبية</b></div>
          <div><div class="muted" style="font-size:10.5px">سنوات الخبرة</div><b style="font-size:12.5px">15+ سنة</b></div>
          <div><div class="muted" style="font-size:10.5px">اللغات</div><b style="font-size:12.5px">عربي، إنجليزي</b></div>
        </div>
      </div>
      <div class="flex-col gap3">
        ${testimonials.map(t=>`
          <div class="testi-card" style="margin-bottom:12px">
            <div class="testi-stars">${'★'.repeat(t.rating)}</div>
            <p>"${t.text}"</p>
            <div style="margin-top:10px;font-weight:800;font-size:12px">— ${t.name}</div>
          </div>`).join('')}
      </div>
    </div>
  `;

function renderSettings(){
  document.getElementById('v-settings').innerHTML = `
    <div class="view-head"><div><h1>الإعدادات</h1><p class="sub">بيانات العيادة</p></div></div>
    <div class="card card-pad" style="max-width:560px">
      <p class="muted" style="font-size:13px;margin-bottom:16px">إعدادات اسم العيادة، مواعيد العمل، وأنظمة التذكير بالمواعيد.</p>
      <button class="btn btn-primary" onclick="UI.toast('تم حفظ الإعدادات')">حفظ التغييرات</button>
    </div>
  `;
}

renderDashboard(); renderPatients(); renderAppointments(); renderECG(); renderProfile(); renderSettings();
</script>
</body>
</html>
