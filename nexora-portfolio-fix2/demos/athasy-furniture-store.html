<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أثاثي — قطع أثاث تدوم أجيال</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%9B%8B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #8A5A2E; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState, useEffect, useMemo } from "react";
import {
  Armchair, Search, Heart, ShoppingBag, X, Check, Truck, ShieldCheck, Sparkles,
} from "lucide-react";

const FONT_ID = "athasy-fonts";
function useFonts() {
  useEffect(() => {
    if (document.getElementById(FONT_ID)) return;
    const l = document.createElement("link");
    l.id = FONT_ID; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap";
    document.head.appendChild(l);
  }, []);
}

const C = {
  bg: "#F7F2EA", surface: "#FFFFFF", border: "#E9DCC5",
  ink: "#2B211A", muted: "#83725D",
  wood: "#8A5A2E", woodSoft: "rgba(138,90,46,0.1)", olive: "#6E7A4F",
};
const font = { display: "'Cairo', sans-serif", body: "'Cairo', sans-serif" };
const shadow = { sm: "0 1px 3px rgba(43,33,26,0.06)", md: "0 10px 26px rgba(43,33,26,0.08)", lg: "0 22px 48px rgba(43,33,26,0.16)" };

const STORE = { name: "أثاثي", tagline: "قطع أثاث تدوم أجيال، بلمسة مصرية أصيلة" };
const ROOMS = ["الكل", "غرفة معيشة", "غرفة نوم", "مطبخ", "مكتب"];
const PRODUCTS = [
  { id: 1, room: "غرفة معيشة", name: "أنتريه كلاسيك مُنجّد", price: 18500, tag: "الأكثر مبيعًا" },
  { id: 2, room: "غرفة نوم", name: "غرفة نوم خشب زان كاملة", price: 32000, tag: "" },
  { id: 3, room: "مطبخ", name: "طاولة سفرة 6 كراسي", price: 9800, tag: "خصم" },
  { id: 4, room: "مكتب", name: "مكتب خشبي مودرن", price: 4200, tag: "جديد" },
  { id: 5, room: "غرفة معيشة", name: "كرسي بذراعين مخملي", price: 3600, tag: "" },
  { id: 6, room: "غرفة نوم", name: "تسريحة بمرآة إضاءة", price: 5400, tag: "" },
];

function AthasyFurnitureStore() {
  useFonts();
  const [room, setRoom] = useState("الكل");
  const [query, setQuery] = useState("");
  const [favs, setFavs] = useState({});
  const [cart, setCart] = useState(0);
  const [opened, setOpened] = useState(null);

  const filtered = useMemo(() => {
    let list = room === "الكل" ? PRODUCTS : PRODUCTS.filter((p) => p.room === room);
    if (query) list = list.filter((p) => p.name.includes(query));
    return list;
  }, [room, query]);

  return (
    <div dir="rtl" style={{ background: C.bg, minHeight: "100vh", fontFamily: font.body, color: C.ink }}>
      <style>{`* { box-sizing: border-box; } input::placeholder { color: #B2A184; }`}</style>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 30px", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, background: "rgba(247,242,234,0.92)", backdropFilter: "blur(10px)", zIndex: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><div style={{ width: 36, height: 36, borderRadius: 10, background: C.wood, display: "flex", alignItems: "center", justifyContent: "center" }}><Armchair size={18} color="#fff" /></div><span style={{ fontFamily: font.display, fontWeight: 800, fontSize: 18, color: C.ink }}>{STORE.name}</span></div>
        <div style={{ position: "relative" }}><ShoppingBag size={19} color={C.ink} />{cart > 0 && <div style={{ position: "absolute", top: -6, right: -6, width: 15, height: 15, borderRadius: "50%", background: C.wood, color: "#fff", fontSize: 9, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: font.body, fontWeight: 700 }}>{cart}</div>}</div>
      </div>

      <div style={{ padding: "44px 30px 30px", textAlign: "center", background: "linear-gradient(180deg, #F0E6D2, transparent)" }}>
        <Sparkles size={16} color={C.wood} />
        <h1 style={{ fontFamily: font.display, fontWeight: 300, fontSize: 30, color: C.ink, margin: "12px 0 8px" }}>{STORE.tagline}</h1>
      </div>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 30px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "11px 16px", marginBottom: 18, maxWidth: 380 }}>
          <Search size={15} color={C.muted} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث عن قطعة أثاث..." style={{ background: "transparent", border: "none", outline: "none", flex: 1, fontFamily: font.body, fontSize: 13, textAlign: "right" }} />
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 26, flexWrap: "wrap" }}>
          {ROOMS.map((r) => (<div key={r} onClick={() => setRoom(r)} style={{ padding: "8px 16px", borderRadius: 999, cursor: "pointer", fontFamily: font.body, fontSize: 12.5, fontWeight: 700, border: `1px solid ${room === r ? C.wood : C.border}`, background: room === r ? C.woodSoft : C.surface, color: room === r ? C.wood : C.muted }}>{r}</div>))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 20, paddingBottom: 60 }}>
          {filtered.map((p) => (
            <div key={p.id} onClick={() => setOpened(p)} style={{ cursor: "pointer" }}>
              <div style={{ position: "relative", aspectRatio: "1", borderRadius: 16, background: `linear-gradient(160deg, ${C.woodSoft}, #E9DCC5)`, overflow: "hidden" }}>
                {p.tag && <div style={{ position: "absolute", top: 10, right: 10, background: C.wood, color: "#fff", fontFamily: font.body, fontWeight: 700, fontSize: 10, padding: "4px 10px", borderRadius: 999 }}>{p.tag}</div>}
                <div onClick={(e) => { e.stopPropagation(); setFavs((f) => ({ ...f, [p.id]: !f[p.id] })); }} style={{ position: "absolute", top: 10, left: 10, width: 30, height: 30, borderRadius: "50%", background: "rgba(255,255,255,0.85)", display: "flex", alignItems: "center", justifyContent: "center" }}><Heart size={13} color={C.wood} fill={favs[p.id] ? C.wood : "none"} /></div>
              </div>
              <div style={{ marginTop: 10 }}>
                <div style={{ fontFamily: font.body, fontSize: 13, fontWeight: 600, color: C.ink }}>{p.name}</div>
                <div style={{ fontFamily: font.display, fontWeight: 700, fontSize: 14, color: C.wood, marginTop: 4 }}>{p.price.toLocaleString()} ج.م</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {opened && (
        <div onClick={() => setOpened(null)} style={{ position: "fixed", inset: 0, background: "rgba(43,33,26,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: 460, maxWidth: "100%", background: C.surface, borderRadius: 22, overflow: "hidden", boxShadow: shadow.lg }}>
            <div style={{ aspectRatio: "16/10", background: `linear-gradient(160deg, ${C.woodSoft}, #E9DCC5)`, position: "relative" }}>
              <div onClick={() => setOpened(null)} style={{ position: "absolute", top: 14, left: 14, width: 32, height: 32, borderRadius: 10, background: "rgba(255,255,255,0.9)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><X size={15} /></div>
            </div>
            <div style={{ padding: 24 }}>
              <div style={{ fontFamily: font.display, fontWeight: 700, fontSize: 19, color: C.ink }}>{opened.name}</div>
              <div style={{ fontFamily: font.display, fontWeight: 800, fontSize: 22, color: C.wood, marginTop: 8 }}>{opened.price.toLocaleString()} ج.م</div>
              <button onClick={() => { setCart((c) => c + 1); setOpened(null); }} style={{ width: "100%", marginTop: 18, padding: "14px 0", borderRadius: 12, border: "none", background: C.wood, color: "#fff", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><ShoppingBag size={16} /> أضف للسلة</button>
              <div style={{ display: "flex", gap: 16, marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}` }}>
                <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: font.body, fontSize: 10.5, color: C.muted }}><Truck size={13} /> شحن لكل المحافظات</span>
                <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: font.body, fontSize: 10.5, color: C.muted }}><ShieldCheck size={13} /> ضمان سنتين</span>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<AthasyFurnitureStore />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
