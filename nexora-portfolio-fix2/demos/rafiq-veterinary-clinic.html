<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>RafiqVeterinary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { scroll-behavior: smooth; }
  * { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  ::selection { background: rgba(201,162,39,0.28); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(120,110,100,0.28); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(120,110,100,0.45); }

  button, [role="button"] {
    transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, filter .2s ease, opacity .2s ease !important;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.05); }
  button:active { transform: translateY(0px) scale(0.98); }

  #root [style*="cursor: pointer"], #root [style*="cursor:pointer"] {
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  #root [style*="cursor: pointer"]:hover, #root [style*="cursor:pointer"]:hover {
    transform: translateY(-3px);
  }

  #root img { transition: transform .5s cubic-bezier(.2,.8,.2,1); }

  #root { animation: vipFadeIn .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes vipFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .vip-loading {
    position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
    background: #0c0a0b; transition: opacity .5s ease, visibility .5s ease;
  }
  .vip-loading.hide { opacity: 0; visibility: hidden; }
  .vip-ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(201,162,39,0.18); border-top-color: #C9A227;
    animation: vipSpin 0.9s linear infinite;
  }
  @keyframes vipSpin { to { transform: rotate(360deg); } }

  .vip-error {
    position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center;
    background: #0c0a0b; color: #f5efee; font-family: system-ui, sans-serif; text-align: center; padding: 24px; direction: rtl;
  }
</style>
</head>
<body>
<div class="vip-loading" id="vip-loading"><div class="vip-ring"></div></div>
<div class="vip-error" id="vip-error">
  <div>
    <div style="font-size:18px; font-weight:700; margin-bottom:8px;">حصل خطأ أثناء تحميل الصفحة</div>
    <div style="font-size:13px; opacity:.7;" id="vip-error-detail"></div>
  </div>
</div>
<div id="root"></div>
<script>
window.addEventListener("error", function(e) { showError(e && e.message); });
window.addEventListener("unhandledrejection", function(e) { showError(e && e.reason && e.reason.message); });
function showError(msg) {
  var l = document.getElementById("vip-loading");
  var e = document.getElementById("vip-error");
  var d = document.getElementById("vip-error-detail");
  if (l) l.classList.add("hide");
  if (e) e.style.display = "flex";
  if (d && msg) d.textContent = msg;
}
</script>
