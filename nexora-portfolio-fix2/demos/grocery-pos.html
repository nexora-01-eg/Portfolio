<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سوبر ماركت البركة — نظام نقاط بيع ومخزون</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #4CAF6D; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState } from "react";
import { ShoppingBasket, Search, Bell, Plus, X, LayoutGrid, Package, Receipt, ChevronRight } from "lucide-react";

const BG = "#090A09"; const PANEL = "#131513"; const CARD = "#171917"; const BORDER = "#262926";
const TEXT = "#EFF2EF"; const MUTED = "#8D948D"; const GOLD = "#C9A227"; const GOLD_SOFT = "rgba(201,162,39,0.14)";
const GREEN = "#4CAF6D"; const GREEN_SOFT = "rgba(76,175,109,0.16)"; const RED = "#C24A4A";

const NAV = [{ icon: LayoutGrid, label: "نظرة عامة" }, { icon: Package, label: "المخزون" }, { icon: Receipt, label: "الفواتير" }];

const kpis = [{ label: "مبيعات اليوم", value: "18,400 ج.م" }, { label: "فواتير اليوم", value: "212" }, { label: "أصناف منخفضة", value: "9" }, { label: "أكثر صنف مبيعًا", value: "أرز" }];

const initialInventory = [
  { name: "أرز أبيض 1كجم", stock: 120, price: "28 ج.م", low: false },
  { name: "زيت عباد شمس 1ل", stock: 8, price: "65 ج.م", low: true },
  { name: "سكر 1كجم", stock: 200, price: "24 ج.م", low: false },
  { name: "شاي أحمر 100ج", stock: 6, price: "45 ج.م", low: true },
];

const invoices = [{ id: "#POS-9911", total: "142 ج.م", items: 6 }, { id: "#POS-9910", total: "88 ج.م", items: 3 }, { id: "#POS-9908", total: "310 ج.م", items: 14 }];

function Card({ children, className = "", style = {} }) { return <div className={`rounded-2xl border ${className}`} style={{ background: CARD, borderColor: BORDER, ...style }}>{children}</div>; }
function TopBar({ title, subtitle, onAdd, addLabel }) {
  return (
    <div className="flex items-center justify-between mb-8">
      <div><h1 className="text-2xl font-semibold tracking-tight">{title}</h1>{subtitle && <p className="text-sm mt-1" style={{ color: MUTED }}>{subtitle}</p>}</div>
      <div className="flex items-center gap-3">
        <div className="flex items-center gap-2 px-4 py-2.5 rounded-xl border" style={{ borderColor: BORDER, background: PANEL }}><Search size={15} style={{ color: MUTED }} /><span className="text-sm" style={{ color: MUTED }}>بحث بالباركود...</span></div>
        {onAdd && <button onClick={onAdd} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm" style={{ background: GREEN, color: "#06120A" }}><Plus size={15} />{addLabel}</button>}
        <div className="w-10 h-10 rounded-xl border flex items-center justify-center" style={{ borderColor: BORDER, background: PANEL }}><Bell size={17} style={{ color: MUTED }} /></div>
      </div>
    </div>
  );
}
function Modal({ title, note, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24" style={{ background: "rgba(0,0,0,0.55)" }}>
      <Card className="w-full max-w-md p-7 relative" style={{ borderColor: GREEN }}>
        <button onClick={onClose} className="absolute left-5 top-5" style={{ color: MUTED }}><X size={18} /></button>
        <div className="text-lg font-semibold mb-1">{title}</div><div className="text-xs mb-6" style={{ color: MUTED }}>{note}</div>{children}
      </Card>
    </div>
  );
}
const inputStyle = { background: "#0F110F", borderColor: BORDER, color: TEXT };
const Field = ({ label, ...props }) => (<div className="mb-4"><label className="text-xs" style={{ color: MUTED }}>{label}</label><input {...props} className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl border text-sm outline-none" style={inputStyle} /></div>);

function NewItemModal({ onClose, onCreate }) {
  const [name, setName] = useState(""); const [stock, setStock] = useState(""); const [price, setPrice] = useState("");
  return (
    <Modal title="إضافة صنف جديد" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="اسم الصنف" value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: عدس أصفر 1كجم" />
      <Field label="الكمية" value={stock} onChange={(e) => setStock(e.target.value)} placeholder="مثال: 60" />
      <Field label="السعر" value={price} onChange={(e) => setPrice(e.target.value)} placeholder="مثال: 32 ج.م" />
      <button onClick={() => name.trim() && onCreate({ name, stock: Number(stock) || 0, price: price || "—", low: Number(stock) < 10 })} className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: GREEN, color: "#06120A" }}>إضافة للمخزون</button>
    </Modal>
  );
}

function OverviewScreen() {
  return (
    <>
      <TopBar title="نظرة عامة على السوبر ماركت" subtitle="متابعة المبيعات والمخزون لحظيًا" />
      <div className="grid grid-cols-4 gap-5">{kpis.map((k) => <Card key={k.label} className="p-5"><div className="text-xs mb-3" style={{ color: MUTED }}>{k.label}</div><div className="text-xl font-semibold">{k.value}</div></Card>)}</div>
    </>
  );
}
function InventoryScreen({ inventory, onAdd }) {
  return (
    <>
      <TopBar title="المخزون" subtitle={`${inventory.length} صنفًا`} onAdd={onAdd} addLabel="صنف جديد" />
      <div className="grid grid-cols-4 gap-5">
        {inventory.map((m) => (
          <Card key={m.name} className="p-5" style={{ borderColor: m.low ? RED : BORDER }}>
            <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: GREEN_SOFT }}><Package size={16} style={{ color: GREEN }} /></div>
            <div className="text-sm font-medium">{m.name}</div>
            <div className="flex items-center justify-between mt-3">
              <span className="text-xs" style={{ color: m.low ? RED : MUTED }}>{m.stock} بالمخزون</span>
              <span className="text-sm" style={{ color: GOLD }}>{m.price}</span>
            </div>
          </Card>
        ))}
      </div>
    </>
  );
}
function InvoicesScreen() {
  return (
    <>
      <TopBar title="الفواتير" subtitle={`${invoices.length} فواتير حديثة`} />
      <Card className="p-2">
        {invoices.map((v, i) => (
          <div key={v.id} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== invoices.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <span className="text-sm font-mono" style={{ color: GREEN }}>{v.id}</span>
            <div className="flex items-center gap-4 text-xs" style={{ color: MUTED }}><span>{v.items} أصناف</span><span style={{ color: TEXT }}>{v.total}</span></div>
          </div>
        ))}
      </Card>
    </>
  );
}

function GroceryPOS() {
  const [nav, setNav] = useState(0);
  const [inventory, setInventory] = useState(initialInventory);
  const [showModal, setShowModal] = useState(false);
  const screens = [<OverviewScreen />, <InventoryScreen inventory={inventory} onAdd={() => setShowModal(true)} />, <InvoicesScreen />];
  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans" style={{ background: BG, color: TEXT }}>
      <aside className="w-64 shrink-0 flex flex-col border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="px-6 py-7 flex items-center gap-3 border-b" style={{ borderColor: BORDER }}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: GREEN_SOFT, border: `1px solid ${GREEN}` }}><ShoppingBasket size={19} style={{ color: GREEN }} /></div>
          <div><div className="text-base font-semibold tracking-tight">سوبر ماركت البركة</div><div className="text-xs" style={{ color: MUTED }}>نظام نقاط بيع ومخزون</div></div>
        </div>
        <nav className="flex-1 px-3 py-5 flex flex-col gap-1">
          {NAV.map((item, i) => { const Icon = item.icon; const isActive = i === nav; return (
            <button key={item.label} onClick={() => setNav(i)} className="flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-colors text-right" style={{ background: isActive ? GREEN_SOFT : "transparent", color: isActive ? GREEN : MUTED, border: isActive ? `1px solid ${GREEN}` : "1px solid transparent" }}>
              <Icon size={17} /><span className="flex-1">{item.label}</span>{isActive && <ChevronRight size={14} />}
            </button>
          );})}
        </nav>
      </aside>
      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[nav]}</main>
      {showModal && <NewItemModal onClose={() => setShowModal(false)} onCreate={(m) => { setInventory((p) => [m, ...p]); setShowModal(false); }} />}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<GroceryPOS />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
