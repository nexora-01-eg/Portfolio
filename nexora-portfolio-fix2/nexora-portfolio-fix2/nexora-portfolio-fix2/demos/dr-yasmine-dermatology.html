<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة د. ياسمين توفيق — استشارية الجلدية والتجميل</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#7B3F5E; --plum-dark:#5A2C45; --blush:#F3D9DE; --blush-soft:#FBF0F1;
  --gold:#CBA35C; --gold-soft:#F8EFDF;
  --bg:#FDF8F8; --surface:#FFFFFF;
  --text:#2A1820; --text-secondary:#5A3F49; --muted:#9A8189; --faint:#DDC8CD;
  --border:#F2E4E6; --border-strong:#E4CFD3;
  --success:#3F9151; --success-soft:#EAF6EC;
  --warning:#C9932E; --warning-soft:#FBF1DF;
  --danger:#C1443D; --danger-soft:#F9EAE9;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow-sm:0 2px 10px rgba(123,63,94,0.07);
  --shadow-md:0 12px 30px rgba(123,63,94,0.10);
  --shadow-lg:0 26px 56px rgba(123,63,94,0.20);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:900;margin:0;color:var(--text);letter-spacing:-.01em;}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 268px;min-height:100vh;}
.sidebar{background:linear-gradient(185deg,var(--plum) 0%, var(--plum-dark) 100%);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.15);}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
.brand-name{font-weight:900;font-size:15px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.68);margin-top:1px;}
.vip-tag{display:inline-flex;align-items:center;gap:4px;background:var(--gold);color:var(--plum-dark);font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;margin-top:6px;}
.nav-sec{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:rgba(255,255,255,0.8);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:var(--gold);color:var(--plum-dark);}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:#fff;color:var(--plum);font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.15);}
.trust-box{background:rgba(255,255,255,0.08);border-radius:14px;padding:12px;text-align:center;}
.trust-box .n{font-size:20px;font-weight:900;color:var(--gold);}
.trust-box .l{font-size:9.5px;color:rgba(255,255,255,0.7);margin-top:2px;}

.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(253,248,248,0.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;} .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:7px;left:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}

.content{padding:26px 28px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:26px;} .view-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-title{font-weight:800;font-size:15.5px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;border:1px solid transparent;transition:all .15s var(--ease);}
.btn-primary{background:var(--plum);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--plum-dark);transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:var(--plum-dark);}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--blush-soft);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.completed{background:var(--success-soft);color:var(--success);}
.badge.progress{background:var(--warning-soft);color:var(--warning);}
.badge.urgent{background:var(--danger-soft);color:var(--danger);}
.badge.gold{background:var(--gold-soft);color:#8A6425;}

.stat{padding:18px 20px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:700;}
.stat .value{font-size:24px;font-weight:900;}
.stat .trend{font-size:10.5px;font-weight:800;color:var(--success);margin-top:6px;display:inline-block;}

.glow-strip{position:relative;overflow:hidden;border-radius:var(--r-xl);background:linear-gradient(120deg,#4A1E33,#7B3F5E,#CBA35C);padding:26px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.glow-left h2{color:#fff;font-size:21px;margin-bottom:5px;} .glow-left p{color:rgba(255,255,255,0.78);font-size:12.5px;}
.glow-stats{display:flex;gap:22px;flex-shrink:0;}
.glow-stat{text-align:center;} .glow-stat .v{font-size:22px;font-weight:900;} .glow-stat .l{font-size:9.5px;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-top:2px;}

/* Skin analysis gallery (signature) */
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.skin-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;}
.ba-compare{display:grid;grid-template-columns:1fr 1fr;}
.ba-half{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;position:relative;}
.ba-half.before{background:linear-gradient(135deg,#C9A5AC,#B08188);}
.ba-half.after{background:linear-gradient(135deg,var(--plum),var(--gold));}
.ba-label{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.35);padding:2px 8px;border-radius:99px;font-size:9px;}
.skin-body{padding:13px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;font-size:10.5px;color:var(--faint);text-transform:uppercase;padding:0 12px 10px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--blush-soft);}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;}

.cal-wrap{display:grid;grid-template-columns:64px repeat(5,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;}
.cal-head{padding:14px 8px;text-align:center;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--blush-soft);}
.cal-time{font-size:10px;color:var(--faint);text-align:center;padding-top:8px;border-left:1px solid var(--border);height:70px;}
.cal-col{border-right:1px solid var(--border);position:relative;}
.cal-slot{height:70px;border-bottom:1px dashed var(--border);}
.appt-block{position:absolute;right:4px;left:4px;border-radius:10px;padding:7px 9px;font-size:10.5px;color:#fff;background:var(--plum);cursor:pointer;}
.appt-block b{display:block;font-size:11px;color:var(--gold);}

.testi-card{background:var(--blush-soft);border-radius:var(--r-lg);padding:16px;}
.testi-card p{font-size:12.5px;color:var(--text-secondary);line-height:1.7;font-style:italic;}
.testi-stars{color:var(--gold);margin-bottom:8px;}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--plum-dark);color:#fff;padding:11px 17px;border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1150px){ .shell{grid-template-columns:1fr 78px;} .brand-name,.brand-sub,.vip-tag,.nav-item span:not(.ic),.nav-sec,.trust-box .l,.nav-badge{display:none;} .skin-grid{grid-template-columns:repeat(2,1fr);} .cal-wrap{grid-template-columns:50px repeat(5,minmax(110px,1fr));overflow-x:auto;} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} .skin-grid{grid-template-columns:1fr;} .glow-strip{flex-direction:column;align-items:flex-start;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">عيادة لمسة الجلدية — د. ياسمين توفيق</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-gold" onclick="switchView('v-appointments')">+ حجز موعد</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-patients"></section>
      <section class="view" id="v-appointments"></section>
      <section class="view" id="v-gallery"></section>
      <section class="view" id="v-profile"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <img src="https://i.pravatar.cc/104?img=25">
      <div><div class="brand-name">د. ياسمين توفيق</div><div class="brand-sub">استشارية الجلدية والتجميل</div><span class="vip-tag">💎 لمسة الجلدية VIP</span></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-appointments"><span class="ic">🗓️</span><span>المواعيد</span></div>
      <div class="nav-item" data-view="v-gallery"><span class="ic">✨</span><span>معرض قبل وبعد</span></div>
      <div class="nav-sec">المريضات</div>
      <div class="nav-item" data-view="v-patients"><span class="ic">🌸</span><span>ملفات المريضات</span><span class="nav-badge">2</span></div>
      <div class="nav-sec">الحساب</div>
      <div class="nav-item" data-view="v-profile"><span class="ic">🧑‍⚕️</span><span>الملف الشخصي</span></div>
      <div class="nav-item" data-view="v-settings"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="trust-box">
        <div class="n">+4,900</div>
        <div class="l">جلسة تجميل تمت بنجاح</div>
      </div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط */
const patients = [
  {name:"دينا وائل", age:31, treatment:"بوتوكس ومنطقة العين", status:"completed", visits:3, img:23},
  {name:"مي حمدي", age:26, treatment:"علاج حب الشباب بالليزر", status:"progress", visits:6, img:29},
  {name:"سارة الشناوي", age:38, treatment:"شد البشرة بالفيلر", status:"progress", visits:2, img:31},
  {name:"نادين كامل", age:24, treatment:"حساسية جلدية حادة", status:"urgent", visits:1, img:33},
  {name:"رحاب توفيق", age:45, treatment:"تقشير كيميائي", status:"completed", visits:4, img:36},
];
const appointments = [
  {patient:"دينا وائل", type:"جلسة متابعة بوتوكس", day:0, start:0, span:1},
  {patient:"مي حمدي", type:"جلسة ليزر", day:1, start:1, span:1},
  {patient:"نادين كامل", type:"كشف حساسية عاجل", day:1, start:2, span:1},
  {patient:"سارة الشناوي", type:"جلسة فيلر", day:3, start:0, span:1},
  {patient:"رحاب توفيق", type:"تقشير كيميائي", day:4, start:3, span:1},
];
const days = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء'];
const hours = ['10:00 ص','12:00 م','2:00 م','4:00 م'];
const testimonials = [
  {name:"دينا وائل", text:"نتيجة طبيعية جدًا ومفيش أي مبالغة، دكتورة ياسمين بتفهم اللي انتي عايزاه بالظبط.", rating:5},
  {name:"مي حمدي", text:"بشرتي اتغيرت تمامًا بعد جلسات الليزر، متابعة رائعة من العيادة كلها.", rating:5},
];
const gallery = [
  {treatment:"شد الوجه بالفيلر", weeks:6},
  {treatment:"علاج حب الشباب", weeks:12},
  {treatment:"تفتيح البشرة الليزري", weeks:8},
];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','عيادة لمسة الجلدية — د. ياسمين توفيق'],
    'v-patients':['ملفات المريضات', patients.length+' مريضة'],
    'v-appointments':['المواعيد','الأسبوع الحالي'],
    'v-gallery':['معرض قبل وبعد','نتائج العلاجات الموثقة'],
    'v-profile':['الملف الشخصي','السيرة المهنية لـ د. ياسمين توفيق'],
    'v-settings':['الإعدادات','بيانات العيادة'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}
const statusMap = {completed:'مكتمل',progress:'قيد العلاج',urgent:'عاجل'};

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، دكتورة ياسمين ✨</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦ — عيادة لمسة الجلدية</p></div>
      <button class="btn btn-outline" onclick="switchView('v-appointments')">عرض جدول اليوم</button></div>
    <div class="glow-strip" style="margin-bottom:18px">
      <div class="glow-left"><h2>توهج اليوم ✨</h2><p>لمحة سريعة على نشاط العيادة الآن</p></div>
      <div class="glow-stats">
        <div class="glow-stat"><div class="v">${appointments.length}</div><div class="l">مواعيد اليوم</div></div>
        <div class="glow-stat"><div class="v">97%</div><div class="l">رضا المريضات</div></div>
        <div class="glow-stat"><div class="v">3</div><div class="l">جلسات ليزر</div></div>
      </div>
    </div>
    <div class="grid g4" style="margin-bottom:18px">
      ${stat('مواعيد اليوم', appointments.length+' موعد','🗓️','var(--plum)','+1 عن أمس')}
      ${stat('حالات قيد العلاج',patients.filter(p=>p.status==='progress').length+' حالة','🌸','var(--warning)','متابعة مستمرة')}
      ${stat('إيراد الشهر','٢٨٦٬٤٠٠ ج.م','💰','var(--success)','+15%')}
      ${stat('حالات عاجلة',patients.filter(p=>p.status==='urgent').length+' حالة','🚨','var(--danger)','بحاجة لكشف سريع')}
    </div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="card-title" style="margin-bottom:16px">حالات المريضات الحالية</div>
        ${patients.map(p=>`
          <div class="flex justify-between items-center" style="padding:11px 0;border-bottom:1px dashed var(--border)">
            <div class="flex items-center gap3"><img class="avatar" width="36" height="36" src="https://i.pravatar.cc/72?img=${p.img}"><div><b style="font-size:13px">${p.name}</b><div class="muted" style="font-size:11px">${p.treatment}</div></div></div>
            <span class="badge ${p.status}">${statusMap[p.status]}</span>
          </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:12px">آراء المريضات</div>
        <div class="testi-card">
          <div class="testi-stars">★★★★★</div>
          <p>"${testimonials[0].text}"</p>
          <div style="margin-top:10px;font-weight:800;font-size:12px">— ${testimonials[0].name}</div>
        </div>
      </div>
    </div>
  `;
}

function renderPatients(){
  const el = document.getElementById('v-patients');
  el.innerHTML = `
    <div class="view-head"><div><h1>ملفات المريضات</h1><p class="sub">${patients.length} مريضة</p></div>
      <button class="btn btn-primary">+ مريضة جديدة</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>المريضة</th><th>العلاج</th><th>عدد الجلسات</th><th>الحالة</th></tr></thead>
      <tbody>${patients.map(p=>`
        <tr onclick="UI.toast('ملف ${p.name}')">
          <td><div class="cell-name"><img class="avatar" width="34" height="34" src="https://i.pravatar.cc/68?img=${p.img}">${p.name} <span class="muted" style="font-weight:500">(${p.age})</span></div></td>
          <td>${p.treatment}</td><td>${p.visits} جلسة</td>
          <td><span class="badge ${p.status}">${statusMap[p.status]}</span></td>
        </tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderAppointments(){
  const el = document.getElementById('v-appointments');
  el.innerHTML = `<div class="view-head"><div><h1>المواعيد</h1><p class="sub">الأسبوع الحالي</p></div>
    <button class="btn btn-gold">+ حجز موعد</button></div>
    <div class="cal-wrap" id="calWrap"></div>`;
  let html = `<div class="cal-head" style="background:#fff"></div>`;
  days.forEach(d=> html += `<div class="cal-head">${d}</div>`);
  html += `<div>`+hours.map(h=>`<div class="cal-time">${h}</div>`).join('')+`</div>`;
  for(let d=0; d<5; d++){
    html += `<div class="cal-col">`;
    hours.forEach(()=> html += `<div class="cal-slot"></div>`);
    appointments.filter(a=>a.day===d).forEach(a=>{
      html += `<div class="appt-block" style="top:${a.start*70+4}px;height:${a.span*70-8}px" onclick="UI.toast('${a.patient} — ${a.type}')">
        <b>${a.patient}</b>${a.type}
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('calWrap').innerHTML = html;
}
