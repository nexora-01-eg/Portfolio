<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة د. رنا الديب — استشارية طب وتجميل الأسنان</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0E9488; --teal-dark:#0A6F66; --teal-soft:#E4F5F3;
  --coral:#FF7A6B; --coral-soft:#FFEEEC;
  --bg:#F7FCFB; --surface:#FFFFFF;
  --text:#122A27; --text-secondary:#375753; --muted:#7E9793; --faint:#C6DEDA;
  --border:#E3F1EF; --border-strong:#CDE5E1;
  --success:#0E9488; --success-soft:#E4F5F3;
  --warning:#D9932E; --warning-soft:#FBF1DF;
  --danger:#DC3E4A; --danger-soft:#FCEAEC;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --shadow-sm:0 2px 10px rgba(14,148,136,0.07);
  --shadow-md:0 12px 30px rgba(14,148,136,0.10);
  --shadow-lg:0 26px 56px rgba(14,148,136,0.20);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:900;margin:0;color:var(--text);letter-spacing:-.01em;}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 268px;min-height:100vh;}
.sidebar{background:#fff;border-left:1px solid var(--border);padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);}
.brand-name{font-weight:900;font-size:15px;color:var(--teal-dark);}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
.vip-tag{display:inline-flex;align-items:center;gap:4px;background:var(--teal);color:#fff;font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;margin-top:6px;}
.nav-sec{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;color:var(--text-secondary);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:var(--teal-soft);}
.nav-item.active{background:var(--teal);color:#fff;}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
.trust-box{background:var(--teal-soft);border-radius:14px;padding:12px;text-align:center;}
.trust-box .n{font-size:20px;font-weight:900;color:var(--teal-dark);}
.trust-box .l{font-size:9.5px;color:var(--muted);margin-top:2px;}

.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(247,252,251,0.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;} .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:7px;left:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}

.content{padding:26px 28px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:26px;} .view-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-title{font-weight:800;font-size:15.5px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;border:1px solid transparent;transition:all .15s var(--ease);}
.btn-primary{background:var(--teal);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--teal-dark);transform:translateY(-1px);}
.btn-coral{background:var(--coral);color:#fff;}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--teal-soft);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.completed{background:var(--success-soft);color:var(--success);}
.badge.progress{background:var(--warning-soft);color:var(--warning);}
.badge.urgent{background:var(--danger-soft);color:var(--danger);}
.badge.coral{background:var(--coral-soft);color:#C74B3D;}

.stat{padding:18px 20px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:700;}
.stat .value{font-size:24px;font-weight:900;}
.stat .trend{font-size:10.5px;font-weight:800;color:var(--success);margin-top:6px;display:inline-block;}

/* Smile strip */
.smile-strip{position:relative;overflow:hidden;border-radius:var(--r-xl);background:linear-gradient(120deg,#083D38,#0E9488,#3DDCC5);padding:26px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.smile-left h2{color:#fff;font-size:21px;margin-bottom:5px;} .smile-left p{color:rgba(255,255,255,0.78);font-size:12.5px;}
.smile-stats{display:flex;gap:22px;flex-shrink:0;}
.smile-stat{text-align:center;} .smile-stat .v{font-size:22px;font-weight:900;} .smile-stat .l{font-size:9.5px;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-top:2px;}

/* Dental chart (signature) */
.dental-chart{display:flex;flex-direction:column;gap:10px;align-items:center;}
.tooth-row{display:flex;gap:5px;}
.tooth{width:30px;height:36px;border-radius:8px 8px 12px 12px;border:2px solid var(--border-strong);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .15s;flex-shrink:0;}
.tooth:hover{transform:scale(1.08);}
.tooth.healthy{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-dark);}
.tooth.cavity{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
.tooth.filled{background:var(--warning-soft);border-color:var(--warning);color:var(--warning);}
.tooth.crown{background:var(--coral-soft);border-color:var(--coral);color:#C74B3D;}
.tooth.missing{background:#F0F0F0;border-color:#D5D5D5;color:#B5B5B5;border-style:dashed;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.legend-chip{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-secondary);}
.legend-dot{width:10px;height:10px;border-radius:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;font-size:10.5px;color:var(--faint);text-transform:uppercase;padding:0 12px 10px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--teal-soft);}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;}

.cal-wrap{display:grid;grid-template-columns:64px repeat(5,1fr);gap:0;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;}
.cal-head{padding:14px 8px;text-align:center;font-weight:800;font-size:12.5px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--teal-soft);}
.cal-time{font-size:10px;color:var(--faint);text-align:center;padding-top:8px;border-left:1px solid var(--border);height:70px;}
.cal-col{border-right:1px solid var(--border);position:relative;}
.cal-slot{height:70px;border-bottom:1px dashed var(--border);}
.appt-block{position:absolute;right:4px;left:4px;border-radius:10px;padding:7px 9px;font-size:10.5px;color:#fff;background:var(--teal);cursor:pointer;}
.appt-block b{display:block;font-size:11px;}

.testi-card{background:var(--teal-soft);border-radius:var(--r-lg);padding:16px;}
.testi-card p{font-size:12.5px;color:var(--text-secondary);line-height:1.7;font-style:italic;}
.testi-stars{color:var(--coral);margin-bottom:8px;}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--teal-dark);color:#fff;padding:11px 17px;border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1150px){ .shell{grid-template-columns:1fr 78px;} .brand-name,.brand-sub,.vip-tag,.nav-item span:not(.ic),.nav-sec,.trust-box .l,.nav-badge{display:none;} .cal-wrap{grid-template-columns:50px repeat(5,minmax(110px,1fr));overflow-x:auto;} .tooth{width:22px;height:28px;font-size:7px;} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} .smile-strip{flex-direction:column;align-items:flex-start;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">عيادة د. رنا الديب — ابتسامة برايت</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-coral" onclick="switchView('v-appointments')">+ حجز موعد</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-patients"></section>
      <section class="view" id="v-appointments"></section>
      <section class="view" id="v-chart"></section>
      <section class="view" id="v-profile"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <img src="https://i.pravatar.cc/104?img=32">
      <div><div class="brand-name">د. رنا الديب</div><div class="brand-sub">استشارية طب وتجميل الأسنان</div><span class="vip-tag">✨ ابتسامة برايت VIP</span></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-appointments"><span class="ic">🗓️</span><span>المواعيد</span></div>
      <div class="nav-item" data-view="v-chart"><span class="ic">🦷</span><span>الخريطة السنية</span></div>
      <div class="nav-sec">المرضى</div>
      <div class="nav-item" data-view="v-patients"><span class="ic">😁</span><span>ملفات المرضى</span><span class="nav-badge">3</span></div>
      <div class="nav-sec">الحساب</div>
      <div class="nav-item" data-view="v-profile"><span class="ic">🧑‍⚕️</span><span>الملف الشخصي</span></div>
      <div class="nav-item" data-view="v-settings"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="trust-box">
        <div class="n">+3,800</div>
        <div class="l">ابتسامة تم تجميلها</div>
      </div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط */
const patients = [
  {name:"ليلى فتحي", age:29, treatment:"تقويم أسنان شفاف", status:"progress", visits:8, img:27},
  {name:"باسل عادل", age:34, treatment:"ابتسامة هوليوود", status:"completed", visits:5, img:9},
  {name:"مريم أشرف", age:22, treatment:"تنظيف وتبييض", status:"completed", visits:2, img:30},
  {name:"شريف منير", age:47, treatment:"علاج عصب عاجل", status:"urgent", visits:1, img:16},
  {name:"هبة سامي", age:38, treatment:"زراعة أسنان", status:"progress", visits:4, img:34},
];
const appointments = [
  {patient:"ليلى فتحي", type:"ضبط تقويم شهري", day:0, start:0, span:1},
  {patient:"باسل عادل", type:"جلسة تبييض", day:1, start:1, span:1},
  {patient:"شريف منير", type:"علاج عصب", day:1, start:2, span:1},
  {patient:"هبة سامي", type:"متابعة زراعة", day:3, start:0, span:1},
  {patient:"مريم أشرف", type:"تنظيف دوري", day:4, start:3, span:1},
];
const days = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء'];
const hours = ['9:00 ص','11:00 ص','1:00 م','3:00 م'];
const testimonials = [
  {name:"باسل عادل", text:"غيّرت ابتسامتي بالكامل، دكتورة رنا فنانة في التجميل مش بس دكتورة أسنان.", rating:5},
  {name:"ليلى فتحي", text:"التقويم الشفاف كان أفضل قرار، والمتابعة كل شهر مريحة جدًا.", rating:5},
];
// tooth status map (32 teeth) for demo patient
const toothStatuses = ['healthy','healthy','filled','healthy','healthy','cavity','healthy','healthy','healthy','crown','healthy','healthy','missing','healthy','healthy','healthy',
                        'healthy','healthy','healthy','filled','healthy','healthy','crown','healthy','healthy','cavity','healthy','healthy','healthy','healthy','healthy','healthy'];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','عيادة د. رنا الديب — ابتسامة برايت'],
    'v-patients':['ملفات المرضى', patients.length+' مريض'],
    'v-appointments':['المواعيد','الأسبوع الحالي'],
    'v-chart':['الخريطة السنية','خريطة تفاعلية لحالة الأسنان'],
    'v-profile':['الملف الشخصي','السيرة المهنية لـ د. رنا الديب'],
    'v-settings':['الإعدادات','بيانات العيادة'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}
const statusMap = {completed:'مكتمل',progress:'قيد العلاج',urgent:'عاجل'};

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، دكتورة رنا 😁</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦ — عيادة ابتسامة برايت</p></div>
      <button class="btn btn-outline" onclick="switchView('v-appointments')">عرض جدول اليوم</button></div>
    <div class="smile-strip" style="margin-bottom:18px">
      <div class="smile-left"><h2>لمحة سريعة على اليوم</h2><p>نظرة عامة على نشاط العيادة الآن</p></div>
      <div class="smile-stats">
        <div class="smile-stat"><div class="v">${appointments.length}</div><div class="l">مواعيد اليوم</div></div>
        <div class="smile-stat"><div class="v">99%</div><div class="l">رضا المرضى</div></div>
        <div class="smile-stat"><div class="v">2</div><div class="l">حالات جديدة</div></div>
      </div>
    </div>
    <div class="grid g4" style="margin-bottom:18px">
      ${stat('مواعيد اليوم', appointments.length+' موعد','🗓️','var(--teal)','+1 عن أمس')}
      ${stat('حالات قيد العلاج',patients.filter(p=>p.status==='progress').length+' حالة','🦷','var(--warning)','متابعة مستمرة')}
      ${stat('إيراد الشهر','٢١٨٬٥٠٠ ج.م','💰','var(--success)','+13%')}
      ${stat('حالات عاجلة',patients.filter(p=>p.status==='urgent').length+' حالة','🚨','var(--danger)','بحاجة لموعد سريع')}
    </div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="card-title" style="margin-bottom:16px">حالات المرضى الحالية</div>
        ${patients.map(p=>`
          <div class="flex justify-between items-center" style="padding:11px 0;border-bottom:1px dashed var(--border)">
            <div class="flex items-center gap3"><img class="avatar" width="36" height="36" src="https://i.pravatar.cc/72?img=${p.img}"><div><b style="font-size:13px">${p.name}</b><div class="muted" style="font-size:11px">${p.treatment}</div></div></div>
            <span class="badge ${p.status}">${statusMap[p.status]}</span>
          </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:12px">آراء المرضى</div>
        <div class="testi-card">
          <div class="testi-stars">★★★★★</div>
          <p>"${testimonials[0].text}"</p>
          <div style="margin-top:10px;font-weight:800;font-size:12px">— ${testimonials[0].name}</div>
        </div>
      </div>
    </div>
  `;
}

function renderPatients(){
  const el = document.getElementById('v-patients');
  el.innerHTML = `
    <div class="view-head"><div><h1>ملفات المرضى</h1><p class="sub">${patients.length} مريض</p></div>
      <button class="btn btn-primary">+ مريض جديد</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>المريض</th><th>العلاج</th><th>عدد الزيارات</th><th>الحالة</th></tr></thead>
      <tbody>${patients.map(p=>`
        <tr onclick="UI.toast('ملف ${p.name}')">
          <td><div class="cell-name"><img class="avatar" width="34" height="34" src="https://i.pravatar.cc/68?img=${p.img}">${p.name} <span class="muted" style="font-weight:500">(${p.age})</span></div></td>
          <td>${p.treatment}</td><td>${p.visits} زيارة</td>
          <td><span class="badge ${p.status}">${statusMap[p.status]}</span></td>
        </tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderAppointments(){
  const el = document.getElementById('v-appointments');
  el.innerHTML = `<div class="view-head"><div><h1>المواعيد</h1><p class="sub">الأسبوع الحالي</p></div>
    <button class="btn btn-coral">+ حجز موعد</button></div>
    <div class="cal-wrap" id="calWrap"></div>`;
  let html = `<div class="cal-head" style="background:#fff"></div>`;
  days.forEach(d=> html += `<div class="cal-head">${d}</div>`);
  html += `<div>`+hours.map(h=>`<div class="cal-time">${h}</div>`).join('')+`</div>`;
  for(let d=0; d<5; d++){
    html += `<div class="cal-col">`;
    hours.forEach(()=> html += `<div class="cal-slot"></div>`);
    appointments.filter(a=>a.day===d).forEach(a=>{
      html += `<div class="appt-block" style="top:${a.start*70+4}px;height:${a.span*70-8}px" onclick="UI.toast('${a.patient} — ${a.type}')">
        <b>${a.patient}</b>${a.type}
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('calWrap').innerHTML = html;
}

        <div class="legend-chip"><span class="legend-dot" style="background:var(--danger)"></span>تسوس</div>
        <div class="legend-chip"><span class="legend-dot" style="background:var(--warning)"></span>محشوة</div>

  `;
}
function toothLabel(s){
  return {healthy:'سليمة',cavity:'تسوس',filled:'محشوة',crown:'تاج',missing:'مفقودة'}[s];
}
window.toothLabel = toothLabel;
