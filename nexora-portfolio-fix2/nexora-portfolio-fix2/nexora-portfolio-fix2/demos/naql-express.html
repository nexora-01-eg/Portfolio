<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naql Express — نظام إدارة شركات النقل واللوجستيات</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#F5B914; --yellow-dark:#C7940A; --black:#17181C; --black-soft:#EDEDF0;
  --bg:#F6F6F4; --surface:#FFFFFF;
  --text:#181818; --text-secondary:#3F3F42; --muted:#87878C; --faint:#D2D2D6;
  --border:#E7E7E7; --border-strong:#D4D4D4;
  --success:#16A34A; --success-soft:#E9F9EF;
  --warning:#D97706; --warning-soft:#FDF1DF;
  --danger:#DC2626; --danger-soft:#FCEAEA;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --shadow-sm:0 2px 10px rgba(23,24,28,0.08);
  --shadow-md:0 12px 30px rgba(23,24,28,0.12);
  --shadow-lg:0 26px 56px rgba(23,24,28,0.22);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:900;margin:0;color:var(--black);letter-spacing:-.01em;}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 258px;min-height:100vh;}
.sidebar{background:var(--black);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-left:4px solid var(--yellow);}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.brand-name{font-weight:900;font-size:17px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.55);}
.nav-sec{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:rgba(255,255,255,0.75);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--yellow);color:var(--black);}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:#fff;color:var(--black);font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.foot-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:rgba(255,255,255,0.06);}
.foot-card img{width:36px;height:36px;border-radius:9px;object-fit:cover;}
.foot-card .name{font-size:12.5px;font-weight:800;} .foot-card .role{font-size:10.5px;color:rgba(255,255,255,0.5);}

.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(246,246,244,0.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;} .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:7px;left:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}

.content{padding:26px 28px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:26px;} .view-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-title{font-weight:800;font-size:15.5px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid transparent;}
.btn-primary{background:var(--black);color:#fff;}
.btn-primary:hover{background:#000;}
.btn-yellow{background:var(--yellow);color:var(--black);}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--black-soft);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.available{background:var(--success-soft);color:var(--success);}
.badge.busy{background:var(--warning-soft);color:var(--warning);}
.badge.maintenance{background:var(--danger-soft);color:var(--danger);}

.stat{padding:18px 20px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:700;}
.stat .value{font-size:24px;font-weight:900;}
.stat .trend{font-size:10.5px;font-weight:800;color:var(--success);margin-top:6px;display:inline-block;}

/* Fleet tracking board */
.fleet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.truck-card{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;background:#fff;}
.truck-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.truck-emoji{font-size:28px;}
.route-track{height:6px;background:var(--black-soft);border-radius:99px;overflow:hidden;margin:10px 0;}
.route-fill{height:100%;border-radius:99px;background:var(--yellow);}

/* Shipment timeline (signature) */
.ship-timeline{position:relative;padding-right:24px;}
.ship-timeline::before{content:'';position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.ship-step{position:relative;padding-bottom:22px;}
.ship-dot{position:absolute;right:-24px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--border-strong);}
.ship-step.done .ship-dot{background:var(--success);border-color:var(--success);}
.ship-step.active .ship-dot{background:var(--yellow);border-color:var(--yellow-dark);}
.ship-card{background:var(--black-soft);border-radius:12px;padding:11px 14px;}
.ship-card b{font-size:12.5px;} .ship-card p{font-size:11px;color:var(--muted);margin-top:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;font-size:10.5px;color:var(--faint);text-transform:uppercase;padding:0 12px 10px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--black-soft);}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--black);color:var(--yellow);padding:11px 17px;border-radius:10px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1150px){ .shell{grid-template-columns:1fr 76px;} .brand-name,.brand-sub,.nav-item span:not(.ic),.nav-sec,.foot-card .name,.foot-card .role,.nav-badge{display:none;} .fleet-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} .fleet-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">Naql Express — نقل عفش ولوجستيات</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-yellow" onclick="switchView('v-shipments')">+ طلب نقل جديد</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-fleet"></section>
      <section class="view" id="v-shipments"></section>
      <section class="view" id="v-customers"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🚛</div>
      <div><div class="brand-name">Naql Express</div><div class="brand-sub">نقل عفش ولوجستيات</div></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-fleet"><span class="ic">🚚</span><span>الأسطول</span></div>
      <div class="nav-item" data-view="v-shipments"><span class="ic">📦</span><span>الشحنات</span><span class="nav-badge">5</span></div>
      <div class="nav-sec">الإدارة</div>
      <div class="nav-item" data-view="v-customers"><span class="ic">👥</span><span>العملاء</span></div>
      <div class="nav-sec">الحساب</div>
      <div class="nav-item" data-view="v-settings"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-card"><img src="https://i.pravatar.cc/72?img=55"><div><div class="name">أ. جمال عاطف</div><div class="role">مدير العمليات</div></div></div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط */
const fleet = [
  {id:"عربية 01", driver:"عم صابر يوسف", status:"busy", route:"المهندسين → التجمع الخامس", progress:65},
  {id:"عربية 02", driver:"عم رجب حلمي", status:"available", route:"—", progress:0},
  {id:"عربية 03", driver:"عم كريم فتحي", status:"busy", route:"مدينة نصر → الشيخ زايد", progress:30},
  {id:"عربية 04", driver:"عم أشرف نجيب", status:"maintenance", route:"صيانة دورية", progress:0},
  {id:"عربية 05", driver:"عم سيد جابر", status:"available", route:"—", progress:0},
  {id:"عربية 06", driver:"عم محمود عادل", status:"busy", route:"الزمالك → 6 أكتوبر", progress:82},
];
const shipments = [
  {id:"#NX-3301", customer:"أ. دينا عزت", from:"المهندسين", to:"التجمع الخامس", status:"جاري النقل"},
  {id:"#NX-3302", customer:"شركة رؤية", from:"مدينة نصر", to:"الشيخ زايد", status:"جاري التحميل"},
  {id:"#NX-3303", customer:"م. وائل شكري", from:"الزمالك", to:"6 أكتوبر", status:"جاري النقل"},
  {id:"#NX-3304", customer:"د. سلوى فهيم", from:"المعادي", to:"القاهرة الجديدة", status:"مجدول غدًا"},
  {id:"#NX-3305", customer:"أ. باسم حلمي", from:"الدقي", to:"العبور", status:"تم التسليم"},
];
const shipmentSteps = [
  {title:"استلام الطلب وتأكيد الموعد", desc:"تم تأكيد الحجز مع العميل", done:true},
  {title:"تحميل العفش من نقطة الانطلاق", desc:"فريق التحميل بدأ العمل", done:true},
  {title:"النقل جارٍ الآن", desc:"العربية رقم 01 في الطريق", active:true},
  {title:"التفريغ والتركيب في الوجهة", desc:"لم يبدأ بعد", done:false},
  {title:"تسليم واستلام توقيع العميل", desc:"لم يبدأ بعد", done:false},
];
const customers = [
  {name:"أ. دينا عزت", shipments:2, spent:8400, img:88},
  {name:"شركة رؤية", shipments:6, spent:42000, img:89},
  {name:"م. وائل شكري", shipments:1, spent:3200, img:90},
];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','Naql Express — نقل عفش ولوجستيات'],
    'v-fleet':['الأسطول', fleet.length+' عربية'],
    'v-shipments':['الشحنات', shipments.length+' شحنة'],
    'v-customers':['العملاء', customers.length+' عميل'],
    'v-settings':['الإعدادات','بيانات الشركة والأسطول'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}
const statusMap = {available:'متاحة',busy:'في مهمة',maintenance:'صيانة'};

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، أستاذ جمال 🚛</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦</p></div>
      <button class="btn btn-outline" onclick="switchView('v-fleet')">عرض حالة الأسطول</button></div>
    <div class="grid g4" style="margin-bottom:18px">
      ${stat('عربيات نشطة الآن',fleet.filter(f=>f.status==='busy').length+' عربية','🚚','var(--yellow-dark)','من إجمالي '+fleet.length)}
      ${stat('شحنات اليوم', shipments.length+' شحنة','📦','var(--black)','+2 عن أمس')}
      ${stat('إيراد الشهر','٣٤٨٬٢٠٠ ج.م','💰','var(--success)','+7%')}
      ${stat('عربيات بالصيانة',fleet.filter(f=>f.status==='maintenance').length+' عربية','🔧','var(--danger)','متوقعة تعود غدًا')}
    </div>
    <div class="card card-pad">
      <div class="card-title" style="margin-bottom:16px">الشحنات الجارية</div>
      ${shipments.map(s=>`
        <div class="flex justify-between items-center" style="padding:11px 0;border-bottom:1px dashed var(--border)">
          <div><b style="font-size:13px">${s.customer}</b><div class="muted" style="font-size:11px">${s.from} ← ${s.to}</div></div>
          <span class="badge ${s.status==='تم التسليم'?'available':s.status.includes('مجدول')?'maintenance':'busy'}">${s.status}</span>
        </div>`).join('')}
    </div>
  `;
}

function renderFleet(){
  const el = document.getElementById('v-fleet');
  el.innerHTML = `
    <div class="view-head"><div><h1>الأسطول</h1><p class="sub">${fleet.length} عربية</p></div>
      <button class="btn btn-primary">+ إضافة عربية</button></div>
    <div class="fleet-grid">
      ${fleet.map(f=>`
        <div class="truck-card">
          <div class="head"><span class="truck-emoji">🚛</span><span class="badge ${f.status}">${statusMap[f.status]}</span></div>
          <b style="font-size:13.5px">${f.id}</b>
          <div class="muted" style="font-size:11px;margin:4px 0">السائق: ${f.driver}</div>
          <div class="muted" style="font-size:11px">${f.route}</div>
          ${f.progress>0?`<div class="route-track"><div class="route-fill" style="width:${f.progress}%"></div></div><div class="muted" style="font-size:10.5px">${f.progress}% من الرحلة</div>`:''}
        </div>`).join('')}
    </div>
  `;
}

function renderShipments(){
  const el = document.getElementById('v-shipments');
  el.innerHTML = `
    <div class="view-head"><div><h1>الشحنات</h1><p class="sub">${shipments.length} شحنة</p></div>
      <button class="btn btn-yellow">+ طلب نقل جديد</button></div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="table-wrap" style="overflow-x:auto"><table>
          <thead><tr><th>رقم الشحنة</th><th>العميل</th><th>من</th><th>إلى</th><th>الحالة</th></tr></thead>
          <tbody>${shipments.map(s=>`
            <tr onclick="UI.toast('تفاصيل الشحنة ${s.id}')">
              <td><b>${s.id}</b></td><td>${s.customer}</td><td>${s.from}</td><td>${s.to}</td>
              <td><span class="badge ${s.status==='تم التسليم'?'available':s.status.includes('مجدول')?'maintenance':'busy'}">${s.status}</span></td>
            </tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:14px">تتبع الشحنة #NX-3301</div>
        <div class="ship-timeline">
          ${shipmentSteps.map(s=>`
            <div class="ship-step ${s.done?'done':s.active?'active':''}">
              <div class="ship-dot"></div>
              <div class="ship-card"><b>${s.title}</b><p>${s.desc}</p></div>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderCustomers(){
  const el = document.getElementById('v-customers');
  el.innerHTML = `
    <div class="view-head"><div><h1>العملاء</h1><p class="sub">${customers.length} عميل</p></div></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>العميل</th><th>عدد الشحنات</th><th>إجمالي الإنفاق</th></tr></thead>
      <tbody>${customers.map(c=>`
        <tr><td><div class="cell-name"><img src="https://i.pravatar.cc/64?img=${c.img}" width="32" height="32" style="border-radius:50%">${c.name}</div></td>
        <td>${c.shipments} شحنة</td><td><b>${c.spent.toLocaleString('ar-EG')} ج.م</b></td></tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderSettings(){
  document.getElementById('v-settings').innerHTML = `
    <div class="view-head"><div><h1>الإعدادات</h1><p class="sub">بيانات الشركة والأسطول</p></div></div>
    <div class="card card-pad" style="max-width:560px">
      <p class="muted" style="font-size:13px;margin-bottom:16px">إعدادات اسم الشركة، مناطق التغطية، وأسعار النقل حسب المسافة.</p>
      <button class="btn btn-primary" onclick="UI.toast('تم حفظ الإعدادات')">حفظ التغييرات</button>
    </div>
  `;
}

renderDashboard(); renderFleet(); renderShipments(); renderCustomers(); renderSettings();
</script>
</body>
</html>
