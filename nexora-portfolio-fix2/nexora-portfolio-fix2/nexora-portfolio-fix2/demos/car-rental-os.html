<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دريفلاين — تأجير سيارات فاخرة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #C9A227; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState } from "react";
import { Car, Search, Bell, Plus, X, LayoutGrid, Users, Wallet, ChevronRight } from "lucide-react";

const BG = "#0A0A0B"; const PANEL = "#141416"; const CARD = "#18181B"; const BORDER = "#28282C";
const TEXT = "#F1F1F0"; const MUTED = "#93938F"; const GOLD = "#C9A227"; const GOLD_SOFT = "rgba(201,162,39,0.14)";
const GRAPHITE = "#5A5F66"; const GRAPHITE_SOFT = "rgba(90,95,102,0.2)"; const GREEN = "#3FA66B"; const RED = "#C24A4A";

const NAV = [{ icon: LayoutGrid, label: "الأسطول" }, { icon: Users, label: "الحجوزات" }, { icon: Wallet, label: "الفواتير" }];

const kpis = [{ label: "سيارات متاحة", value: "22 / 40" }, { label: "حجوزات اليوم", value: "11" }, { label: "عائد الشهر", value: "312,000 ج.م" }, { label: "متأخرة الإرجاع", value: "2" }];

const initialFleet = [
  { model: "هيونداي توسان 2023", plate: "أ ب ج 118", status: "متاحة", daily: "1,200 ج.م" },
  { model: "كيا سيراتو 2022", plate: "س ص ع 442", status: "مؤجرة", daily: "700 ج.م" },
  { model: "تويوتا كامري 2023", plate: "ن هـ و 271", status: "صيانة", daily: "1,500 ج.م" },
  { model: "شيفروليه أوبترا 2021", plate: "ق ل م 903", status: "متاحة", daily: "550 ج.م" },
];

const bookings = [
  { customer: "يوسف الديب", car: "هيونداي توسان", from: "١٢ يوليو", to: "١٦ يوليو" },
  { customer: "مايا رشدي", car: "كيا سيراتو", from: "١٠ يوليو", to: "١٨ يوليو" },
];

const invoices = [{ customer: "يوسف الديب", amount: "4,800 ج.م", status: "مدفوعة" }, { customer: "مايا رشدي", amount: "5,600 ج.م", status: "معلقة" }];

const statusColor = (s) => s === "متاحة" ? GREEN : s === "مؤجرة" ? GOLD : RED;

function Card({ children, className = "", style = {} }) { return <div className={`rounded-2xl border ${className}`} style={{ background: CARD, borderColor: BORDER, ...style }}>{children}</div>; }
function TopBar({ title, subtitle, onAdd, addLabel }) {
  return (
    <div className="flex items-center justify-between mb-8">
      <div><h1 className="text-2xl font-semibold tracking-tight">{title}</h1>{subtitle && <p className="text-sm mt-1" style={{ color: MUTED }}>{subtitle}</p>}</div>
      <div className="flex items-center gap-3">
        <div className="flex items-center gap-2 px-4 py-2.5 rounded-xl border" style={{ borderColor: BORDER, background: PANEL }}><Search size={15} style={{ color: MUTED }} /><span className="text-sm" style={{ color: MUTED }}>بحث...</span></div>
        {onAdd && <button onClick={onAdd} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm" style={{ background: GOLD, color: "#141110" }}><Plus size={15} />{addLabel}</button>}
        <div className="w-10 h-10 rounded-xl border flex items-center justify-center" style={{ borderColor: BORDER, background: PANEL }}><Bell size={17} style={{ color: MUTED }} /></div>
      </div>
    </div>
  );
}
function Modal({ title, note, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24" style={{ background: "rgba(0,0,0,0.55)" }}>
      <Card className="w-full max-w-md p-7 relative" style={{ borderColor: GOLD }}>
        <button onClick={onClose} className="absolute left-5 top-5" style={{ color: MUTED }}><X size={18} /></button>
        <div className="text-lg font-semibold mb-1">{title}</div><div className="text-xs mb-6" style={{ color: MUTED }}>{note}</div>{children}
      </Card>
    </div>
  );
}
const inputStyle = { background: "#141110", borderColor: BORDER, color: TEXT };
const Field = ({ label, ...props }) => (<div className="mb-4"><label className="text-xs" style={{ color: MUTED }}>{label}</label><input {...props} className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl border text-sm outline-none" style={inputStyle} /></div>);

function NewBookingModal({ onClose, onCreate }) {
  const [customer, setCustomer] = useState(""); const [car, setCar] = useState("");
  return (
    <Modal title="حجز جديد" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="اسم العميل" value={customer} onChange={(e) => setCustomer(e.target.value)} placeholder="مثال: هشام بدوي" />
      <Field label="السيارة" value={car} onChange={(e) => setCar(e.target.value)} placeholder="مثال: تويوتا كامري" />
      <button onClick={() => customer.trim() && onCreate({ customer, car: car || "—", from: "اليوم", to: "—" })} className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: GOLD, color: "#141110" }}>تأكيد الحجز</button>
    </Modal>
  );
}

function FleetScreen({ fleet }) {
  return (
    <>
      <TopBar title="الأسطول" subtitle="حالة السيارات الآن" />
      <div className="grid grid-cols-4 gap-5 mb-7">{kpis.map((k) => <Card key={k.label} className="p-5"><div className="text-xs mb-3" style={{ color: MUTED }}>{k.label}</div><div className="text-xl font-semibold">{k.value}</div></Card>)}</div>
      <div className="grid grid-cols-4 gap-5">
        {fleet.map((f) => (
          <Card key={f.plate} className="p-5">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: GRAPHITE_SOFT }}><Car size={17} style={{ color: GRAPHITE }} /></div>
            <div className="text-sm font-medium">{f.model}</div>
            <div className="text-xs mt-1" style={{ color: MUTED }}>لوحة {f.plate}</div>
            <div className="flex items-center justify-between mt-4">
              <span className="text-xs" style={{ color: GOLD }}>{f.daily}</span>
              <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: statusColor(f.status), background: `${statusColor(f.status)}1A`, border: `1px solid ${statusColor(f.status)}` }}>{f.status}</span>
            </div>
          </Card>
        ))}
      </div>
    </>
  );
}
function BookingsScreen({ bookings, onAdd }) {
  return (
    <>
      <TopBar title="الحجوزات" subtitle={`${bookings.length} حجوزات نشطة`} onAdd={onAdd} addLabel="حجز جديد" />
      <Card className="p-2">
        {bookings.map((b, i) => (
          <div key={i} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== bookings.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div><div className="text-sm font-medium">{b.customer}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{b.car}</div></div>
            <span className="text-xs" style={{ color: MUTED }}>{b.from} → {b.to}</span>
          </div>
        ))}
      </Card>
    </>
  );
}
function InvoicesScreen() {
  return (
    <>
      <TopBar title="الفواتير" subtitle={`${invoices.length} فاتورة`} />
      <Card className="p-2">
        {invoices.map((v, i) => (
          <div key={i} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== invoices.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <span className="text-sm font-medium">{v.customer}</span>
            <div className="flex items-center gap-4"><span className="text-sm">{v.amount}</span><span className="text-xs px-3 py-1.5 rounded-full" style={{ color: v.status === "مدفوعة" ? GREEN : GOLD, background: `${v.status === "مدفوعة" ? GREEN : GOLD}1A`, border: `1px solid ${v.status === "مدفوعة" ? GREEN : GOLD}` }}>{v.status}</span></div>
          </div>
        ))}
      </Card>
    </>
  );
}

function CarRentalOS() {
  const [nav, setNav] = useState(0);
  const [fleet] = useState(initialFleet);
  const [bookingsList, setBookingsList] = useState(bookings);
  const [showModal, setShowModal] = useState(false);
  const screens = [<FleetScreen fleet={fleet} />, <BookingsScreen bookings={bookingsList} onAdd={() => setShowModal(true)} />, <InvoicesScreen />];
  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans" style={{ background: BG, color: TEXT }}>
      <aside className="w-64 shrink-0 flex flex-col border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="px-6 py-7 flex items-center gap-3 border-b" style={{ borderColor: BORDER }}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }}><Car size={19} style={{ color: GOLD }} /></div>
          <div><div className="text-base font-semibold tracking-tight">دريفلاين</div><div className="text-xs" style={{ color: MUTED }}>تأجير سيارات فاخرة</div></div>
        </div>
        <nav className="flex-1 px-3 py-5 flex flex-col gap-1">
          {NAV.map((item, i) => { const Icon = item.icon; const isActive = i === nav; return (
            <button key={item.label} onClick={() => setNav(i)} className="flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-colors text-right" style={{ background: isActive ? GOLD_SOFT : "transparent", color: isActive ? GOLD : MUTED, border: isActive ? `1px solid ${GOLD}` : "1px solid transparent" }}>
              <Icon size={17} /><span className="flex-1">{item.label}</span>{isActive && <ChevronRight size={14} />}
            </button>
          );})}
        </nav>
      </aside>
      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[nav]}</main>
      {showModal && <NewBookingModal onClose={() => setShowModal(false)} onCreate={(b) => { setBookingsList((p) => [b, ...p]); setShowModal(false); }} />}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<CarRentalOS />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
