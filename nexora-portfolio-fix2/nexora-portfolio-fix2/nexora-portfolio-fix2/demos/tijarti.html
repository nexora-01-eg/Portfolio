function useCountUp(target, active, duration = 900) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    let raf, start;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(target * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, active]);
  return val;
}

function Kpi({ k, active }) {
  const isPercent = k.suffix === "%";
  const raw = useCountUp(k.value, active, 1000);
  const display = isPercent ? raw.toFixed(1) : Math.round(raw).toLocaleString("en-US");
  return (
    <Card className="p-5">
      <div className="flex items-center justify-between mb-4">
        <span className="text-xs" style={{ color: MUTED }}>{k.label}</span>
        <span className="text-xs font-medium flex items-center gap-1" style={{ color: k.down ? "#C24A4A" : GREEN }}>
          <TrendingUpIcon size={11} style={{ transform: k.down ? "scaleY(-1)" : "none" }} />
          {k.delta}
        </span>
      </div>
      <div className="text-2xl font-semibold tracking-tight" style={{ fontVariantNumeric: "tabular-nums" }}>{display}{k.suffix}</div>
    </Card>
  );
}

    <>
      <TopBar title="التقارير" subtitle="أداء المتجر خلال آخر ٣٠ يومًا" />
      <Card className="p-6">
        <div className="text-sm font-semibold mb-5">الإيرادات اليومية</div>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={topProducts.map((p, i) => ({ day: `يوم ${i + 1}`, value: p.sold * 35 }))}>
            <CartesianGrid strokeDasharray="3 3" stroke={BORDER} vertical={false} />
            <XAxis dataKey="day" stroke={MUTED} fontSize={12} tickLine={false} axisLine={false} />
            <YAxis stroke={MUTED} fontSize={12} tickLine={false} axisLine={false} />
            <Tooltip contentStyle={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, color: TEXT }} cursor={{ fill: "rgba(201,162,39,0.06)" }} />
            <Bar dataKey="value" fill={GOLD} radius={[6, 6, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </Card>
    </>
  );
}

function Tijarti() {
  const [nav, setNav] = useState(0);
  const [orders, setOrders] = useState(initialOrders);
  const [products, setProducts] = useState(initialProducts);
  const [showOrderModal, setShowOrderModal] = useState(false);
  const [showProductModal, setShowProductModal] = useState(false);

  const screens = [
    <DashboardScreen key="d" />,
    <OrdersScreen key="o" orders={orders} onAdd={() => setShowOrderModal(true)} />,
    <ProductsScreen key="p" products={products} onAdd={() => setShowProductModal(true)} />,
    <CustomersScreen key="c" />,
    <ShippingScreen key="s" />,
    <ReportsScreen key="r" />,
  ];

  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans app-bg" style={{ background: BG, color: TEXT }}>
      <style>{`
        .app-bg {
          background-image: radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,0.08), transparent 60%),
                             radial-gradient(ellipse 700px 500px at 100% 10%, rgba(91,127,196,0.06), transparent 60%);
        }
        .card-glow { transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease; }
        .card-glow:hover { border-color: rgba(201,162,39,0.35); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
        .product-card:hover { transform: translateY(-3px); }
        .row-hover { transition: background .15s ease; }
        .row-hover:hover { background: rgba(201,162,39,0.035); }
        .gold-btn { transition: transform .15s ease, box-shadow .15s ease; }
        .gold-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(201,162,39,0.35); }
        .nav-btn { transition: all .2s ease; position: relative; }
        .nav-btn.active::before { content: ""; position: absolute; right: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: linear-gradient(180deg, #E8C35A, #C9A227); }
        .focus-gold:focus { border-color: #C9A227 !important; box-shadow: 0 0 0 3px rgba(201,162,39,0.15); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        main > * { animation: fadeInUp .35s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-pop { animation: modalIn .22s cubic-bezier(.22,1,.36,1); }
        .modal-overlay { animation: fadeInUp .18s ease; }
        .logo-glow { box-shadow: 0 0 0 1px rgba(201,162,39,0.3), 0 0 24px rgba(201,162,39,0.25); }
      `}</style>

      <aside className="w-64 shrink-0 flex flex-col border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="px-6 py-7 flex items-center gap-3 border-b" style={{ borderColor: BORDER }}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center logo-glow" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }}>
            <ShoppingBagIcon size={19} color={GOLD} />
          </div>
          <div>
            <div className="text-base font-semibold tracking-tight">تجارتي</div>
            <div className="text-xs" style={{ color: MUTED }}>منصة التجارة الاجتماعية</div>
          </div>
        </div>
        <nav className="flex-1 px-3 py-5 flex flex-col gap-1">
          {NAV.map((item, i) => {
            const IconEl = item.icon; const isActive = i === nav;
            return (
              <button key={item.label} onClick={() => setNav(i)} className={`nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-sm text-right ${isActive ? "active" : ""}`}
                style={{ background: isActive ? GOLD_SOFT : "transparent", color: isActive ? GOLD : MUTED, border: isActive ? `1px solid ${GOLD}` : "1px solid transparent" }}>
                <IconEl size={17} /><span className="flex-1">{item.label}</span>{isActive && <ChevronRightIcon size={14} />}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-5 border-t" style={{ borderColor: BORDER }}>
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }}>
              <StarIcon size={13} color={GOLD} fill={GOLD} />
            </div>
            <div>
              <div className="text-sm font-medium">متجر لمسة</div>
              <div className="text-xs" style={{ color: MUTED }}>بائع معتمد</div>
            </div>
          </div>
        </div>
      </aside>

      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[nav]}</main>

      {showOrderModal && <NewOrderModal onClose={() => setShowOrderModal(false)} onCreate={(o) => { setOrders((p) => [o, ...p]); setShowOrderModal(false); }} />}
      {showProductModal && <NewProductModal onClose={() => setShowProductModal(false)} onCreate={(p) => { setProducts((prev) => [p, ...prev]); setShowProductModal(false); }} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Tijarti />);
</script>
</body>
</html>
