<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لمحة — إدارة محل النظارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161B2E;
  --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(217,122,69,0.18), transparent 60%),
             radial-gradient(ellipse 700px 500px at 0% 100%, rgba(79,195,199,0.14), transparent 55%),
             #161B2E;
  --raised:#1D2440;
  --card: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.09);
  --copper:#D97A45;
  --copper-soft: rgba(217,122,69,0.17);
  --turquoise:#4FC3C7;
  --turquoise-soft: rgba(79,195,199,0.16);
  --gold:#E8C468;
  --gold-soft: rgba(232,196,104,0.16);
  --rose:#D9738F;
  --rose-soft: rgba(217,115,143,0.16);
  --cream:#F4EFE6;
  --muted:#9AA2C4;
  --faint:#565E82;
  --r-lg:26px;
  --ease: cubic-bezier(.22,1,.36,1);
  --shadow: 0 20px 46px -22px rgba(0,0,0,0.55);
  --font-display:'Reem Kufi', sans-serif;
  --font-body:'Tajawal', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--cream); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; border-radius:8px; }
.device{ width:100%; max-width:430px; background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px), var(--raised); border-radius:34px; border:1px solid var(--border); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; }
.avatar{ width:44px; height:44px; border-radius:14px; background:linear-gradient(150deg, var(--copper), #96502a); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:16px; color:#161B2E; flex-shrink:0; }
.hello .greet{ font-size:12.5px; color:var(--muted); }
.hello .name{ font-family:var(--font-display); font-weight:600; font-size:17px; margin-top:1px; }
.icon-btn{ width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; position:relative; }
.icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.icon-btn .dot{ position:absolute; top:7px; left:7px; width:7px; height:7px; border-radius:50%; background:var(--rose); box-shadow:0 0 0 2px var(--raised); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }

/* ===== hero: lens-frame motif ===== */
.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(217,122,69,0.22), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--copper); text-transform:uppercase; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:600; font-size:21px; margin-top:12px; line-height:1.5; position:relative; z-index:1; }
.hero-title span{ color:var(--turquoise); }
.glasses-icon-row{ margin-top:12px; position:relative; z-index:1; }
.stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:18px; font-weight:600; }
.stat span{ font-size:10px; color:var(--muted); }

.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
.qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }

.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; }
.sec-head h2{ font-family:var(--font-display); font-weight:600; font-size:16.5px; }
.sec-head .more{ font-size:11px; color:var(--copper); }

.appt-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; margin-bottom:9px; }
.appt-time{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:46px; flex-shrink:0; }
.appt-time b{ font-family:var(--font-mono); font-size:13px; } .appt-time span{ font-size:9px; color:var(--faint); }
.appt-line{ width:1px; align-self:stretch; background:var(--border); }
.appt-info{ flex:1; min-width:0; } .appt-info .pname{ font-weight:700; font-size:13px; } .appt-info .ptype{ font-size:11px; color:var(--muted); margin-top:2px; }
.type-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; }
.type-badge.exam{ background:var(--turquoise-soft); color:var(--turquoise); }
.type-badge.pickup{ background:var(--gold-soft); color:var(--gold); }
.type-badge.fitting{ background:var(--copper-soft); color:var(--copper); }

/* eye-care nudge (signature) */
.self-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; margin-bottom:9px; background:linear-gradient(120deg, var(--turquoise-soft), transparent); border:1px dashed rgba(79,195,199,0.4); }
.self-card .ic{ width:40px; height:40px; border-radius:13px; background:var(--turquoise-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.self-card .ic svg{ width:18px; height:18px; color:var(--turquoise); }
.self-card b{ font-size:12.5px; display:block; } .self-card span{ font-size:11px; color:var(--muted); }

.chart-card{ padding:18px; margin-top:4px; }
.chart-top{ display:flex; justify-content:space-between; align-items:center; }
.chart-top h3{ font-family:var(--font-display); font-size:14.5px; font-weight:600; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--turquoise); background:var(--turquoise-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:600; font-size:23px; margin-top:8px; }
.chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }

.client-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); }
.client-row:first-child{ border-top:none; padding-top:0; }
.c-avatar{ width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:12px; font-weight:700; flex-shrink:0; }
.client-row .info{ flex:1; min-width:0; } .client-row .cn{ font-size:12.5px; font-weight:700; } .client-row .cm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.rx-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 8px; border-radius:20px; }
.rx-badge.ready{ background:var(--turquoise-soft); color:var(--turquoise); }
.rx-badge.progress{ background:var(--gold-soft); color:var(--gold); }

.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:16px; background:linear-gradient(150deg, var(--copper), #96502a); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(217,122,69,0.5); z-index:20; }
.fab svg{ width:22px; height:22px; color:#161B2E; }

.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(22,27,46,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; }
.tab svg{ width:19px; height:19px; }
.tab.active{ color:var(--copper); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar">
    <div class="hello">
      <div class="avatar">آد</div>
      <div><div class="greet">مساء النور يا دكتور</div><div class="name">د. آدم فوزي</div></div>
    </div>
    <button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
  </div>

  <div class="scroll">
    <div class="glass hero-card">
      <div class="hero-eyebrow">شغل النهاردة</div>
      <div class="hero-title">عندك <span>٥ كشوفات نظر</span><br>و٣ نضارات جاهزة للاستلام</div>
      <svg class="glasses-icon-row" viewBox="0 0 200 40" width="120" height="24">
        <circle cx="34" cy="20" r="15" fill="none" stroke="#D97A45" stroke-width="2.5" style="stroke-dasharray:100; stroke-dashoffset:100; animation:drawG 1.4s cubic-bezier(.22,1,.36,1) forwards;"/>
        <circle cx="66" cy="20" r="15" fill="none" stroke="#4FC3C7" stroke-width="2.5" style="stroke-dasharray:100; stroke-dashoffset:100; animation:drawG 1.4s cubic-bezier(.22,1,.36,1) forwards; animation-delay:.15s;"/>
        <line x1="49" y1="20" x2="51" y2="20" stroke="#D97A45" stroke-width="2.5"/>
        <line x1="19" y1="18" x2="6" y2="12" stroke="#D97A45" stroke-width="2.5"/>
        <line x1="81" y1="18" x2="94" y2="12" stroke="#4FC3C7" stroke-width="2.5"/>
        <style>@keyframes drawG{ to{ stroke-dashoffset:0; } }</style>
      </svg>
      <div class="stat-row">
        <div class="stat"><b id="s1">0</b><span>كشوفات</span></div>
        <div class="stat"><b id="s2">0</b><span>عملا جدد</span></div>
        <div class="stat"><b id="s3">0</b><span>مبيعات ج.م</span></div>
      </div>
    </div>

    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--copper-soft); color:var(--copper);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>كشف جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--turquoise-soft); color:var(--turquoise);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg></div><span>عميل جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--gold-soft); color:var(--gold);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 14c.4 1.1.5 2.2.3 3.2-.7.3-1.9.2-3-.4-2.6-1.4-4.8-3.6-6.2-6.2-.6-1.1-.7-2.3-.4-3 1-.2 2.1-.1 3.2.3"/><circle cx="12" cy="12" r="9"/></svg></div><span>واتساب</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--rose-soft); color:var(--rose);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
    </div>

    <div class="sec-head"><h2>مواعيد النهاردة</h2><span class="more">الكل</span></div>
    <div id="apptList"></div>

    <div class="sec-head"><h2>نمو المحل</h2></div>
    <div class="glass chart-card">
      <div class="chart-top"><h3>مبيعات أسبوعيًا</h3><span class="chart-badge">▲ ١٣٪</span></div>
      <div class="chart-num">٢١,٦٠٠ <small>جنيه هذا الأسبوع</small></div>
      <svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg>
    </div>

    <div class="sec-head"><h2>أحدث العملا</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="clientList"></div>
  </div>

  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>المواعيد</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>العملا</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>

<script>
function animateCount(el,target,dur=1000){ const start=performance.now();
  function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); }
  requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),5); animateCount(document.getElementById('s2'),4); animateCount(document.getElementById('s3'),3200); },300);

const appts=[
  {time:'١٠:٠٠', period:'ص', name:'مريم توفيق', type:'كشف نظر شامل', tag:'exam'},
  {time:'١١:٣٠', period:'ص', name:'زياد رمزي', type:'استلام نضارة طبية', tag:'pickup'},
  {note:true, title:'قاعدة ٢٠-٢٠-٢٠ لعنيك', sub:'كل ٢٠ دقيقة، بُص لحاجة بعيدة ٢٠ ثانية'},
  {time:'١:٠٠', period:'م', name:'هبة الديب', type:'تركيب عدسات لاصقة', tag:'fitting'},
  {time:'٤:٣٠', period:'م', name:'باسل نبيل', type:'استلام نضارة شمس', tag:'pickup'},
];
document.getElementById('apptList').innerHTML = appts.map(a=>{
  if(a.note){
    return `<div class="self-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></div><div><b>${a.title}</b><span>${a.sub}</span></div></div>`;
  }
  const labels={exam:'كشف', pickup:'استلام', fitting:'تركيب'};
  return `<div class="glass appt-card">
    <div class="appt-time"><b>${a.time}</b><span>${a.period}</span></div>
    <div class="appt-line"></div>
    <div class="appt-info"><div class="pname">${a.name}</div><div class="ptype">${a.type}</div></div>
    <span class="type-badge ${a.tag}">${labels[a.tag]}</span>
  </div>`;
}).join('');

(function(){ const svg=document.getElementById('spark'); const vals=[24,28,26,32,30,36,40]; const W=340,H=70,pad=4,max=44;
  const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`;
  vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; });
  const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`;
  svg.innerHTML=`<defs><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--turquoise)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--turquoise)" stop-opacity="0"/></linearGradient></defs>
  <path d="${fillD}" fill="url(#g6)" stroke="none"/><path d="${d}" fill="none" stroke="var(--turquoise)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();

const clients=[
  {name:'مريم توفيق', meta:'كشف شامل · النهاردة', init:'مت', rx:'progress'},
  {name:'زياد رمزي', meta:'نضارة طبية جاهزة', init:'زر', rx:'ready'},
  {name:'هبة الديب', meta:'عدسات لاصقة', init:'هد', rx:'progress'},
  {name:'باسل نبيل', meta:'نضارة شمس جاهزة', init:'بن', rx:'ready'},
];
document.getElementById('clientList').innerHTML = clients.map(c=>`
  <div class="client-row"><div class="c-avatar">${c.init}</div>
    <div class="info"><div class="cn">${c.name}</div><div class="cm">${c.meta}</div></div>
    <span class="rx-badge ${c.rx}">${c.rx==='ready'?'جاهزة':'جاري'}</span>
  </div>`).join('');
</script>
</body>
</html>
