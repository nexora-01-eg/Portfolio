<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قماشة — إدارة بوتيكك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241726; --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(216,164,127,0.2), transparent 60%), radial-gradient(ellipse 700px 500px at 0% 100%, rgba(122,74,94,0.14), transparent 55%), #241726;
  --raised:#301D33; --card:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.09);
  --rosegold:#D8A47F; --rosegold-soft:rgba(216,164,127,0.18); --plum:#7A4C5E; --plum-soft:rgba(122,76,94,0.18);
  --mint:#8FBFA8; --mint-soft:rgba(143,191,168,0.16); --cream:#F6EEE4; --muted:#C1A6BD; --faint:#77596F;
  --r-lg:26px; --ease:cubic-bezier(.22,1,.36,1); --shadow:0 20px 46px -22px rgba(0,0,0,0.55);
  --font-display:'Jomhuria', sans-serif; --font-body:'Tajawal', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--cream); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
.device{ width:100%; max-width:430px; background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px), var(--raised); border-radius:34px; border:1px solid var(--border); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; } .avatar{ width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg, var(--rosegold), #8a5936); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:400; font-size:22px; color:#241726; flex-shrink:0; }
.hello .greet{ font-size:12.5px; color:var(--muted); } .hello .name{ font-family:var(--font-display); font-weight:400; font-size:24px; margin-top:-2px; }
.icon-btn{ width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; position:relative; } .icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.icon-btn .dot{ position:absolute; top:7px; left:7px; width:7px; height:7px; border-radius:50%; background:var(--plum); box-shadow:0 0 0 2px var(--raised); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; } .scroll::-webkit-scrollbar{ display:none; }
.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(216,164,127,0.22), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--rosegold); text-transform:uppercase; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:400; font-size:28px; margin-top:8px; line-height:1.3; position:relative; z-index:1; } .hero-title span{ color:var(--mint); }
.stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:24px; font-weight:400; } .stat span{ font-size:10px; color:var(--muted); }
.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; } .qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; } .sec-head h2{ font-family:var(--font-display); font-weight:400; font-size:23px; } .sec-head .more{ font-size:11px; color:var(--rosegold); }
.order-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; margin-bottom:9px; }
.order-icon{ width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; } .order-icon svg{ width:16px; height:16px; }
.order-info{ flex:1; min-width:0; } .order-info .on{ font-weight:700; font-size:13px; } .order-info .om{ font-size:11px; color:var(--muted); margin-top:2px; }
.stage-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; } .stage-badge.new{ background:var(--rosegold-soft); color:var(--rosegold); } .stage-badge.fitting{ background:var(--plum-soft); color:var(--plum); } .stage-badge.ready{ background:var(--mint-soft); color:var(--mint); }
.self-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; margin-bottom:9px; background:linear-gradient(120deg, var(--mint-soft), transparent); border:1px dashed rgba(143,191,168,0.4); }
.self-card .ic{ width:40px; height:40px; border-radius:13px; background:var(--mint-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .self-card .ic svg{ width:18px; height:18px; color:var(--mint); }
.self-card b{ font-size:12.5px; display:block; } .self-card span{ font-size:11px; color:var(--muted); }
.chart-card{ padding:18px; margin-top:4px; } .chart-top{ display:flex; justify-content:space-between; align-items:center; } .chart-top h3{ font-family:var(--font-display); font-size:20px; font-weight:400; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--mint); background:var(--mint-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:400; font-size:28px; margin-top:6px; } .chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }
.client-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); } .client-row:first-child{ border-top:none; padding-top:0; }
.c-avatar{ width:36px; height:36px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:16px; flex-shrink:0; }
.client-row .info{ flex:1; min-width:0; } .client-row .cn{ font-size:12.5px; font-weight:700; } .client-row .cm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.pay-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 8px; border-radius:20px; } .pay-badge.paid{ background:var(--mint-soft); color:var(--mint); } .pay-badge.due{ background:var(--plum-soft); color:var(--plum); }
.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:50%; background:linear-gradient(150deg, var(--rosegold), #8a5936); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(216,164,127,0.5); z-index:20; } .fab svg{ width:22px; height:22px; color:#241726; }
.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(36,23,38,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; } .tab svg{ width:19px; height:19px; } .tab.active{ color:var(--rosegold); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar"><div class="hello"><div class="avatar">ه</div><div><div class="greet">مساء الخير يا هانم</div><div class="name">هدى فوزي</div></div></div><button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button></div>
  <div class="scroll">
    <div class="glass hero-card">
      <span class="hero-eyebrow">شغل البوتيك</span>
      <div class="hero-title">عندك <span>٥ فساتين</span> جاهزة<br>و٣ عميلات محتاجين فيتينج</div>
      <div class="stat-row"><div class="stat"><b id="s1">0</b><span>طلبات</span></div><div class="stat"><b id="s2">0</b><span>عميلات جدد</span></div><div class="stat"><b id="s3">0</b><span>مبيعات ج.م</span></div></div>
    </div>
    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--rosegold-soft); color:var(--rosegold);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>طلب جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--plum-soft); color:var(--plum);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg></div><span>عميلة جديدة</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--mint-soft); color:var(--mint);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 14c.4 1.1.5 2.2.3 3.2-.7.3-1.9.2-3-.4-2.6-1.4-4.8-3.6-6.2-6.2-.6-1.1-.7-2.3-.4-3 1-.2 2.1-.1 3.2.3"/><circle cx="12" cy="12" r="9"/></svg></div><span>واتساب</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--rosegold-soft); color:var(--rosegold);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
    </div>
    <div class="sec-head"><h2>الطلبات النهاردة</h2><span class="more">الكل</span></div>
    <div id="orderList"></div>
    <div class="sec-head"><h2>نمو البوتيك</h2></div>
    <div class="glass chart-card"><div class="chart-top"><h3>مبيعات أسبوعيًا</h3><span class="chart-badge">▲ ٢١٪</span></div><div class="chart-num">١٩,٨٠٠ <small>جنيه هذا الأسبوع</small></div><svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg></div>
    <div class="sec-head"><h2>أحدث العميلات</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="clientList"></div>
  </div>
  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2l2 4h8l2-4M6 6l-2 4v12h16V10l-2-4"/></svg>الطلبات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>العميلات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>
<script>
function animateCount(el,target,dur=1000){ const start=performance.now(); function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); } requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),5); animateCount(document.getElementById('s2'),4); animateCount(document.getElementById('s3'),3600); },300);
const orders=[
  {name:'فستان سواريه — عميلة: مريم توفيق', meta:'قماش حرير · تسليم الخميس', stage:'fitting', ic:'plum'},
  {name:'بدلة سهرة — عميلة: نور الهدى', meta:'تفصيل مخصص · تسليم السبت', stage:'new', ic:'rosegold'},
  {note:true, title:'فيتينج فستان الزفاف بكرة', sub:'عميلة: رنا كامل — الساعة ٤'},
  {name:'جلابية مطرزة — عميلة: هالة نجيب', meta:'جاهزة للاستلام', stage:'ready', ic:'mint'},
];
document.getElementById('orderList').innerHTML = orders.map(o=>{
  if(o.note){ return `<div class="self-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg></div><div><b>${o.title}</b><span>${o.sub}</span></div></div>`; }
  const labels={new:'جديد', fitting:'فيتينج', ready:'جاهز'};
  return `<div class="glass order-card"><div class="order-icon" style="background:var(--${o.ic}-soft); color:var(--${o.ic});"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2l2 4h8l2-4M6 6l-2 4v12h16V10l-2-4"/></svg></div><div class="order-info"><div class="on">${o.name}</div><div class="om">${o.meta}</div></div><span class="stage-badge ${o.stage}">${labels[o.stage]}</span></div>`;
}).join('');
(function(){ const svg=document.getElementById('spark'); const vals=[18,22,20,26,24,30,34]; const W=340,H=70,pad=4,max=38; const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`; vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; }); const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`; svg.innerHTML=`<defs><linearGradient id="gq" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--mint)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--mint)" stop-opacity="0"/></linearGradient></defs><path d="${fillD}" fill="url(#gq)" stroke="none"/><path d="${d}" fill="none" stroke="var(--mint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();
const clients=[ {name:'مريم توفيق', meta:'فستان سواريه', init:'مت', pay:'due'}, {name:'نور الهدى', meta:'بدلة سهرة', init:'نه', pay:'paid'}, {name:'رنا كامل', meta:'فستان زفاف', init:'رك', pay:'due'} ];
document.getElementById('clientList').innerHTML = clients.map(c=>`<div class="client-row"><div class="c-avatar">${c.init}</div><div class="info"><div class="cn">${c.name}</div><div class="cm">${c.meta}</div></div><span class="pay-badge ${c.pay}">${c.pay==='paid'?'اتحصّل':'مستحق'}</span></div>`).join('');
</script>
</body>
</html>
