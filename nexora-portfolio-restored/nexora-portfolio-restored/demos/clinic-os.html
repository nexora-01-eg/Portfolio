<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عيادتي — نظام تشغيل عيادات الأسنان</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #C9A227; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState } from "react";
import {
  BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer,
  PieChart, Pie, Cell, CartesianGrid,
} from "recharts";
import {
  LayoutGrid, Users, CalendarDays, FileText, Settings,
  Stethoscope, Search, Bell, ChevronRight, Clock, CircleDot, Plus, X,
  Phone, Bell as BellDot, Moon, Globe, ShieldCheck,
} from "lucide-react";

const GOLD = "#C9A227";
const GOLD_SOFT = "rgba(201,162,39,0.14)";
const EMERALD = "#2E9E6F";
const BG = "#0A0A0C";
const PANEL = "#131316";
const CARD = "#17171B";
const BORDER = "#25252B";
const TEXT = "#F2F1EC";
const MUTED = "#8E8E93";
const DANGER = "#C24A4A";

const NAV = [
  { icon: LayoutGrid, label: "الرئيسية" },
  { icon: Users, label: "المرضى" },
  { icon: CalendarDays, label: "المواعيد" },
  { icon: FileText, label: "الفواتير" },
  { icon: Stethoscope, label: "الحالات الطبية" },
  { icon: Settings, label: "الإعدادات" },
];

const kpis = [
  { label: "مرضى اليوم", value: "24", delta: "+12%", icon: Users },
  { label: "مواعيد جديدة", value: "9", delta: "+4%", icon: CalendarDays },
  { label: "إيرادات اليوم", value: "6,450 ج.م", delta: "+18%", icon: FileText },
  { label: "معدل الحضور", value: "94%", delta: "+2%", icon: CircleDot },
];

const weekly = [
  { day: "سبت", value: 3200 }, { day: "حد", value: 4100 }, { day: "اتنين", value: 3800 },
  { day: "تلات", value: 5200 }, { day: "أربع", value: 4700 }, { day: "خميس", value: 6450 }, { day: "جمعة", value: 2100 },
];

const caseDist = [
  { name: "متابعة دورية", value: 42 }, { name: "حشو وأسنان", value: 28 },
  { name: "حالات طارئة", value: 12 }, { name: "استشارة أولى", value: 18 },
];
const CASE_COLORS = [GOLD, EMERALD, DANGER, "#5B6EAE"];

const initialAppointments = [
  { time: "09:00 ص", patient: "منى عبد الفتاح", type: "متابعة", status: "مؤكد" },
  { time: "10:30 ص", patient: "كريم السيد", type: "حشو ضرس", status: "قيد الانتظار" },
  { time: "11:15 ص", patient: "ياسمين طارق", type: "استشارة أولى", status: "مؤكد" },
  { time: "01:00 م", patient: "أحمد لطفي", type: "طوارئ", status: "عاجل" },
  { time: "02:45 م", patient: "دينا محسن", type: "متابعة", status: "مؤكد" },
];

const initialPatients = [
  { name: "منى عبد الفتاح", age: 34, phone: "٠١٠ ١٢٣٤ ٥٦٧٨", lastVisit: "٩ يوليو", status: "مستقر" },
  { name: "كريم السيد", age: 28, phone: "٠١٢ ٩٨٧٦ ٥٤٣٢", lastVisit: "٥ يوليو", status: "مستقر" },
  { name: "أحمد لطفي", age: 51, phone: "٠١١ ٤٥٦٧ ١٢٣٤", lastVisit: "١١ يوليو", status: "حرج" },
  { name: "دينا محسن", age: 22, phone: "٠١٥ ٣٣٢٢ ٧٧٨٨", lastVisit: "٣ يوليو", status: "متابعة" },
];

const invoices = [
  { id: "#INV-3391", patient: "منى عبد الفتاح", amount: "850 ج.م", status: "مدفوعة", date: "٩ يوليو" },
  { id: "#INV-3390", patient: "كريم السيد", amount: "1,200 ج.م", status: "معلقة", date: "٥ يوليو" },
  { id: "#INV-3388", patient: "أحمد لطفي", amount: "2,400 ج.م", status: "مدفوعة", date: "١١ يوليو" },
  { id: "#INV-3385", patient: "دينا محسن", amount: "600 ج.م", status: "معلقة", date: "٣ يوليو" },
];

const diagnoses = [
  { patient: "منى عبد الفتاح", diagnosis: "التهاب لثة خفيف", doctor: "د. محمد عادل", date: "٩ يوليو" },
  { patient: "أحمد لطفي", diagnosis: "خراج سني حاد", doctor: "د. محمد عادل", date: "١١ يوليو" },
  { patient: "كريم السيد", diagnosis: "تسوس ضرس العقل", doctor: "د. محمد عادل", date: "٥ يوليو" },
];

const statusColor = (s) => (s === "مؤكد" || s === "مدفوعة" || s === "مستقر") ? EMERALD
  : (s === "عاجل" || s === "حرج") ? DANGER : GOLD;

function Card({ children, className = "", style = {} }) {
  return <div className={`rounded-2xl border ${className}`} style={{ background: CARD, borderColor: BORDER, ...style }}>{children}</div>;
}

function TopBar({ title, subtitle, onAdd, addLabel }) {
  return (
    <div className="flex items-center justify-between mb-8">
      <div>
        <h1 className="text-2xl font-semibold tracking-tight">{title}</h1>
        {subtitle && <p className="text-sm mt-1" style={{ color: MUTED }}>{subtitle}</p>}
      </div>
      <div className="flex items-center gap-3">
        <div className="flex items-center gap-2 px-4 py-2.5 rounded-xl border" style={{ borderColor: BORDER, background: PANEL }}>
          <Search size={15} style={{ color: MUTED }} />
          <span className="text-sm" style={{ color: MUTED }}>بحث...</span>
        </div>
        {onAdd && (
          <button onClick={onAdd} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm" style={{ background: GOLD, color: "#141110" }}>
            <Plus size={15} />{addLabel}
          </button>
        )}
        <div className="w-10 h-10 rounded-xl border flex items-center justify-center" style={{ borderColor: BORDER, background: PANEL }}>
          <Bell size={17} style={{ color: MUTED }} />
        </div>
      </div>
    </div>
  );
}

function Modal({ title, note, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24" style={{ background: "rgba(0,0,0,0.55)" }}>
      <Card className="w-full max-w-md p-7 relative" style={{ borderColor: GOLD }}>
        <button onClick={onClose} className="absolute left-5 top-5" style={{ color: MUTED }}><X size={18} /></button>
        <div className="text-lg font-semibold mb-1">{title}</div>
        <div className="text-xs mb-6" style={{ color: MUTED }}>{note}</div>
        {children}
      </Card>
    </div>
  );
}

const inputStyle = { background: "#141110", borderColor: BORDER, color: TEXT };
const Field = ({ label, ...props }) => (
  <div className="mb-4">
    <label className="text-xs" style={{ color: MUTED }}>{label}</label>
    <input {...props} className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl border text-sm outline-none" style={inputStyle} />
  </div>
);

function NewPatientModal({ onClose, onCreate }) {
  const [name, setName] = useState(""); const [age, setAge] = useState(""); const [phone, setPhone] = useState("");
  return (
    <Modal title="إضافة مريض جديد" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="اسم المريض" value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: سارة عزت" />
      <Field label="السن" value={age} onChange={(e) => setAge(e.target.value)} placeholder="مثال: 30" />
      <Field label="رقم الهاتف" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="٠١٠ ٠٠٠٠ ٠٠٠٠" />
      <button
        onClick={() => name.trim() && onCreate({ name, age: age || "—", phone: phone || "—", lastVisit: "اليوم", status: "متابعة" })}
        className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: GOLD, color: "#141110" }}
      >إضافة المريض</button>
    </Modal>
  );
}

function NewAppointmentModal({ onClose, onCreate }) {
  const [patient, setPatient] = useState(""); const [time, setTime] = useState(""); const [type, setType] = useState("");
  return (
    <Modal title="حجز موعد جديد" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="اسم المريض" value={patient} onChange={(e) => setPatient(e.target.value)} placeholder="مثال: نادية حلمي" />
      <Field label="الوقت" value={time} onChange={(e) => setTime(e.target.value)} placeholder="مثال: 03:30 م" />
      <Field label="نوع الزيارة" value={type} onChange={(e) => setType(e.target.value)} placeholder="مثال: متابعة" />
      <button
        onClick={() => patient.trim() && onCreate({ patient, time: time || "—", type: type || "استشارة", status: "قيد الانتظار" })}
        className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: GOLD, color: "#141110" }}
      >تأكيد الحجز</button>
    </Modal>
  );
}

function DashboardScreen({ appointments }) {
  return (
    <>
      <TopBar title="نظرة عامة على العيادة" subtitle="السبت، ١١ يوليو — تحديث لحظي بالبيانات التجريبية" />
      <div className="grid grid-cols-4 gap-5 mb-7">
        {kpis.map((k) => {
          const Icon = k.icon;
          return (
            <Card key={k.label} className="p-5">
              <div className="flex items-center justify-between mb-4">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: GOLD_SOFT }}><Icon size={17} style={{ color: GOLD }} /></div>
                <span className="text-xs font-medium" style={{ color: EMERALD }}>{k.delta}</span>
              </div>
              <div className="text-2xl font-semibold tracking-tight">{k.value}</div>
              <div className="text-xs mt-1" style={{ color: MUTED }}>{k.label}</div>
            </Card>
          );
        })}
      </div>
      <div className="grid grid-cols-3 gap-5 mb-7">
        <Card className="col-span-2 p-6">
          <div className="text-sm font-semibold mb-5">الإيرادات الأسبوعية</div>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={weekly}>
              <CartesianGrid strokeDasharray="3 3" stroke={BORDER} vertical={false} />
              <XAxis dataKey="day" stroke={MUTED} fontSize={12} tickLine={false} axisLine={false} />
              <YAxis stroke={MUTED} fontSize={12} tickLine={false} axisLine={false} />
              <Tooltip contentStyle={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, color: TEXT }} />
              <Bar dataKey="value" fill={GOLD} radius={[6, 6, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </Card>
        <Card className="p-6">
          <div className="text-sm font-semibold mb-4">توزيع الحالات</div>
          <ResponsiveContainer width="100%" height={170}>
            <PieChart>
              <Pie data={caseDist} dataKey="value" nameKey="name" innerRadius={45} outerRadius={70} paddingAngle={3}>
                {caseDist.map((_, i) => <Cell key={i} fill={CASE_COLORS[i % CASE_COLORS.length]} />)}
              </Pie>
              <Tooltip contentStyle={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 10, color: TEXT }} />
            </PieChart>
          </ResponsiveContainer>
        </Card>
      </div>
      <Card className="p-6">
        <div className="text-sm font-semibold mb-5">مواعيد اليوم</div>
        {appointments.map((a, i) => (
          <div key={i} className="flex items-center justify-between py-3.5" style={{ borderBottom: i !== appointments.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 w-24" style={{ color: MUTED }}><Clock size={13} /><span className="text-xs">{a.time}</span></div>
              <div className="w-9 h-9 rounded-full" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }} />
              <div><div className="text-sm font-medium">{a.patient}</div><div className="text-xs" style={{ color: MUTED }}>{a.type}</div></div>
            </div>
            <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: statusColor(a.status), background: `${statusColor(a.status)}1A`, border: `1px solid ${statusColor(a.status)}` }}>{a.status}</span>
          </div>
        ))}
      </Card>
    </>
  );
}

function PatientsScreen({ patients, onAdd }) {
  return (
    <>
      <TopBar title="المرضى" subtitle={`${patients.length} مريضًا مسجّلًا`} onAdd={onAdd} addLabel="مريض جديد" />
      <Card className="p-2">
        {patients.map((p, i) => (
          <div key={i} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== patients.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 rounded-full" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }} />
              <div><div className="text-sm font-medium">{p.name}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>السن {p.age} · {p.phone}</div></div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-xs" style={{ color: MUTED }}>آخر زيارة: {p.lastVisit}</span>
              <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: statusColor(p.status), background: `${statusColor(p.status)}1A`, border: `1px solid ${statusColor(p.status)}` }}>{p.status}</span>
            </div>
          </div>
        ))}
      </Card>
    </>
  );
}

function AppointmentsScreen({ appointments, onAdd }) {
  return (
    <>
      <TopBar title="المواعيد" subtitle={`${appointments.length} موعدًا اليوم`} onAdd={onAdd} addLabel="حجز موعد" />
      <Card className="p-2">
        {appointments.map((a, i) => (
          <div key={i} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== appointments.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2 w-24" style={{ color: MUTED }}><Clock size={13} /><span className="text-xs">{a.time}</span></div>
              <div className="text-sm font-medium">{a.patient}</div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-xs" style={{ color: MUTED }}>{a.type}</span>
              <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: statusColor(a.status), background: `${statusColor(a.status)}1A`, border: `1px solid ${statusColor(a.status)}` }}>{a.status}</span>
            </div>
          </div>
        ))}
      </Card>
    </>
  );
}

function InvoicesScreen() {
  return (
    <>
      <TopBar title="الفواتير" subtitle={`${invoices.length} فاتورة`} />
      <Card className="p-2">
        {invoices.map((v, i) => (
          <div key={v.id} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== invoices.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div><div className="text-sm font-medium" style={{ color: GOLD }}>{v.id}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{v.patient} · {v.date}</div></div>
            <div className="flex items-center gap-4">
              <span className="text-sm">{v.amount}</span>
              <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: statusColor(v.status), background: `${statusColor(v.status)}1A`, border: `1px solid ${statusColor(v.status)}` }}>{v.status}</span>
            </div>
          </div>
        ))}
      </Card>
    </>
  );
}

function CasesScreen() {
  return (
    <>
      <TopBar title="الحالات الطبية" subtitle="آخر التشخيصات المسجّلة" />
      <div className="grid grid-cols-3 gap-5">
        {diagnoses.map((d, i) => (
          <Card key={i} className="p-6">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: GOLD_SOFT }}><Stethoscope size={17} style={{ color: GOLD }} /></div>
            <div className="text-sm font-medium">{d.diagnosis}</div>
            <div className="text-xs mt-1" style={{ color: MUTED }}>{d.patient}</div>
            <div className="text-xs mt-3" style={{ color: MUTED }}>{d.doctor} · {d.date}</div>
          </Card>
        ))}
      </div>
    </>
  );
}

function SettingsScreen() {
  const rows = [
    { icon: BellDot, label: "تنبيهات المواعيد", desc: "إشعار قبل كل موعد بـ ١٥ دقيقة" },
    { icon: ShieldCheck, label: "خصوصية بيانات المرضى", desc: "تشفير كامل للسجلات الطبية" },
    { icon: Moon, label: "الوضع الداكن", desc: "مفعّل دايمًا في هوية العيادة" },
    { icon: Globe, label: "اللغة", desc: "العربية" },
    { icon: Phone, label: "رقم الطوارئ", desc: "٠١٠ ٩٩٩ ٠٠٠٠" },
  ];
  return (
    <>
      <TopBar title="الإعدادات" subtitle="تفضيلات الحساب والعيادة" />
      <Card className="p-2">
        {rows.map((r, i) => {
          const Icon = r.icon;
          return (
            <div key={r.label} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== rows.length - 1 ? `1px solid ${BORDER}` : "none" }}>
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: GOLD_SOFT }}><Icon size={16} style={{ color: GOLD }} /></div>
                <div><div className="text-sm font-medium">{r.label}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{r.desc}</div></div>
              </div>
              <div className="w-10 h-6 rounded-full flex items-center px-0.5" style={{ background: GOLD }}><div className="w-5 h-5 rounded-full bg-white" style={{ marginRight: "auto" }} /></div>
            </div>
          );
        })}
      </Card>
    </>
  );
}

function ClinicOS() {
  const [nav, setNav] = useState(0);
  const [patients, setPatients] = useState(initialPatients);
  const [appointments, setAppointments] = useState(initialAppointments);
  const [showPatientModal, setShowPatientModal] = useState(false);
  const [showApptModal, setShowApptModal] = useState(false);

  const screens = [
    <DashboardScreen appointments={appointments} />,
    <PatientsScreen patients={patients} onAdd={() => setShowPatientModal(true)} />,
    <AppointmentsScreen appointments={appointments} onAdd={() => setShowApptModal(true)} />,
    <InvoicesScreen />,
    <CasesScreen />,
    <SettingsScreen />,
  ];

  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans" style={{ background: BG, color: TEXT }}>
      <aside className="w-64 shrink-0 flex flex-col border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="px-6 py-7 flex items-center gap-3 border-b" style={{ borderColor: BORDER }}>
          <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }}><Stethoscope size={19} style={{ color: GOLD }} /></div>
          <div><div className="text-base font-semibold tracking-tight">عيادتي</div><div className="text-xs" style={{ color: MUTED }}>نظام إدارة العيادات</div></div>
        </div>
        <nav className="flex-1 px-3 py-5 flex flex-col gap-1">
          {NAV.map((item, i) => {
            const Icon = item.icon; const isActive = i === nav;
            return (
              <button key={item.label} onClick={() => setNav(i)} className="flex items-center gap-3 px-4 py-3 rounded-xl text-sm transition-colors text-right"
                style={{ background: isActive ? GOLD_SOFT : "transparent", color: isActive ? GOLD : MUTED, border: isActive ? `1px solid ${GOLD}` : "1px solid transparent" }}>
                <Icon size={17} /><span className="flex-1">{item.label}</span>{isActive && <ChevronRight size={14} />}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-5 border-t" style={{ borderColor: BORDER }}>
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-full" style={{ background: GOLD_SOFT, border: `1px solid ${GOLD}` }} />
            <div><div className="text-sm font-medium">د. محمد عادل</div><div className="text-xs" style={{ color: MUTED }}>طبيب أسنان</div></div>
          </div>
        </div>
      </aside>

      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[nav]}</main>

      {showPatientModal && (
        <NewPatientModal onClose={() => setShowPatientModal(false)} onCreate={(p) => { setPatients((prev) => [p, ...prev]); setShowPatientModal(false); }} />
      )}
      {showApptModal && (
        <NewAppointmentModal onClose={() => setShowApptModal(false)} onCreate={(a) => { setAppointments((prev) => [a, ...prev]); setShowApptModal(false); }} />
      )}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<ClinicOS />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
