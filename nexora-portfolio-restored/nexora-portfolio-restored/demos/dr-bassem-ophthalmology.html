<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>د. باسم الشوربجي — مركز الرؤية لطب وجراحة العيون</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%91%81%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #1462A6; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState, useEffect } from "react";
import {
  Eye, Calendar, ShieldCheck, Check, Quote, Send, ArrowLeft, Scan,
  Sparkles, Sun, Glasses,
} from "lucide-react";

/* ============================== الهوية البصرية — عيادة د. باسم الشوربجي ============================== */
const FONT_ID = "dr-bassem-fonts";
function useFonts() {
  useEffect(() => {
    if (document.getElementById(FONT_ID)) return;
    const l = document.createElement("link");
    l.id = FONT_ID; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap";
    document.head.appendChild(l);
  }, []);
}

const C = {
  bg: "#F5F9FC", surface: "#FFFFFF", border: "#DCE7F0",
  ink: "#0F1E2B", muted: "#5E7387",
  blue: "#1462A6", blueDark: "#0D4479", blueSoft: "rgba(20,98,166,0.08)",
  silver: "#A9BFCF", ice: "#5FD0E0", iceSoft: "rgba(95,208,224,0.14)",
};
const font = { display: "'Cairo', sans-serif", body: "'Cairo', sans-serif" };
const shadow = { sm: "0 1px 3px rgba(15,30,43,0.06)", md: "0 10px 28px rgba(15,30,43,0.08)", lg: "0 26px 56px rgba(15,30,43,0.16)" };

const DOCTOR = { name: "د. باسم الشوربجي", title: "استشاري جراحة العيون والليزك", creds: "زميل الكلية الملكية لجراحي العيون (FRCOphth) — 17 سنة خبرة", clinic: "مركز الرؤية لطب وجراحة العيون", address: "شارع جامعة الدول العربية، المهندسين، الجيزة" };

const STATS = [{ v: "+11,200", l: "عملية ليزك" }, { v: "17", l: "سنة خبرة" }, { v: "99.4%", l: "دقة رؤية بعد العملية" }, { v: "4.9", l: "تقييم المرضى" }];

const CHART_ROWS = [
  { size: 46, letters: "ط ب س" }, { size: 36, letters: "ح ص ع" }, { size: 28, letters: "ف ق ك" },
  { size: 22, letters: "ن ه ي" }, { size: 16, letters: "ل م ر" },
];

/* ============================== لوحة اختبار نظر تفاعلية ============================== */
function VisionChart() {
  const [distance, setDistance] = useState(50);
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 24, padding: 30, boxShadow: shadow.md }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <Eye size={17} color={C.blue} />
        <span style={{ fontFamily: font.body, fontWeight: 700, fontSize: 18, color: C.ink }}>اختبار نظر تقريبي وممتع</span>
      </div>
      <p style={{ fontFamily: font.body, fontSize: 12, color: C.muted, marginBottom: 20 }}>حرّكي الشريط لتصغير الحروف وشوفي لحد فين تقدري تقرأ بوضوح — ده تجربة تفاعلية بسيطة، مش تشخيص طبي حقيقي.</p>
      <div style={{ background: C.blueDark, borderRadius: 18, padding: "34px 20px", textAlign: "center", marginBottom: 20 }}>
        {CHART_ROWS.map((r, i) => (
          <div key={i} style={{
            fontFamily: font.body, fontWeight: 800, color: "#fff", letterSpacing: 10,
            fontSize: Math.max(12, r.size * (distance / 50)), opacity: distance > (i + 1) * 15 ? 1 : 0.15,
            transition: "all 0.2s ease", marginBottom: 6,
          }}>{r.letters}</div>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <Scan size={16} color={C.blue} />
        <input type="range" min="10" max="90" value={distance} onChange={(e) => setDistance(Number(e.target.value))} style={{ flex: 1, accentColor: C.blue }} />
        <Eye size={16} color={C.blue} />
      </div>
      <div style={{ textAlign: "center", marginTop: 16, fontFamily: font.body, fontSize: 11.5, color: C.muted }}>لو حسيتي بصعوبة في قراءة الأسطر الصغيرة، يستحسن تحجزي فحص نظر كامل.</div>
    </div>
  );
}

/* ============================== الأقسام ============================== */

function Navbar() {
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(245,249,252,0.92)", backdropFilter: "blur(12px)", borderBottom: `1px solid ${C.border}` }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", padding: "16px 30px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 40, height: 40, borderRadius: 12, background: `linear-gradient(135deg, ${C.blue}, ${C.ice})`, display: "flex", alignItems: "center", justifyContent: "center" }}><Eye size={19} color="#fff" /></div>
          <div><div style={{ fontFamily: font.body, fontWeight: 700, fontSize: 16, color: C.ink }}>{DOCTOR.name}</div><div style={{ fontFamily: font.body, fontSize: 9.5, color: C.muted }}>{DOCTOR.clinic}</div></div>
        </div>
        <button style={{ display: "flex", alignItems: "center", gap: 8, background: C.blue, color: "#fff", border: "none", borderRadius: 11, padding: "11px 22px", fontFamily: font.body, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}><Calendar size={15} /> احجز فحص</button>
      </div>
    </div>
  );
}

function Hero() {
  return (
    <div style={{ maxWidth: 1200, margin: "0 auto", padding: "64px 30px 50px", display: "grid", gridTemplateColumns: "1fr 0.85fr", gap: 50, alignItems: "center" }} className="hero-grid">
      <div>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 7, background: C.iceSoft, borderRadius: 999, padding: "7px 15px", marginBottom: 20 }}>
          <ShieldCheck size={13} color="#1A8A96" /><span style={{ fontFamily: font.body, fontSize: 11.5, fontWeight: 700, color: "#1A8A96" }}>{DOCTOR.creds}</span>
        </div>
        <h1 style={{ fontFamily: font.body, fontWeight: 800, fontSize: 42, color: C.ink, lineHeight: 1.3, margin: "0 0 18px" }}>
          شوف الدنيا بوضوح <span style={{ color: C.blue }}>تام</span>
        </h1>
        <p style={{ fontFamily: font.body, fontSize: 14.5, color: C.muted, lineHeight: 1.9, maxWidth: 460, marginBottom: 28 }}>
          {DOCTOR.title} — جراحات ليزك ومياه بيضاء بأحدث الأجهزة الأوروبية، ودقة تشخيص عالية لكل حالة.
        </p>
        <div style={{ display: "flex", gap: 12, marginBottom: 40 }}>
          <button style={{ display: "flex", alignItems: "center", gap: 8, background: C.blue, color: "#fff", border: "none", borderRadius: 12, padding: "13px 24px", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><Calendar size={16} /> احجز فحص شامل</button>
          <button style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", color: C.blue, border: `1.5px solid ${C.blue}`, borderRadius: 12, padding: "13px 24px", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><ArrowLeft size={16} /> عن الليزك</button>
        </div>
        <div style={{ display: "flex", gap: 30 }}>
          {STATS.map((s, i) => (
            <div key={i}><div style={{ fontFamily: font.body, fontWeight: 800, fontSize: 22, color: C.ink }}>{s.v}</div><div style={{ fontFamily: font.body, fontSize: 10.5, color: C.muted, marginTop: 3 }}>{s.l}</div></div>
          ))}
        </div>
      </div>
      <div style={{ position: "relative" }}>
        <div style={{ position: "absolute", top: -20, right: -20, width: 200, height: 200, borderRadius: "50%", background: C.iceSoft, zIndex: 0 }} />
        <div style={{ position: "relative", aspectRatio: "4/5", borderRadius: 26, background: `linear-gradient(155deg, ${C.blue}, ${C.blueDark})`, boxShadow: shadow.lg, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Eye size={56} color="rgba(255,255,255,0.25)" />
        </div>
      </div>
    </div>
  );
}

function ChartSection() {
  return <div style={{ padding: "60px 30px" }}><div style={{ maxWidth: 640, margin: "0 auto" }}><VisionChart /></div></div>;
}

function TestimonialsSection() {
  const items = [
    { name: "شريف عادل", text: "عملية الليزك كانت أسرع وأسهل بكتير مما توقعت، وبقيت شايف بوضوح من أول يوم." },
    { name: "منى إسماعيل", text: "متابعة دقيقة جدًا مع والدتي في عملية المياه البيضاء، فريق محترف ومطمئن." },
  ];
  return (
    <div style={{ background: C.surface, borderTop: `1px solid ${C.border}`, padding: "64px 30px" }}>
      <div style={{ maxWidth: 900, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.blue, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 30 }}>آراء المرضى</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }} className="testimonials-grid">
          {items.map((t, i) => (
            <div key={i} style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 18, padding: 24, textAlign: "right" }}>
              <Quote size={20} color={C.ice} style={{ marginBottom: 12 }} />
              <p style={{ fontFamily: font.body, fontSize: 13, color: C.ink, lineHeight: 1.8, margin: 0 }}>{t.text}</p>
              <div style={{ fontFamily: font.body, fontSize: 11.5, color: C.muted, marginTop: 14, fontWeight: 600 }}>{t.name}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContactSection() {
  const [sent, setSent] = useState(false);
  return (
    <div style={{ padding: "64px 30px" }}>
      <div style={{ maxWidth: 520, margin: "0 auto", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 22, padding: 30, boxShadow: shadow.md, textAlign: "center" }}>
        <Glasses size={26} color={C.blue} style={{ margin: "0 auto 12px" }} />
        <h3 style={{ fontFamily: font.body, fontWeight: 800, fontSize: 20, color: C.ink, margin: "0 0 8px" }}>احجز فحصك مع د. باسم</h3>
        <p style={{ fontFamily: font.body, fontSize: 12.5, color: C.muted, marginBottom: 20 }}>{DOCTOR.address}</p>
        {sent ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, color: C.blue, fontFamily: font.body, fontWeight: 700 }}><Check size={18} /> تم استلام طلبك</div>
        ) : (
          <>
            <input placeholder="الاسم بالكامل" style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg, fontFamily: font.body, fontSize: 13, outline: "none", textAlign: "right", boxSizing: "border-box", marginBottom: 10 }} />
            <input placeholder="رقم الموبايل" style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg, fontFamily: font.body, fontSize: 13, outline: "none", textAlign: "right", boxSizing: "border-box", marginBottom: 16 }} />
            <button onClick={() => setSent(true)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: C.blue, color: "#fff", border: "none", borderRadius: 11, padding: "13px 0", fontFamily: font.body, fontWeight: 700, fontSize: 14, cursor: "pointer" }}><Send size={15} /> تأكيد الحجز</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================== التطبيق ============================== */

function DrBassemOphthalmology() {
  useFonts();
  return (
    <div dir="rtl" style={{ background: C.bg, minHeight: "100vh", fontFamily: font.body, color: C.ink }}>
      <style>{`
        * { box-sizing: border-box; } input::placeholder { color: #9DB0C0; }
        @media (max-width: 900px) {
          .hero-grid { grid-template-columns: 1fr !important; }
          .testimonials-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
      <Navbar /><Hero /><ChartSection /><TestimonialsSection /><ContactSection />
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<DrBassemOphthalmology />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
