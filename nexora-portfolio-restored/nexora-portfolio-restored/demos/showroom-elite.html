<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom Elite — نظام إدارة معارض السيارات</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0D0E12; --charcoal:#191B21; --red:#E01E37; --red-soft:#FCE7EA;
  --silver:#B8BEC9;
  --bg:#F5F6F8; --surface:#FFFFFF;
  --text:#14161C; --text-secondary:#3B4150; --muted:#868D9C; --faint:#CDD2DC;
  --border:#E7E9EE; --border-strong:#D5D8E1;
  --success:#16A34A; --success-soft:#E9F9EF;
  --warning:#D97706; --warning-soft:#FDF1DF;
  --danger:#E01E37; --danger-soft:#FCE7EA;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --shadow-sm:0 2px 10px rgba(13,14,18,0.08);
  --shadow-md:0 12px 30px rgba(13,14,18,0.12);
  --shadow-lg:0 26px 56px rgba(13,14,18,0.24);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:900;margin:0;color:var(--black);letter-spacing:-.01em;}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 258px;min-height:100vh;}
.sidebar{background:var(--black);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.brand-name{font-weight:900;font-size:17px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.55);}
.nav-sec{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:rgba(255,255,255,0.75);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--red);color:#fff;}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:#fff;color:var(--black);font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.foot-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:rgba(255,255,255,0.06);}
.foot-card img{width:36px;height:36px;border-radius:9px;object-fit:cover;}
.foot-card .name{font-size:12.5px;font-weight:800;} .foot-card .role{font-size:10.5px;color:rgba(255,255,255,0.5);}

.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(245,246,248,0.9);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:20px;} .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:7px;left:8px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;}

.content{padding:26px 28px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:26px;} .view-head .sub{color:var(--muted);font-size:12.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-title{font-weight:800;font-size:15.5px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid transparent;transition:all .15s var(--ease);}
.btn-primary{background:var(--black);color:#fff;}
.btn-primary:hover{background:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:#fff;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:#F0F1F4;}
.btn-sm{padding:6px 12px;font-size:11.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.available{background:var(--success-soft);color:var(--success);}
.badge.reserved{background:var(--warning-soft);color:var(--warning);}
.badge.sold{background:#EEF0F2;color:var(--muted);}
.badge.red{background:var(--red-soft);color:var(--red);}

.stat{padding:18px 20px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stat .icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat .label{font-size:11.5px;color:var(--muted);font-weight:700;}
.stat .value{font-size:24px;font-weight:900;}
.stat .trend{font-size:10.5px;font-weight:800;color:var(--success);margin-top:6px;display:inline-block;}

/* Car inventory */
.car-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.car-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff;transition:all .2s var(--ease);}
.car-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.car-img{height:150px;background:linear-gradient(135deg,var(--charcoal),#2C2F38);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;}
.car-price{position:absolute;bottom:10px;right:10px;background:var(--red);color:#fff;font-weight:800;font-size:12.5px;padding:5px 12px;border-radius:8px;}
.car-body{padding:15px;}
.car-title{font-weight:800;font-size:14px;} .car-meta{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--text-secondary);}

/* Financing calculator */
.calc-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.calc-slider{width:100%;margin:10px 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:right;font-size:10.5px;color:var(--faint);text-transform:uppercase;padding:0 12px 10px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:#F5F6F8;}
.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--black);color:#fff;padding:11px 17px;border-radius:12px;font-size:12.5px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1150px){ .shell{grid-template-columns:1fr 76px;} .brand-name,.brand-sub,.nav-item span:not(.ic),.nav-sec,.foot-card .name,.foot-card .role,.nav-badge{display:none;} .car-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} .car-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">Showroom Elite — معرض سيارات فاخر</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-red" onclick="switchView('v-testdrive')">+ حجز تجربة قيادة</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-inventory"></section>
      <section class="view" id="v-testdrive"></section>
      <section class="view" id="v-financing"></section>
      <section class="view" id="v-customers"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🏎️</div>
      <div><div class="brand-name">Showroom Elite</div><div class="brand-sub">معرض سيارات فاخر</div></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-inventory"><span class="ic">🚘</span><span>المعرض</span></div>
      <div class="nav-item" data-view="v-testdrive"><span class="ic">🗓️</span><span>تجارب القيادة</span><span class="nav-badge">3</span></div>
      <div class="nav-sec">المبيعات</div>
      <div class="nav-item" data-view="v-financing"><span class="ic">🧮</span><span>حاسبة التمويل</span></div>
      <div class="nav-item" data-view="v-customers"><span class="ic">👥</span><span>العملاء</span></div>
      <div class="nav-sec">الحساب</div>
      <div class="nav-item" data-view="v-settings"><span class="ic">⚙️</span><span>الإعدادات</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-card"><img src="https://i.pravatar.cc/72?img=33"><div><div class="name">أ. مينا صليب</div><div class="role">مدير المبيعات</div></div></div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط */
const cars = [
  {name:"مرسيدس E200 موديل 2026", price:"3,450,000", km:0, year:2026, status:"available", emoji:"🚗"},
  {name:"بي إم دبليو X5 موديل 2025", price:"5,200,000", km:12000, year:2025, status:"reserved", emoji:"🚙"},
  {name:"أودي A6 موديل 2026", price:"3,890,000", km:0, year:2026, status:"available", emoji:"🚘"},
  {name:"تويوتا كامري موديل 2025", price:"1,650,000", km:8500, year:2025, status:"available", emoji:"🚗"},
  {name:"لكزس ES موديل 2026", price:"4,100,000", km:0, year:2026, status:"sold", emoji:"🚙"},
  {name:"بورش ماكان موديل 2025", price:"6,750,000", km:5000, year:2025, status:"reserved", emoji:"🏎️"},
];
const testDrives = [
  {customer:"م. أحمد رفعت", car:"مرسيدس E200", date:"اليوم 4:00 م", status:"confirmed"},
  {customer:"د. منى عادل", car:"بورش ماكان", date:"غدًا 11:00 ص", status:"confirmed"},
  {customer:"أ. كريم فتحي", car:"أودي A6", date:"غدًا 2:00 م", status:"pending"},
];
const customers = [
  {name:"م. أحمد رفعت", inquiries:3, budget:"حتى 4 مليون", img:71},
  {name:"د. منى عادل", inquiries:1, budget:"حتى 7 مليون", img:72},
  {name:"أ. كريم فتحي", inquiries:2, budget:"حتى 4 مليون", img:73},
];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','Showroom Elite — معرض سيارات فاخر'],
    'v-inventory':['المعرض', cars.length+' سيارة معروضة'],
    'v-testdrive':['تجارب القيادة', testDrives.length+' حجز'],
    'v-financing':['حاسبة التمويل','احسبي القسط الشهري لأي سيارة'],
    'v-customers':['العملاء', customers.length+' عميل مهتم'],
    'v-settings':['الإعدادات','بيانات المعرض'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}
const statusMap = {available:'متاحة',reserved:'محجوزة',sold:'تم البيع',confirmed:'مؤكد',pending:'قيد التأكيد'};

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، أستاذ مينا 🏎️</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦</p></div>
      <button class="btn btn-outline" onclick="switchView('v-inventory')">عرض كل السيارات</button></div>
    <div class="grid g4" style="margin-bottom:18px">
      ${stat('سيارات معروضة',cars.length+' سيارة','🚘','var(--black)','+2 هذا الأسبوع')}
      ${stat('تجارب قيادة اليوم','2 تجربة','🗓️','var(--red)','+1 غدًا')}
      ${stat('مبيعات الشهر','١٤٬٦٠٠٬٠٠٠ ج.م','💰','var(--success)','+18%')}
      ${stat('عملاء مهتمين',customers.length+' عميل','👥','var(--warning)','بحاجة لمتابعة')}
    </div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="card-title" style="margin-bottom:16px">أحدث السيارات المعروضة</div>
        ${cars.map(c=>`
          <div class="flex justify-between items-center" style="padding:11px 0;border-bottom:1px dashed var(--border)">
            <div class="flex items-center gap3"><span style="font-size:22px">${c.emoji}</span><div><b style="font-size:13px">${c.name}</b><div class="muted" style="font-size:11px">${c.price} ج.م</div></div></div>
            <span class="badge ${c.status}">${statusMap[c.status]}</span>
          </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:14px">تجارب القيادة القادمة</div>
        ${testDrives.map(t=>`
          <div class="flex justify-between items-center" style="padding:9px 0;border-bottom:1px dashed var(--border)">
            <div><b style="font-size:12px">${t.customer}</b><div class="muted" style="font-size:10.5px">${t.car}</div></div>
            <span class="muted" style="font-size:10.5px">${t.date}</span>
          </div>`).join('')}
        <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;margin-top:12px" onclick="switchView('v-testdrive')">عرض الكل</button>
      </div>
    </div>
  `;
}

function renderInventory(){
  const el = document.getElementById('v-inventory');
  el.innerHTML = `
    <div class="view-head"><div><h1>المعرض</h1><p class="sub">${cars.length} سيارة معروضة</p></div>
      <button class="btn btn-red">+ إضافة سيارة</button></div>
    <div class="car-grid">
      ${cars.map(c=>`
        <div class="car-card">
          <div class="car-img">${c.emoji}<span class="car-price">${c.price} ج.م</span></div>
          <div class="car-body">
            <div class="car-title">${c.name}</div>
            <div class="car-meta"><span>📅 ${c.year}</span><span>🛣️ ${c.km.toLocaleString('ar-EG')} كم</span></div>
            <div style="margin-top:10px"><span class="badge ${c.status}">${statusMap[c.status]}</span></div>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function renderTestDrive(){
  const el = document.getElementById('v-testdrive');
  el.innerHTML = `
    <div class="view-head"><div><h1>تجارب القيادة</h1><p class="sub">${testDrives.length} حجز</p></div>
      <button class="btn btn-red">+ حجز جديد</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>العميل</th><th>السيارة</th><th>الموعد</th><th>الحالة</th></tr></thead>
      <tbody>${testDrives.map(t=>`
        <tr onclick="UI.toast('تفاصيل حجز ${t.customer}')">
          <td><b>${t.customer}</b></td><td>${t.car}</td><td>${t.date}</td>
          <td><span class="badge ${t.status}">${statusMap[t.status]}</span></td>
        </tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderFinancing(){
  const el = document.getElementById('v-financing');
  el.innerHTML = `
    <div class="view-head"><div><h1>حاسبة التمويل</h1><p class="sub">احسبي القسط الشهري التقريبي</p></div></div>
    <div class="card card-pad" style="max-width:500px">
      <div class="calc-row"><span class="muted">سعر السيارة</span><b id="carPriceLabel">3,450,000 ج.م</b></div>
      <input type="range" class="calc-slider" id="priceSlider" min="500000" max="7000000" step="50000" value="3450000">
      <div class="calc-row"><span class="muted">مدة التمويل</span><b id="yearsLabel">5 سنوات</b></div>
      <input type="range" class="calc-slider" id="yearsSlider" min="1" max="7" step="1" value="5">
      <div class="calc-row" style="border:none;padding-top:16px"><span style="font-weight:800">القسط الشهري التقريبي</span><span id="monthlyResult" style="font-weight:900;font-size:19px;color:var(--red)"></span></div>
    </div>
  `;
  const update = ()=>{
    const price = +document.getElementById('priceSlider').value;
    const years = +document.getElementById('yearsSlider').value;
    document.getElementById('carPriceLabel').textContent = price.toLocaleString('ar-EG')+' ج.م';
    document.getElementById('yearsLabel').textContent = years+' سنوات';
    const monthly = Math.round((price*1.12)/(years*12));
    document.getElementById('monthlyResult').textContent = monthly.toLocaleString('ar-EG')+' ج.م/شهر';
  };
  document.getElementById('priceSlider').addEventListener('input', update);
  document.getElementById('yearsSlider').addEventListener('input', update);
  update();
}

function renderCustomers(){
  const el = document.getElementById('v-customers');
  el.innerHTML = `
    <div class="view-head"><div><h1>العملاء</h1><p class="sub">${customers.length} عميل مهتم</p></div></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>العميل</th><th>عدد الاستفسارات</th><th>الميزانية</th></tr></thead>
      <tbody>${customers.map(c=>`
        <tr><td><div class="cell-name"><img src="https://i.pravatar.cc/64?img=${c.img}" width="32" height="32" style="border-radius:50%">${c.name}</div></td>
        <td>${c.inquiries} استفسار</td><td>${c.budget}</td></tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderSettings(){
  document.getElementById('v-settings').innerHTML = `
    <div class="view-head"><div><h1>الإعدادات</h1><p class="sub">بيانات المعرض</p></div></div>
    <div class="card card-pad" style="max-width:560px">
      <p class="muted" style="font-size:13px;margin-bottom:16px">إعدادات اسم المعرض، البنوك الشريكة للتمويل، وسياسة الضمان.</p>
      <button class="btn btn-primary" onclick="UI.toast('تم حفظ الإعدادات')">حفظ التغييرات</button>
    </div>
  `;
}

renderDashboard(); renderInventory(); renderTestDrive(); renderFinancing(); renderCustomers(); renderSettings();
</script>
</body>
</html>
