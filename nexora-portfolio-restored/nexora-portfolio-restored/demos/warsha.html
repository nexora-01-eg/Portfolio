<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warsha — نظام إدارة ورش السيارات</title>
<meta name="description" content="عرض تصميم فقط — لا يوجد باكيند حقيقي، بيانات وهمية بالكامل">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#1F2933; --steel-dark:#12181F; --steel-soft:#E7EBEF;
  --amber:#F59E0B; --amber-soft:#FEF3DC;
  --red:#DC2626; --red-soft:#FBE9E9;
  --bg:#F3F4F6; --surface:#FFFFFF;
  --text:#1F2933; --text-secondary:#3E4C59; --muted:#7B8794; --faint:#CBD2D9;
  --border:#E4E7EB; --border-strong:#CBD2D9;
  --success:#2E9E5B; --success-soft:#E7F6ED;
  --warning:#F59E0B; --warning-soft:#FEF3DC;
  --danger:#DC2626; --danger-soft:#FBE9E9;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:22px;
  --shadow-sm:0 2px 8px rgba(18,24,31,0.06);
  --shadow-md:0 10px 26px rgba(18,24,31,0.10);
  --shadow-lg:0 22px 50px rgba(18,24,31,0.20);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Almarai',sans-serif;font-weight:800;margin:0;color:var(--steel-dark);}
ul{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.shell{display:grid;grid-template-columns:1fr 258px;min-height:100vh;}
.sidebar{background:var(--steel);color:#fff;padding:24px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;}
.brand-mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#FBBF24);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.brand-name{font-family:'Almarai';font-weight:800;font-size:18px;}
.brand-sub{font-size:10.5px;color:rgba(255,255,255,0.5);}
.nav-sec{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.07em;margin:16px 6px 8px;font-weight:800;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;color:rgba(255,255,255,0.72);font-weight:700;font-size:13.5px;cursor:pointer;margin-bottom:3px;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--amber);color:#1F2933;}
.nav-item .ic{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-right:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.foot-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:10px;background:rgba(255,255,255,0.06);}
.foot-card img{width:36px;height:36px;border-radius:8px;object-fit:cover;}
.foot-card .name{font-size:12.5px;font-weight:800;} .foot-card .role{font-size:10.5px;color:rgba(255,255,255,0.5);}

.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;background:rgba(243,244,246,0.88);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--border);}
.topbar h2{font-size:19px;} .topbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:10px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-dot{position:absolute;top:6px;left:7px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid #fff;}

.content{padding:24px 26px;}
.view{display:none;} .view.active{display:block;animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.view-head h1{font-size:24px;} .view-head .sub{color:var(--muted);font-size:12px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px;}
.card-title{font-family:'Almarai';font-weight:800;font-size:14.5px;}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap2{gap:8px;} .gap3{gap:12px;} .muted{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-weight:800;font-size:12.5px;border:1px solid transparent;}
.btn-primary{background:var(--steel);color:#fff;}
.btn-primary:hover{background:var(--steel-dark);}
.btn-amber{background:var(--amber);color:#1F2933;}
.btn-outline{background:#fff;border-color:var(--border-strong);}
.btn-outline:hover{background:var(--steel-soft);}
.btn-sm{padding:6px 11px;font-size:11px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.received{background:var(--steel-soft);color:var(--steel);}
.badge.diagnosing{background:var(--warning-soft);color:var(--warning);}
.badge.repair{background:var(--danger-soft);color:var(--danger);}
.badge.ready{background:var(--success-soft);color:var(--success);}
.badge.delivered{background:#EEF2F5;color:var(--muted);}

.stat{padding:16px 18px;}
.stat .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.stat .icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.stat .label{font-size:11px;color:var(--muted);font-weight:700;}
.stat .value{font-family:'Almarai';font-size:22px;font-weight:800;}
.stat .trend{font-size:10px;font-weight:800;color:var(--success);margin-top:5px;display:inline-block;}

/* Job board (kanban for cars) */
.job-board{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.job-col-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-weight:800;font-size:12px;}
.job-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:grab;}
.job-card.urgent{border-right:4px solid var(--red);}
.job-card .plate{font-family:'Almarai';font-weight:800;font-size:13px;background:var(--steel-soft);display:inline-block;padding:3px 9px;border-radius:6px;margin-bottom:8px;letter-spacing:.03em;}
.job-card .car{font-size:12px;font-weight:700;} .job-card .issue{font-size:11px;color:var(--muted);margin-top:3px;}
.job-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.job-drop{min-height:60px;border-radius:12px;transition:background .15s;}
.job-drop.drag-over{background:var(--amber-soft);outline:2px dashed var(--amber);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:right;font-size:10px;color:var(--faint);text-transform:uppercase;padding:0 11px 9px;border-bottom:1px solid var(--border);font-weight:800;}
tbody td{padding:11px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--steel-soft);}
.cell-name{display:flex;align-items:center;gap:9px;font-weight:700;}

.plate-box{font-family:'Almarai';font-weight:800;background:var(--steel);color:#fff;padding:5px 12px;border-radius:6px;display:inline-block;letter-spacing:.04em;font-size:12px;}

.progress-track{height:7px;background:var(--steel-soft);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:var(--amber);}

.toast-stack{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--steel-dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:800;box-shadow:var(--shadow-lg);}

@media (max-width:1250px){ .job-board{grid-template-columns:repeat(5,220px);overflow-x:auto;} }
@media (max-width:1150px){ .shell{grid-template-columns:1fr 76px;} .brand-name,.brand-sub,.nav-item span:not(.ic),.nav-sec,.foot-card .name,.foot-card .role,.nav-badge{display:none;} }
@media (max-width:760px){ .g4,.g3,.g2{grid-template-columns:1fr;} .content{padding:14px;} }
</style>
</head>
<body>

<div class="shell">
  <div class="main">
    <header class="topbar">
      <div><h2 id="topTitle">لوحة التحكم</h2><div class="sub" id="topSub">ورشة المهندس — مدينة السادس من أكتوبر</div></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="UI.toast('لا توجد تنبيهات جديدة')">🔔<span class="icon-dot"></span></button>
        <button class="btn btn-amber" onclick="switchView('v-jobs')">+ استقبال سيارة</button>
      </div>
    </header>
    <main class="content">
      <section class="view active" id="v-dashboard"></section>
      <section class="view" id="v-jobs"></section>
      <section class="view" id="v-vehicles"></section>
      <section class="view" id="v-inventory"></section>
      <section class="view" id="v-technicians"></section>
      <section class="view" id="v-invoices"></section>
    </main>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🔧</div>
      <div><div class="brand-name">Warsha</div><div class="brand-sub">إدارة ورش السيارات</div></div>
    </div>
    <nav>
      <div class="nav-sec">التشغيل</div>
      <div class="nav-item active" data-view="v-dashboard"><span class="ic">📊</span><span>لوحة التحكم</span></div>
      <div class="nav-item" data-view="v-jobs"><span class="ic">🛠️</span><span>لوحة الإصلاحات</span><span class="nav-badge">9</span></div>
      <div class="nav-item" data-view="v-vehicles"><span class="ic">🚗</span><span>السيارات والعملاء</span></div>
      <div class="nav-sec">الإدارة</div>
      <div class="nav-item" data-view="v-inventory"><span class="ic">📦</span><span>قطع الغيار</span></div>
      <div class="nav-item" data-view="v-technicians"><span class="ic">👨‍🔧</span><span>الفنيين</span></div>
      <div class="nav-item" data-view="v-invoices"><span class="ic">🧾</span><span>الفواتير</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-card"><img src="https://i.pravatar.cc/72?img=53"><div><div class="name">م. طارق جاد</div><div class="role">مدير الورشة</div></div></div>
    </div>
  </aside>
</div>

<script>
/* بيانات وهمية بالكامل — عرض تصميم فقط */
const jobsData = {
  received: [
    {plate:"أ ب ج 123", car:"هيونداي إلنترا 2021", issue:"صوت غريب من الفرامل", urgent:true},
    {plate:"د هـ و 456", car:"تويوتا كورولا 2019", issue:"فحص دوري شامل", urgent:false},
  ],
  diagnosing: [
    {plate:"ز ح ط 789", car:"كيا سيراتو 2020", issue:"مشكلة في نظام التبريد", urgent:false},
    {plate:"ي ك ل 234", car:"نيسان صني 2018", issue:"إنذار المحرك مضاء", urgent:true},
  ],
  repair: [
    {plate:"م ن س 567", car:"شيفروليه أفيو 2022", issue:"تغيير طقم دبرياج", urgent:false},
    {plate:"ع ف ص 890", car:"سكودا أوكتافيا 2020", issue:"إصلاح كهرباء السيارة", urgent:true},
  ],
  ready: [
    {plate:"ق ر ش 345", car:"هوندا سيفيك 2021", issue:"تغيير زيت وفلاتر", urgent:false},
  ],
  delivered: [
    {plate:"ت ث خ 678", car:"مرسيدس C200 2019", issue:"صيانة دورية كاملة", urgent:false},
    {plate:"ذ ض ظ 901", car:"بي إم دبليو 320i 2020", issue:"إصلاح ماكينة", urgent:false},
  ],
};
const jobCols = [
  ['received','🔵 استلام جديد'], ['diagnosing','🟡 قيد الفحص'], ['repair','🔴 قيد الإصلاح'], ['ready','🟢 جاهزة للتسليم'], ['delivered','⚪ تم التسليم']
];
const vehicles = [
  {plate:"أ ب ج 123", owner:"محمد الجندي", car:"هيونداي إلنترا 2021", phone:"01011122233", visits:4, img:66},
  {plate:"د هـ و 456", owner:"سامية توفيق", car:"تويوتا كورولا 2019", phone:"01022233344", visits:7, img:69},
  {plate:"ز ح ط 789", owner:"كريم عادل", car:"كيا سيراتو 2020", phone:"01033344455", visits:2, img:71},
  {plate:"ي ك ل 234", owner:"داليا حسن", car:"نيسان صني 2018", phone:"01044455566", visits:5, img:73},
  {plate:"م ن س 567", owner:"أحمد فتحي", car:"شيفروليه أفيو 2022", phone:"01055566677", visits:1, img:75},
];
const parts = [
  {name:"طقم فرامل أمامي", stock:14, min:5, price:850},
  {name:"فلتر زيت", stock:32, min:10, price:120},
  {name:"طقم دبرياج كامل", stock:3, min:4, price:3400},
  {name:"بطارية 70 أمبير", stock:8, min:5, price:1650},
  {name:"زيت محرك 5W-30 (لتر)", stock:45, min:15, price:220},
  {name:"شمعات إشعال (طقم)", stock:2, min:6, price:380},
];
const technicians = [
  {name:"عم رجب حلمي", role:"فني ميكانيكا عامة", jobs:5, rating:4.9, img:64},
  {name:"إسلام بدوي", role:"فني كهرباء سيارات", jobs:3, rating:4.7, img:68},
  {name:"محمود جمعة", role:"فني بودي وسمكرة", jobs:2, rating:4.8, img:70},
];

const UI = { toast(msg){
  let stack=document.querySelector('.toast-stack');
  if(!stack){ stack=document.createElement('div'); stack.className='toast-stack'; document.body.appendChild(stack); }
  const t=document.createElement('div'); t.className='toast'; t.textContent='✓ '+msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2300);
}};

function switchView(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const t = {
    'v-dashboard':['لوحة التحكم','ورشة المهندس — مدينة السادس من أكتوبر'],
    'v-jobs':['لوحة الإصلاحات','تتبع حالة كل سيارة لحظة بلحظة'],
    'v-vehicles':['السيارات والعملاء', vehicles.length+' سيارة مسجلة'],
    'v-inventory':['قطع الغيار', parts.length+' صنف بالمخزون'],
    'v-technicians':['الفنيين','أداء فريق الورشة'],
    'v-invoices':['الفواتير','إنشاء ومتابعة فواتير العملاء'],
  }[id];
  document.getElementById('topTitle').textContent=t[0];
  document.getElementById('topSub').textContent=t[1];
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

function stat(label,value,icon,color,trend){
  return `<div class="card stat">
    <div class="top"><span class="label">${label}</span><span class="icon" style="background:${color}22;color:${color}">${icon}</span></div>
    <div class="value">${value}</div><div class="trend">${trend}</div>
  </div>`;
}

function renderDashboard(){
  const el = document.getElementById('v-dashboard');
  const totalJobs = Object.values(jobsData).reduce((s,a)=>s+a.length,0);
  el.innerHTML = `
    <div class="view-head"><div><h1>أهلاً، مهندس طارق 🔧</h1><p class="sub">السبت ١١ يوليو ٢٠٢٦</p></div>
      <button class="btn btn-primary" onclick="switchView('v-jobs')">فتح لوحة الإصلاحات</button></div>
    <div class="grid g4" style="margin-bottom:16px">
      ${stat('سيارات بالورشة', totalJobs+' سيارة','🚗','var(--steel)','+2 عن أمس')}
      ${stat('قيد الإصلاح الآن',jobsData.repair.length+' سيارة','🛠️','var(--red)','عاجل: '+jobsData.repair.filter(j=>j.urgent).length)}
      ${stat('إيراد الشهر','٢١٤٬٥٠٠ ج.م','💰','var(--success)','+7.4%')}
      ${stat('قطع منخفضة المخزون',parts.filter(p=>p.stock<p.min).length+' أصناف','📦','var(--amber)','بحاجة لإعادة طلب')}
    </div>
    <div class="grid g3">
      <div class="card card-pad" style="grid-column:span 2">
        <div class="card-title" style="margin-bottom:14px">آخر السيارات المستقبلة</div>
        ${jobsData.received.concat(jobsData.diagnosing).map(j=>`
          <div class="flex justify-between items-center" style="padding:10px 0;border-bottom:1px dashed var(--border)">
            <div class="flex items-center gap3"><span class="plate-box">${j.plate}</span><div><b style="font-size:12.5px">${j.car}</b><div class="muted" style="font-size:10.5px">${j.issue}</div></div></div>
            ${j.urgent?'<span class="badge repair">عاجل</span>':'<span class="badge received">عادي</span>'}
          </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:14px">حالة قطع الغيار</div>
        ${parts.filter(p=>p.stock<p.min).map(p=>`
          <div style="margin-bottom:12px">
            <div class="flex justify-between" style="margin-bottom:5px;font-size:11.5px"><span class="muted">${p.name}</span><b>${p.stock}/${p.min}</b></div>
            <div class="progress-track"><div class="progress-fill" style="width:${p.stock/p.min*100}%;background:var(--danger)"></div></div>
          </div>`).join('') || '<p class="muted" style="font-size:12.5px">كل القطع بمستوى آمن ✓</p>'}
      </div>
    </div>
  `;
}

function renderJobs(){
  const el = document.getElementById('v-jobs');
  el.innerHTML = `<div class="view-head"><div><h1>لوحة الإصلاحات</h1><p class="sub">اسحبي وأفلتي لتحديث حالة السيارة</p></div>
    <button class="btn btn-amber">+ استقبال سيارة</button></div>
    <div class="job-board">
      ${jobCols.map(([key,title])=>`
        <div>
          <div class="job-col-head">${title} <span class="muted" style="font-weight:600">(${jobsData[key].length})</span></div>
          <div class="job-drop" data-col="${key}">
            ${jobsData[key].map(j=>`
              <div class="job-card ${j.urgent?'urgent':''}" draggable="true">
                <span class="plate">${j.plate}</span>
                <div class="car">${j.car}</div>
                <div class="issue">${j.issue}</div>
                <div class="foot">${j.urgent?'<span class="badge repair">عاجل</span>':'<span class="badge received">عادي</span>'}</div>
              </div>`).join('')}
          </div>
        </div>`).join('')}
    </div>
  `;
  initJobDnD();
}
function initJobDnD(){
  let dragEl=null;
  document.querySelectorAll('.job-card').forEach(c=>{
    c.addEventListener('dragstart',()=>{dragEl=c; c.style.opacity='0.4';});
    c.addEventListener('dragend',()=>{c.style.opacity='1'; dragEl=null;});
  });
  document.querySelectorAll('.job-drop').forEach(z=>{
    z.addEventListener('dragover', e=>{e.preventDefault(); z.classList.add('drag-over');});
    z.addEventListener('dragleave', ()=>z.classList.remove('drag-over'));
    z.addEventListener('drop', e=>{
      e.preventDefault(); z.classList.remove('drag-over');
      if(dragEl){ z.appendChild(dragEl); UI.toast('تم تحديث حالة السيارة'); }
    });
  });
}

function renderVehicles(){
  const el = document.getElementById('v-vehicles');
  el.innerHTML = `
    <div class="view-head"><div><h1>السيارات والعملاء</h1><p class="sub">${vehicles.length} سيارة مسجلة</p></div>
      <button class="btn btn-primary">+ إضافة عميل</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>رقم اللوحة</th><th>السيارة</th><th>المالك</th><th>الهاتف</th><th>عدد الزيارات</th></tr></thead>
      <tbody>${vehicles.map(v=>`
        <tr onclick="UI.toast('ملف السيارة ${v.plate}')">
          <td><span class="plate-box">${v.plate}</span></td><td>${v.car}</td>
          <td><div class="cell-name"><img src="https://i.pravatar.cc/64?img=${v.img}" width="30" height="30" style="border-radius:50%">${v.owner}</div></td>
          <td>${v.phone}</td><td>${v.visits} زيارة</td>
        </tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderInventory(){
  const el = document.getElementById('v-inventory');
  el.innerHTML = `
    <div class="view-head"><div><h1>قطع الغيار</h1><p class="sub">${parts.length} صنف بالمخزون</p></div>
      <button class="btn btn-primary">+ إضافة قطعة</button></div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>القطعة</th><th>الكمية المتاحة</th><th>الحد الأدنى</th><th>السعر</th><th>الحالة</th></tr></thead>
      <tbody>${parts.map(p=>`
        <tr><td><b>${p.name}</b></td><td>${p.stock}</td><td>${p.min}</td><td>${p.price} ج.م</td>
        <td>${p.stock<p.min?'<span class="badge repair">إعادة طلب</span>':'<span class="badge ready">متوفر</span>'}</td></tr>`).join('')}</tbody>
    </table></div></div>
  `;
}

function renderTechnicians(){
  const el = document.getElementById('v-technicians');
  el.innerHTML = `
    <div class="view-head"><div><h1>الفنيين</h1><p class="sub">${technicians.length} فني بالورشة</p></div>
      <button class="btn btn-primary">+ إضافة فني</button></div>
    <div class="grid g3">
      ${technicians.map(t=>`
        <div class="card card-pad" style="text-align:center">
          <img src="https://i.pravatar.cc/128?img=${t.img}" width="60" height="60" style="border-radius:50%;margin:0 auto 10px">
          <b style="font-size:13.5px">${t.name}</b>
          <div class="muted" style="font-size:11px;margin-bottom:10px">${t.role}</div>
          <div class="flex justify-between" style="font-size:11.5px;margin-bottom:6px"><span class="muted">سيارات جارية</span><b>${t.jobs}</b></div>
          <div class="flex justify-between" style="font-size:11.5px;margin-bottom:10px"><span class="muted">التقييم</span><b>⭐ ${t.rating}</b></div>
          <div class="progress-track"><div class="progress-fill" style="width:${t.rating/5*100}%"></div></div>
        </div>`).join('')}
    </div>
  `;
}

function renderInvoices(){
  document.getElementById('v-invoices').innerHTML = `
    <div class="view-head"><div><h1>الفواتير</h1><p class="sub">إدارة فواتير العملاء</p></div>
      <button class="btn btn-primary">+ فاتورة جديدة</button></div>
    <div class="card card-pad">
      <p class="muted" style="font-size:13px">قسم الفواتير — أنشئي فاتورة بقطع الغيار والمصنعية وأرسليها للعميل مباشرة.</p>
      <button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="UI.toast('تم فتح نموذج فاتورة جديدة')">إنشاء فاتورة تجريبية</button>
    </div>
  `;
}

renderDashboard(); renderJobs(); renderVehicles(); renderInventory(); renderTechnicians(); renderInvoices();
</script>
</body>
</html>
