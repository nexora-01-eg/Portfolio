<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXORA CEO OS</title>
<style>
:root {
  --bg: #0B0B0D;
  --surface: #131417;
  --card-solid: #181A1E;
  --gold: #D4AF37;
  --gold-soft: rgba(212,175,55,0.12);
  --white: #F5F5F5;
  --text-secondary: #A9A9A9;
  --g1: rgba(245,245,245,0.55);
  --g2: rgba(245,245,245,0.35);
  --line: rgba(255,255,255,0.07);
  --card: rgba(255,255,255,0.025);
  --success: #34D399;
  --warning: #F59E0B;
  --danger: #EF4444;
  --info: #3B82F6;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background:
    radial-gradient(circle at 12% 0%, rgba(212,175,55,0.06), transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(212,175,55,0.045), transparent 45%),
    var(--bg);
  color: var(--white);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.18); border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }

.app { display: flex; height: 100vh; width: 100vw; }

/* SIDEBAR */
.sidebar {
  width: 224px; flex-shrink: 0;
  display: flex; flex-direction: column;
  padding: 24px 16px;
  border-right: 1px solid var(--line);
  background: rgba(255,255,255,0.015);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; margin-bottom: 32px; }
.brand img {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 1px rgba(212,175,55,0.35), 0 0 18px rgba(212,175,55,0.15);
}
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; line-height: 1.2; }
.brand-sub { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(212,175,55,0.6); }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: 12px;
  font-size: 13px; font-weight: 500;
  color: var(--g1); cursor: pointer;
  background: transparent; border: none; text-align: left;
  position: relative; transition: background .3s ease, color .3s ease;
  width: 100%; font-family: inherit;
}
.nav-item:hover { background: rgba(255,255,255,0.03); color: var(--white); }
.nav-item.active { background: var(--gold-soft); color: var(--white); }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px; border-radius: 4px;
  background: var(--gold); box-shadow: 0 0 8px var(--gold);
}
.nav-item svg { flex-shrink: 0; }
.nav-item.active svg { color: var(--gold); }

.score-card {
  margin-top: auto; padding: 16px; border-radius: 16px;
  border: 1px solid rgba(212,175,55,0.14);
  background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 40px rgba(212,175,55,0.05);
}
.score-label { display:flex; align-items:center; gap:8px; font-size: 11px; color: var(--g1); margin-bottom: 8px; }
.score-value { font-size: 26px; font-weight: 700; color: var(--gold); margin-bottom: 10px; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px; border-bottom: 1px solid var(--line);
  background: rgba(11,11,13,0.7); backdrop-filter: blur(16px);
  flex-shrink: 0;
}
.search {
  display: flex; align-items: center; gap: 10px;
  width: 380px; padding: 9px 14px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02);
}
.search input { background: transparent; border: none; outline: none; color: var(--white); font-size: 13px; width: 100%; font-family: inherit; }
.search input::placeholder { color: rgba(245,245,245,0.3); }
.top-right { display: flex; align-items: center; gap: 18px; }
.clock { text-align: right; line-height: 1.25; }
.clock .time { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock .date { font-size: 10px; color: var(--g2); }
.bell {
  position: relative; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02);
  cursor: pointer; transition: transform .2s ease;
}
.bell:hover { transform: scale(1.06); }
.bell::after {
  content: ""; position: absolute; top: 6px; right: 6px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 6px var(--gold);
}
.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px rgba(212,175,55,0.35); }

.content { flex: 1; overflow-y: auto; padding: 28px 32px 40px; }

.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(212,175,55,0.65); margin-bottom: 6px; }
.h1 { font-size: 24px; font-weight: 600; margin: 0; }
.head-actions { display: flex; gap: 10px; }
.btn-primary, .btn-ghost {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 12px; border: none;
  font-weight: 600; font-size: 13px; cursor: pointer;
  transition: transform .25s ease; font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold), #b8912c);
  color: #0B0B0D;
  box-shadow: 0 4px 20px rgba(212,175,55,0.25);
}
.btn-primary:hover { transform: scale(1.03); }
.btn-ghost {
  background: rgba(255,255,255,0.04); color: var(--white);
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-ghost:hover { background: rgba(255,255,255,0.07); }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-row.dense { grid-template-columns: repeat(6, 1fr); }
.card {
  border-radius: 18px; padding: 20px;
  border: 1px solid rgba(212,175,55,0.14);
  background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
  box-shadow: 0 8px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(212,175,55,0.06), 0 0 32px rgba(212,175,55,0.04);
}
.card.flat { box-shadow: 0 8px 32px rgba(0,0,0,0.45); }
.card.tight { padding: 14px 16px; }
.stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.stat-label { font-size: 10.5px; font-weight: 500; color: var(--g1); }
.stat-value { font-size: 20px; font-weight: 700; }
.stat-value.small { font-size: 18px; }

.progress-track { width: 100%; height: 6px; border-radius: 10px; background: rgba(255,255,255,0.06); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, rgba(212,175,55,0.6), var(--gold)); box-shadow: 0 0 12px rgba(212,175,55,0.35); width: 0%; transition: width 1.1s cubic-bezier(.16,1,.3,1); }
.progress-track.thick { height: 8px; }

.grid-main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.col { display: flex; flex-direction: column; gap: 20px; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 15px; font-weight: 600; margin: 2px 0 0; }
.section-eyebrow { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(212,175,55,0.65); }
.section-meta { font-size: 11px; color: var(--g2); }

.task-list, .list { display: flex; flex-direction: column; gap: 8px; }
.task {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 14px; cursor: pointer;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
  transition: background .3s ease;
}
.task:hover { background: rgba(255,255,255,0.035); }
.task.done { background: rgba(212,175,55,0.06); }
.check { width: 18px; height: 18px; flex-shrink: 0; }
.task-title { flex: 1; font-size: 13px; font-weight: 500; }
.task.done .task-title { color: var(--g2); text-decoration: line-through; }
.tag { font-size: 10px; padding: 4px 9px; border-radius: 20px; background: var(--gold-soft); color: var(--gold); white-space: nowrap; }
.task-time { font-size: 11px; color: var(--g2); font-variant-numeric: tabular-nums; }

.sched-row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
.sched-time { font-size: 11px; width: 40px; color: var(--g2); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; min-width: 8px; min-height: 8px; max-width: 8px; max-height: 8px; border-radius: 50%; flex: 0 0 8px; flex-shrink: 0; overflow: hidden; }
.dot.meeting { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.dot.content { background: #8b93a0; }
.dot.focus { background: #5b6270; }
.sched-title { font-size: 13px; flex: 1; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.row-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.02); font-size: 12.5px; }
.pill { font-size: 10px; padding: 2px 9px; border-radius: 20px; background: rgba(255,255,255,0.06); color: var(--g1); white-space: nowrap; }
.money { font-size: 12px; font-weight: 700; color: var(--gold); }

.sprint-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.sprint-meta { font-size: 11px; color: var(--g2); margin-bottom: 14px; }
.sprint-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }

.goal-row { display: flex; align-items: flex-start; gap: 12px; }
.goal-icon { width: 36px; height: 36px; border-radius: 12px; background: var(--gold-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.goal-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.goal-sub { font-size: 11px; color: var(--g2); }

.notif-item { display: flex; align-items: flex-start; gap: 10px; }
.notif-text { font-size: 12px; line-height: 1.4; }
.notif-time { font-size: 10px; color: var(--g2); margin-top: 2px; }

.qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qa-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 13px; border-radius: 12px; font-size: 11.5px; font-weight: 500;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  color: var(--white); cursor: pointer; transition: transform .25s ease; font-family: inherit;
}
.qa-btn:hover { transform: translateX(3px); }

.activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 6px var(--gold); }
.activity-text { font-size: 12px; }
.activity-time { font-size: 10px; color: var(--g2); }

.placeholder-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; gap: 10px; }
.placeholder-page .eyebrow { margin-bottom: 0; }
.placeholder-page h2 { font-size: 20px; margin: 0; }
.placeholder-page p { font-size: 13px; color: var(--g2); max-width: 360px; margin: 0; }

.fade-in { animation: fadeIn .45s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ===== CONTENT FACTORY ===== */
.pipeline-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.pipeline-chip {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 14px; border-radius: 14px; min-width: 84px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: background .25s ease, border-color .25s ease;
}
.pipeline-chip:hover { background: rgba(212,175,55,0.06); border-color: rgba(212,175,55,0.2); }
.pipeline-chip .n { font-size: 17px; font-weight: 700; color: var(--gold); }
.pipeline-chip .l { font-size: 9.5px; text-align: center; color: var(--g1); letter-spacing: 0.02em; }

.phase-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.phase-card {
  padding: 14px 12px; border-radius: 14px; text-align: center;
  border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.015);
  transition: all .3s ease; cursor: default;
}
.phase-card.active {
  border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.08);
  box-shadow: 0 0 24px rgba(212,175,55,0.08);
}
.phase-num { font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(212,175,55,0.6); margin-bottom: 4px; }
.phase-card.active .phase-num { color: var(--gold); }
.phase-name { font-size: 12.5px; font-weight: 600; }

.cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-month { font-size: 14px; font-weight: 600; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.02); color: var(--white); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cal-nav button:hover { background: rgba(255,255,255,0.06); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.cal-dow { font-size: 10px; text-align: center; color: var(--g2); padding-bottom: 4px; letter-spacing: 0.1em; text-transform: uppercase; }
.cal-day {
  aspect-ratio: 1 / 0.92; border-radius: 12px; padding: 8px;
  border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.015);
  cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  transition: all .25s ease; position: relative; overflow: hidden;
}
.cal-day:hover { border-color: rgba(212,175,55,0.3); background: rgba(212,175,55,0.05); transform: translateY(-1px); }
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.empty:hover { transform: none; }
.cal-day.today { border-color: rgba(212,175,55,0.5); box-shadow: 0 0 0 1px rgba(212,175,55,0.2); }
.cal-day-num { font-size: 11px; font-weight: 600; color: var(--g1); }
.cal-day.today .cal-day-num { color: var(--gold); }
.cal-day-type { font-size: 9.5px; font-weight: 600; line-height: 1.2; }
.cal-day-plat { font-size: 8.5px; color: var(--g2); }
.cal-status-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; }
.status-idea { background: #6b7280; }
.status-progress { background: #d4af37; box-shadow: 0 0 6px #d4af37; }
.status-review { background: #7ba7d9; }
.status-approved { background: #6fcf97; }
.status-scheduled { background: #b98af0; }
.status-published { background: #4ade80; }
.cal-day-empty-label { font-size: 9px; color: var(--g2); opacity: .5; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--g2); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  animation: fadeIn .25s ease both;
}
.modal {
  width: 640px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
  border-radius: 20px; padding: 26px 28px;
  border: 1px solid rgba(212,175,55,0.2);
  background: linear-gradient(160deg, #131316, #0d0d0f);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.08);
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.modal-close {
  width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03); color: var(--white); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.modal-close:hover { background: rgba(255,255,255,0.08); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,245,245,0.4); }
.field input, .field select, .field textarea {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 9px 11px; color: var(--white); font-size: 12.5px;
  font-family: inherit; outline: none; transition: border-color .2s ease;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(212,175,55,0.4); }
.field textarea { resize: vertical; min-height: 54px; }
.pipeline-stepper { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0 18px; }
.pipeline-step {
  font-size: 9.5px; padding: 5px 9px; border-radius: 20px; cursor: pointer;
  background: rgba(255,255,255,0.03); color: var(--g2); border: 1px solid rgba(255,255,255,0.05);
  transition: all .2s ease;
}
.pipeline-step.past { background: rgba(212,175,55,0.08); color: var(--g1); }
.pipeline-step.current { background: var(--gold); color: #0B0B0D; font-weight: 700; border-color: var(--gold); }
.modal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
.completion-mini { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--g2); }

.weekly-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.review-q { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--g1); }
.review-a { font-size: 12.5px; line-height: 1.5; color: var(--white); padding: 10px 12px; background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 12px; }

.block-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.block-row:last-child { border-bottom: none; }
.block-tag { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
.blk-deep { background: rgba(212,175,55,0.15); color: var(--gold); }
.blk-sales { background: rgba(122,167,217,0.15); color: #7ba7d9; }
.blk-exec { background: rgba(111,207,151,0.15); color: #6fcf97; }
.blk-learn { background: rgba(185,138,240,0.15); color: #b98af0; }
.blk-review { background: rgba(255,255,255,0.08); color: var(--g1); }
.blk-plan { background: rgba(245,245,245,0.08); color: var(--g1); }

/* ===== DASHBOARD v2 — additions (Project Prompt 02) ===== */
.quote-banner {
  margin-top: 6px; font-size: 12px; font-style: italic; color: var(--g2);
  display: flex; align-items: center; gap: 8px; max-width: 560px;
}
.quote-banner svg { flex-shrink: 0; opacity: 0.6; }

.dash-meta-row { display: flex; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
.dash-meta-pill {
  font-size: 10.5px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
  background: rgba(212,175,55,0.09); color: rgba(212,175,55,0.9); border: 1px solid rgba(212,175,55,0.18);
  white-space: nowrap;
}

.stat-row.overview { grid-template-columns: repeat(6, 1fr); }
.stat-card-mini { display: flex; flex-direction: column; gap: 6px; }
.stat-card-mini .stat-goal-text { font-size: 11px; color: var(--g1); line-height: 1.35; }

.focus-task {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  padding: 14px; border-radius: 14px; margin-bottom: 8px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
  transition: background .25s ease;
}
.focus-task:last-child { margin-bottom: 0; }
.focus-task:hover { background: rgba(255,255,255,0.035); }
.focus-task.done { background: rgba(212,175,55,0.06); opacity: 0.65; }
.focus-task.done .focus-title { text-decoration: line-through; color: var(--g2); }
.focus-num {
  width: 28px; height: 28px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(212,175,55,0.1); color: var(--gold); font-size: 12px; font-weight: 700;
}
.focus-body { min-width: 0; }
.focus-title { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.focus-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.focus-progress-row { display: flex; align-items: center; gap: 8px; }

/* ===== UI/UX POLISH PASS — Dashboard & Content OS ===== */

/* -- Hover elevation on interactive surfaces (subtle, consistent) -- */
.card, .kanban-card, .lib-row, .pipeline-chip, .swatch-card, .asset-tile, .cal-day:not(.empty) {
  transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, border-color .22s ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 38px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.1);
  border-color: rgba(212,175,55,0.22);
}
.kanban-card:hover, .lib-row:hover, .pipeline-chip:hover, .cal-day:not(.empty):hover {
  transform: translateY(-1px);
}

/* -- Press feedback (buttons feel physically pressed) -- */
.btn-primary:active, .btn-ghost:active, .qa-btn:active, .cos-tab:active,
.lib-icon-btn:active, .nav-item:active, .kanban-card:active { transform: scale(0.97); }
.btn-primary, .btn-ghost, .qa-btn, .lib-icon-btn { transition: transform .12s ease, background .2s ease, border-color .2s ease, color .2s ease; }

/* -- Standardized focus-visible rings for keyboard accessibility -- */
button:focus-visible, .nav-item:focus-visible, .cos-tab:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible,
.lib-icon-btn:focus-visible, .kanban-card:focus-visible, .cal-day:focus-visible {
  outline: 2px solid rgba(212,175,55,0.55);
  outline-offset: 2px;
  border-radius: 6px;
}
.field input:focus, .field select:focus, .field textarea:focus {
  box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
}

/* -- Stronger, unmistakable active tab state -- */
.cos-tab.active {
  background: rgba(212,175,55,0.1);
  border-radius: 10px 10px 0 0;
}

/* -- At Risk status (4th state alongside On Track / Late / Completed) -- */
.status-badge.atrisk { background: rgba(245,158,11,0.14); color: var(--warning); }
.cal-day.atrisk-day { border-color: rgba(245,158,11,0.35); }

/* -- Empty states: icon + message + optional single CTA -- */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 36px 20px; gap: 8px;
}
.empty-state .empty-icon {
  width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: rgba(212,175,55,0.08); color: var(--gold); margin-bottom: 4px;
}
.empty-state .empty-title { font-size: 13px; font-weight: 600; color: var(--white); }
.empty-state .empty-sub { font-size: 11.5px; color: var(--g2); max-width: 280px; line-height: 1.5; }
.empty-state .empty-cta { margin-top: 6px; }

/* -- Skeleton loading (premium boot experience, replaces blank white gaps) -- */
.skeleton {
  border-radius: 10px; background: rgba(255,255,255,0.045);
  background-image: linear-gradient(100deg, rgba(255,255,255,0.045) 30%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.045) 70%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s ease-in-out infinite;
}
@keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-row { height: 14px; margin-bottom: 10px; }
.skeleton-card { border-radius: 18px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.015); }

/* -- Dashboard hierarchy group labels (Right Now / This Sprint / Reflection) -- */
.dash-group-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: rgba(212,175,55,0.7); margin: 26px 0 12px;
}
.dash-group-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
.dash-group-label:first-child, .grid-main .dash-group-label:first-child { margin-top: 0; }

/* -- Short card description line (title + one-line context) -- */
.card-desc { font-size: 11px; color: var(--g2); margin: -8px 0 12px; line-height: 1.4; }

.kanban-empty {
  text-align: center; padding: 18px 8px; font-size: 10.5px; color: var(--g2);
  border: 1.5px dashed rgba(255,255,255,0.08); border-radius: 10px;
}

/* -- Reduced motion respect -- */
@media (prefers-reduced-motion: reduce) {
  .card, .kanban-card, .lib-row, .pipeline-chip, .cal-day, .skeleton { transition: none !important; animation: none !important; }

.report-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; transition: all .2s ease; }
.report-card:hover { border-color: rgba(212,175,55,0.25); }
.report-card .rc-title { font-size: 13px; font-weight: 600; }
.report-card .rc-sub { font-size: 10.5px; color: var(--g2); margin-top: 2px; }

.score-ring-lg .ring-val { font-size: 15px; }

.mini-graph { display: flex; align-items: flex-end; gap: 3px; height: 36px; }
.mini-graph .bar { flex: 1; background: linear-gradient(180deg, rgba(212,175,55,0.6), rgba(212,175,55,0.15)); border-radius: 3px 3px 0 0; min-height: 3px; }

@media (max-width: 1100px) { .kpi-table-row { grid-template-columns: 1.4fr 0.7fr 0.7fr 1fr; } .kpi-table-row span:nth-child(4), .kpi-table-row span:nth-child(5) { display: none; } }/* ===== ANALYTICS OS V2 — Executive Intelligence Center ===== */
.decision-card {
  display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 16px;
  border: 1px solid rgba(212,175,55,0.14); background: linear-gradient(145deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
  margin-bottom: 12px; position: relative; overflow: hidden;
}
.decision-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.decision-rank { font-size: 10px; font-weight: 700; color: rgba(212,175,55,0.6); letter-spacing: 0.1em; text-transform: uppercase; }
.decision-title { font-size: 14.5px; font-weight: 600; }
.decision-meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.decision-meta { display: flex; flex-direction: column; gap: 2px; }
.decision-meta .k { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--g2); }
.decision-meta .v { font-size: 12.5px; font-weight: 600; }
.decision-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }

.health-mini-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.health-mini-card { padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.015); }
.health-mini-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.health-mini-name { font-size: 12px; font-weight: 600; }
.health-mini-rec { font-size: 10.5px; color: var(--g2); margin-top: 8px; line-height: 1.4; }

.alert-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); }
.alert-item.critical { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
.alert-item.warning { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
.alert-item.achievement { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.05); }
.alert-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.alert-dot.critical { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.alert-dot.warning { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.alert-dot.achievement { background: var(--success); box-shadow: 0 0 8px var(--success); }
.alert-text { font-size: 12.5px; font-weight: 500; }
.alert-sub { font-size: 10.5px; color: var(--g2); margin-top: 2px; }

.reco-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; }
.reco-text { font-size: 12.5px; font-weight: 500; }
.reco-meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }

.timeline-wrap { position: relative; padding-left: 20px; }
.timeline-wrap::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1.5px; background: rgba(255,255,255,0.08); }
.timeline-item { position: relative; padding-bottom: 18px; }
.timeline-item::before { content: ""; position: absolute; left: -19px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.timeline-date { font-size: 9.5px; color: var(--g2); text-transform: uppercase; letter-spacing: 0.04em; }
.timeline-text { font-size: 12.5px; font-weight: 500; margin-top: 2px; }

.kpi-wall-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.kpi-wall-tile { padding: 12px 10px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
.kpi-wall-tile .kwt-val { font-size: 15px; font-weight: 700; color: var(--gold); }
.kpi-wall-tile .kwt-lbl { font-size: 8.5px; color: var(--g2); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 3px; line-height: 1.3; }
.kpi-wall-category { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(212,175,55,0.7); margin: 18px 0 8px; }
.kpi-wall-category:first-child { margin-top: 0; }

.score-card-v2 { padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.015); }
.score-card-v2-top { display: flex; align-items: center; justify-content: space-between; }
.score-card-v2 .sc-name { font-size: 11px; font-weight: 600; color: var(--g1); }
.score-card-v2 .sc-val { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
.score-card-v2 .sc-forecast { font-size: 10px; color: var(--g2); margin-top: 6px; }

@media (max-width: 1200px) { .health-mini-grid { grid-template-columns: repeat(2, 1fr); } .kpi-wall-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .health-mini-grid, .kpi-wall-grid { grid-template-columns: repeat(2, 1fr); } }/* ===== SETTINGS MODULE ===== */
.settings-layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
.settings-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.settings-nav-item {
  text-align: left; padding: 9px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 500;
  color: var(--g1); background: transparent; border: none; cursor: pointer; font-family: inherit;
  transition: background .2s ease, color .2s ease;
}
.settings-nav-item:hover { background: rgba(255,255,255,0.03); color: var(--white); }
.settings-nav-item.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.toggle-row:last-child { border-bottom: none; }
.toggle-row-copy .t { font-size: 13px; font-weight: 500; }
.toggle-row-copy .s { font-size: 10.5px; color: var(--g2); margin-top: 2px; }
.toggle-switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; cursor: pointer; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 20px; transition: background .25s ease; }
.toggle-slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--white); border-radius: 50%; transition: transform .25s cubic-bezier(.16,1,.3,1); }
.toggle-switch input:checked + .toggle-slider { background: var(--gold); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); background: #0B0B0D; }
.toggle-switch input:disabled + .toggle-slider { opacity: 0.4; cursor: not-allowed; }

.workspace-preview {
  border-radius: 18px; padding: 22px; border: 1px solid rgba(212,175,55,0.18);
  background: linear-gradient(160deg, rgba(212,175,55,0.06), rgba(255,255,255,0.02));
  display: flex; align-items: center; gap: 16px;
}
.workspace-preview img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; box-shadow: 0 0 0 1px rgba(212,175,55,0.3); }
.workspace-preview .wp-name { font-size: 16px; font-weight: 700; }
.workspace-preview .wp-sub { font-size: 11px; color: var(--g2); margin-top: 2px; }

.swatch-picker { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
.swatch-picker input[type=color] { width: 34px; height: 34px; border-radius: 9px; border: none; background: none; cursor: pointer; padding: 0; }
.swatch-picker .sp-label { font-size: 11.5px; font-weight: 500; flex: 1; }
.swatch-picker .sp-hex { font-size: 10.5px; color: var(--g2); font-family: monospace; }

.team-table-row { display: grid; grid-template-columns: 34px 1.4fr 1fr 1.2fr 0.8fr 0.9fr 70px; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
.team-table-row.head { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--g2); font-weight: 700; }
.team-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.role-chip-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.role-chip { padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); font-size: 11.5px; text-align: center; font-weight: 600; }

.integration-card { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; border-radius: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 8px; }
.integration-card .ic-name { font-size: 12.5px; font-weight: 600; }
.integration-card .ic-status { font-size: 10px; color: var(--g2); margin-top: 2px; }

.storage-bar-wrap { padding: 4px 0; }
.appearance-swatch-row { display: flex; gap: 10px; }
.appearance-mode-btn { flex: 1; padding: 14px; border-radius: 12px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); color: var(--g1); transition: all .2s ease; }
.appearance-mode-btn.active { border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); color: var(--gold); }

.danger-zone { border: 1px solid rgba(239,68,68,0.25) !important; background: rgba(239,68,68,0.04) !important; }
.btn-danger { background: rgba(239,68,68,0.12); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); padding: 10px 16px; border-radius: 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-danger:hover { background: rgba(239,68,68,0.2); }

.cmdk-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; z-index: 200; animation: fadeIn .2s ease both; }
.cmdk-box { width: 560px; max-width: 90vw; border-radius: 18px; border: 1px solid rgba(212,175,55,0.2); background: linear-gradient(160deg,#17181b,#101113); box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; }
.cmdk-input-row { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.cmdk-input-row input { flex: 1; background: transparent; border: none; outline: none; color: var(--white); font-size: 14px; font-family: inherit; }
.cmdk-list { max-height: 340px; overflow-y: auto; padding: 8px; }
.cmdk-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 12.5px; }
.cmdk-item:hover, .cmdk-item.sel { background: rgba(212,175,55,0.1); color: var(--gold); }/* ===== MARKETING OS ===== */
.mkt-campaign-row { display: grid; grid-template-columns: 1.6fr 0.8fr 0.9fr 0.8fr 0.8fr 0.8fr 0.8fr 0.7fr 0.9fr 90px; gap: 8px; align-items: center; padding: 11px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 11.5px; }
.mkt-campaign-row.head { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--g2); font-weight: 700; }
.mkt-campaign-row .cname { font-weight: 600; }
.mkt-status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.mkt-status-dot.Active { background: var(--success); box-shadow: 0 0 6px var(--success); }
.mkt-status-dot.Paused { background: var(--warning); }
.mkt-status-dot.Completed { background: var(--gold); }
.mkt-status-dot.Draft { background: var(--g2); }

.platform-card { padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.015); }
.platform-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.platform-card .pc-name { font-size: 12.5px; font-weight: 700; }
.platform-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.funnel-wrap { display: flex; flex-direction: column; gap: 6px; max-width: 560px; margin: 0 auto; }
.funnel-step { position: relative; height: 46px; display: flex; align-items: center; justify-content: center; color: #0B0B0D; font-weight: 700; font-size: 12px; border-radius: 8px; background: linear-gradient(90deg, var(--gold), #b8912c); }
.funnel-step .fs-label { position: absolute; left: 12px; font-size: 10.5px; font-weight: 700; }
.funnel-step .fs-val { }
.funnel-drop { text-align: center; font-size: 9.5px; color: var(--g2); margin: 1px 0; }

.heatmap-grid { display: grid; grid-template-columns: 60px repeat(6, 1fr); gap: 3px; }
.heatmap-cell { aspect-ratio: 1.6; border-radius: 4px; }
.heatmap-label { font-size: 9px; color: var(--g2); display: flex; align-items: center; }

.mkt-audience-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mkt-audience-bar .lbl { width: 90px; font-size: 11px; color: var(--g1); flex-shrink: 0; }

.pill-toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.pill-toggle { padding: 7px 14px; border-radius: 20px; font-size: 11.5px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); color: var(--g1); }
.pill-toggle.active { background: rgba(212,175,55,0.12); border-color: rgba(212,175,55,0.35); color: var(--gold); }

@media (max-width: 1200px) { .platform-grid { grid-template-columns: repeat(2,1fr); } .mkt-campaign-row { grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr 1fr; } .mkt-campaign-row span:nth-child(n+6) { display: none; } }
</style>

function weekStartISO() {
  const d = new Date();
  const day = (d.getDay() + 6) % 7; // Monday=0
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}
function weekEndISO() {
  const d = new Date();
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() + (6 - day));
  return d.toISOString().slice(0, 10);
}

function toggleFocusTimer() {
  const btn = document.getElementById("focusTimerBtn");
  if (focusTimerInterval) {
    clearInterval(focusTimerInterval);
    const elapsedMin = Math.round((Date.now() - focusTimerStart) / 60000);
    state.focusMinutesToday = (state.focusMinutesToday || 0) + Math.max(elapsedMin, 1);
    focusTimerInterval = null;
    focusTimerStart = null;
    saveState();
    render();
    showToast(`Focus session logged: +${Math.max(elapsedMin,1)}m`);
    return;
  }
  focusTimerStart = Date.now();
  showToast("Focus timer started");
  if (btn) {
    focusTimerInterval = setInterval(() => {
      const mins = Math.floor((Date.now() - focusTimerStart) / 60000);
      const secs = Math.floor(((Date.now() - focusTimerStart) % 60000) / 1000);
      const b = document.getElementById("focusTimerBtn");
      if (b) b.firstChild.textContent = `Stop Focus (${mins}:${String(secs).padStart(2,"0")}) `;
    }, 1000);
  }
}

/* ---------- SHARED HELPERS ---------- */
function contentStats() {
  const c = state.content;
  const byStage = s => c.filter(x => x.stage === s).length;
  const planned = c.length;
  const readyStages = ["Approved", "Scheduled"];
  const ready = c.filter(x => readyStages.includes(x.stage)).length;
  const finished = c.filter(x => ["Approved","Scheduled","Published","Archive"].includes(x.stage)).length;
  const published = byStage("Published") + byStage("Archive");
  const ideasWaiting = byStage("Idea");
  const designQueue = byStage("Design Notes");
  const reviewQueue = byStage("Review");
  const approvalQueue = byStage("Approved");
  const completionPct = Math.round((finished / planned) * 100) || 0;
  return { planned, finished, ready, published, ideasWaiting, designQueue, reviewQueue, approvalQueue, completionPct };
}

function stageStatusClass(stage) {
  if (stage === "Idea" || stage === "Research") return "status-idea";
  if (["Hook","Writing","Caption","CTA","First Comment","Hashtags","Design Notes"].includes(stage)) return "status-progress";
  if (stage === "Review") return "status-review";
  if (stage === "Approved") return "status-approved";
  if (stage === "Scheduled") return "status-scheduled";
  if (stage === "Published" || stage === "Archive") return "status-published";
  return "status-idea";
}

function todayContentItem() {
  const todayStr = new Date().toISOString().slice(0,10);
  return state.content.find(x => x.publishDay === todayStr) || null;
}

/* status derived from deadline + stage — never stored, always fresh */
function computeContentStatus(item) {
  if (["Published", "Archive"].includes(item.stage)) return { label: "Completed", cls: "done" };
  const dl = item.deadline || item.publishDay;
  const todayStr = new Date().toISOString().slice(0,10);
  const tomorrowStr = new Date(Date.now() + 86400000).toISOString().slice(0,10);
  if (dl && dl < todayStr) return { label: "Late", cls: "late" };
  if (dl && (dl === todayStr || dl === tomorrowStr)) return { label: "At Risk", cls: "atrisk" };
  return { label: "On Track", cls: "ontrack" };
}

function ringSVG(pct, opts = {}) {
  const size = opts.size || 44;
  const stroke = opts.stroke || 5;
  const color = opts.color || GOLD;
  const r = (size / 2) - stroke;
  const c = 2 * Math.PI * r;
  const off = c - (Math.max(0, Math.min(100, pct)) / 100) * c;
  return `
  <div class="ring-wrap ${opts.sm ? "sm" : ""}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition: stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)"/>
    </svg>
    ${opts.hideVal ? "" : `<span class="ring-val">${Math.round(pct)}%</span>`}
  </div>`;
}

function getCurrentWeekRange() {
  const now = new Date();
  const day = now.getDay();
  const start = new Date(now); start.setDate(now.getDate() - day);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

/* ---------- FILTERS ---------- */
function matchesContentFilters(item) {
  const f = state.contentFilters;
  if (f.status !== "All" && computeContentStatus(item).label !== f.status) return false;
  if (f.category !== "All" && item.category !== f.category) return false;
  if (f.platform !== "All" && item.platform !== f.platform) return false;
  if (f.priority !== "All" && item.priority !== f.priority) return false;
  if (f.phase !== "All" && groupOfStage(item.stage).label !== f.phase) return false;
  if (f.month === "ThisMonth") {
    const now = new Date();
    const d = new Date(item.publishDay);
    if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return false;
  }
  if (f.week === "ThisWeek") {
    const { start, end } = getCurrentWeekRange();
    if (item.publishDay < start || item.publishDay > end) return false;
  }
  return true;
}

function renderCalendar() {
  const gridEl = document.getElementById("calGrid");
  if (!gridEl) return;
  const base = new Date();
  base.setMonth(base.getMonth() + state.calMonthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const monthLabel = base.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const labelEl = document.getElementById("calMonthLabel");
  if (labelEl) labelEl.textContent = monthLabel;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const { start: weekStart, end: weekEnd } = getCurrentWeekRange();

  const byDay = {};
  state.content.forEach(item => {
    if (!matchesContentFilters(item)) return;
    const d = item.publishDay;
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(item);
  });

  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let html = `<div class="cal-grid">`;
  dow.forEach(d => html += `<div class="cal-dow">${d}</div>`);
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = new Date(year, month, day).toISOString().slice(0,10);
    const items = byDay[dateStr] || [];
    const first = items[0];
    const isToday = dateStr === todayStr;
    const inWeek = dateStr >= weekStart && dateStr <= weekEnd;
    const isLate = first && computeContentStatus(first).label === "Late";
    const isAtRisk = first && computeContentStatus(first).label === "At Risk";
    if (first) {
      html += `
        <div class="cal-day ${isToday ? "today" : ""} ${inWeek ? "in-week" : ""} ${isLate ? "late-day" : ""} ${isAtRisk ? "atrisk-day" : ""}" onclick="openContentModal('${first.id}')">
          <span class="cal-status-dot ${stageStatusClass(first.stage)}"></span>
          <span class="cal-day-num">${day}</span>
          <div>
            <div class="cal-day-type">${first.type}${items.length > 1 ? ` +${items.length-1}` : ""}</div>
            <div class="cal-day-plat">${first.platform}</div>
          </div>
        </div>`;
    } else {
      html += `
        <div class="cal-day ${isToday ? "today" : ""} ${inWeek ? "in-week" : ""} empty" onclick="openContentModal(null, '${dateStr}')" style="cursor:pointer">
          <span class="cal-day-num">${day}</span>
          <div class="cal-day-empty-label">+ add</div>
        </div>`;
    }
  }
  html += `</div>`;
  gridEl.innerHTML = html;
}

function shiftMonth(delta) {
  if (delta === 0) state.calMonthOffset = 0;
  else state.calMonthOffset += delta;
  saveState();
  renderCalendar();
}

function renderLibraryList(kind) {
  const q = (document.getElementById(`libSearch_${kind}`)?.value || "").toLowerCase();
  let items = (state[kind] || []).filter(it => !q || JSON.stringify(it).toLowerCase().includes(q));
  const sortMode = document.getElementById(`libSort_${kind}`)?.value || "az";
  const cfg = LIBRARY_CONFIG[kind];
  items = [...items].sort((a, b) => {
    const av = (a[cfg.titleField] || "").toLowerCase();
    const bv = (b[cfg.titleField] || "").toLowerCase();
    return sortMode === "za" ? bv.localeCompare(av) : av.localeCompare(bv);
  });
  document.getElementById(`libList_${kind}`).innerHTML = renderLibraryListHtml(kind, items);
  renderBulkBar(kind);
}

function renderBulkBar(kind) {
  const bar = document.getElementById(`libBulkBar_${kind}`);
  if (!bar) return;
  const sel = getBulkSet(kind);
  if (!sel.size) { bar.innerHTML = ""; return; }
  bar.innerHTML = `
    <div class="bulk-bar">
      <span>${sel.size} selected</span>
      <span class="spacer"></span>
      <button class="btn-ghost" onclick="clearBulkSelection('${kind}')">Clear</button>
      <button class="btn-ghost" style="color:var(--danger)" onclick="bulkDelete('${kind}')">Delete Selected</button>
    </div>`;
}

function toggleBulkItem(kind, id, checked) {
  const sel = getBulkSet(kind);
  if (checked) sel.add(id); else sel.delete(id);
  renderBulkBar(kind);
}
function clearBulkSelection(kind) {
  getBulkSet(kind).clear();
  renderLibraryList(kind);
}
function bulkDelete(kind) {
  const sel = getBulkSet(kind);
  state[kind] = state[kind].filter(x => !sel.has(x.id));
  sel.clear();
  saveState();
  renderLibraryList(kind);
  showToast("Deleted selected items");
}

function renderLibraryListHtml(kind, items) {
  const cfg = LIBRARY_CONFIG[kind];
  if (!items.length) return emptyState(
    `No ${cfg.label.toLowerCase()} yet`,
    `Start building your library — the first one takes 30 seconds.`,
    `Add ${cfg.label.replace(" Library","").replace("Content ","")}`,
    `openLibraryModal('${kind}', null)`
  );

  const groupField = document.getElementById(`libGroup_${kind}`)?.value || "";
  const sel = getBulkSet(kind);

  const rowHtml = (it) => {
    const title = it[cfg.titleField] || "Untitled";
    const meta = cfg.fields.filter(f => f.key !== cfg.titleField && f.type === "select").map(f => it[f.key]).filter(Boolean);
    return `
      <div class="lib-row">
        <input type="checkbox" class="lib-row-check" ${sel.has(it.id) ? "checked" : ""} onchange="toggleBulkItem('${kind}','${it.id}', this.checked)"/>
        <div class="lib-row-body">
          <div class="lib-row-title">${title}</div>
          <div class="lib-row-meta">${meta.map(m => `<span class="pill">${m}</span>`).join("")}</div>
        </div>
        <div class="lib-row-actions">
          ${cfg.hasFavorite ? `<button class="lib-icon-btn fav ${it.favorite ? "active" : ""}" title="Favorite" onclick="toggleFavorite('${kind}','${it.id}')">★</button>` : ""}
          <button class="lib-icon-btn" title="Copy" onclick="copyLibraryItem('${kind}','${it.id}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="lib-icon-btn" title="Edit" onclick="openLibraryModal('${kind}','${it.id}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          </button>
          <button class="lib-icon-btn" title="Delete" onclick="deleteLibraryItem('${kind}','${it.id}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
    `;
  };

  if (!groupField) return items.map(rowHtml).join("");

  const groups = {};
  items.forEach(it => {
    const g = it[groupField] || "Ungrouped";
    if (!groups[g]) groups[g] = [];
    groups[g].push(it);
  });
  return Object.entries(groups).map(([g, arr]) => `
    <div class="group-heading">${g} · ${arr.length}</div>
    ${arr.map(rowHtml).join("")}
  `).join("");
}

function toggleFavorite(kind, id) {
  const it = state[kind].find(x => x.id === id);
  if (it) it.favorite = !it.favorite;
  saveState();
  renderLibraryList(kind);
}

function copyLibraryItem(kind, id) {
  const cfg = LIBRARY_CONFIG[kind];
  const it = state[kind].find(x => x.id === id);
  const text = it ? (it[cfg.titleField] || "") : "";
  copyToClipboard(text);
}

function copyToClipboard(text) {
  const done = () => showToast("Copied to clipboard");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
}

function showToast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function openLibraryModal(kind, id) {
  const cfg = LIBRARY_CONFIG[kind];
  const item = id ? state[kind].find(x => x.id === id) : Object.fromEntries(cfg.fields.map(f => [f.key, f.type === "number" ? 0 : ""]));
  const fieldsHtml = cfg.fields.map(f => {
    const val = item[f.key] ?? "";
    let control;
    if (f.type === "select") control = `<select id="lf_${f.key}">${optionList(f.options, val)}</select>`;
    else if (f.type === "textarea") control = `<textarea id="lf_${f.key}">${val}</textarea>`;
    else control = `<input id="lf_${f.key}" type="${f.type}" value="${escAttr(String(val))}"/>`;
    return `<div class="field ${f.full ? "full" : ""}"><label>${f.label}</label>${control}</div>`;
  }).join("");

  const html = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="width:520px">
      <div class="modal-head">
        <div>
          <div class="eyebrow" style="margin-bottom:4px">${id ? "Edit" : "New"}</div>
          <div class="h1" style="font-size:18px">${cfg.label}</div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="field-grid">${fieldsHtml}</div>
      <div class="modal-foot" style="justify-content:flex-end">
        <div style="display:flex;gap:8px">
          ${id ? `<button class="btn-ghost" onclick="deleteLibraryItem('${kind}','${id}')">Delete</button>` : ""}
          <button class="btn-primary" onclick="saveLibraryModal('${kind}', ${id ? `'${id}'` : "null"})">Save</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById("modalRoot").innerHTML = html;
}

function saveLibraryModal(kind, id) {
  const cfg = LIBRARY_CONFIG[kind];
  const payload = { id: id || lid() };
  cfg.fields.forEach(f => {
    const el = document.getElementById(`lf_${f.key}`);
    payload[f.key] = f.type === "number" ? Number(el.value) || 0 : el.value;
  });
  const existing = id && state[kind].find(x => x.id === id);
  if (existing) Object.assign(existing, payload);
  else state[kind].push(payload);
  saveState();
  closeModal();
  render();
  showToast(id ? "Saved" : "Added");
}

function deleteLibraryItem(kind, id) {
  state[kind] = state[kind].filter(x => x.id !== id);
  saveState();
  closeModal();
  render();
  showToast("Deleted");
}

function handleAssetUpload(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const type = document.getElementById("assetTypeSelect")?.value || "Graphics";

  reader.onload = () => {
    state.brandAssets.push({ id: lid(), name: file.name, dataUrl: reader.result, type });
    saveState();
    document.getElementById("assetGrid").innerHTML = renderAssetGrid();
    showToast("Asset saved locally");
  };
  reader.readAsDataURL(file);
  ev.target.value = "";
}

function deleteAsset(id) {
  state.brandAssets = state.brandAssets.filter(a => a.id !== id);
  saveState();
  document.getElementById("assetGrid").innerHTML = renderAssetGrid();
}

/* ---------- CONTENT ANALYTICS TAB ---------- */
function renderCosAnalytics() {
  const c = state.content;
  const s = contentStats();
  const byKey = (key) => {
    const map = {};
    c.forEach(it => { map[it[key]] = (map[it[key]] || 0) + 1; });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  };
  const categories = byKey("category");
  const platforms = byKey("platform");
  const max = arr => Math.max(1, ...arr.map(x => x[1]));
  const catMax = max(categories), platMax = max(platforms);

  const publishedDays = new Set(c.filter(x => ["Published","Archive"].includes(x.stage)).map(x => x.publishDay));
  const consistency = Math.round((publishedDays.size / 30) * 100);

  const doneItems = c.filter(x => ["Published","Archive"].includes(x.stage) && x.actualTime);
  const avgCompletion = doneItems.length
    ? Math.round(doneItems.reduce((sum, x) => sum + (Number(x.actualTime) || 0), 0) / doneItems.length)
    : 0;

  return `
    <div class="stat-row dense">
      ${miniStat("Posts Created", c.length)}
      ${miniStat("Posts Completed", s.finished)}
      ${miniStat("Avg. Completion Time", avgCompletion + "m")}
      ${miniStat("Publishing Consistency", consistency + "%")}
      ${miniStat("Sprint Completion", s.completionPct + "%")}
      ${miniStat("Monthly Completion", state.monthProgress + "%")}
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Distribution</div><div class="section-title">Content Categories</div></div></div>
        ${categories.map(([name, n]) => `
          <div class="bar-row"><span class="lbl">${name}</span><div class="track"><div class="fill" style="width:${(n/catMax)*100}%"></div></div><span class="val">${n}</span></div>
        `).join("")}
      </div>
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Distribution</div><div class="section-title">Platform Distribution</div></div></div>
        ${platforms.map(([name, n]) => `
          <div class="bar-row"><span class="lbl">${name}</span><div class="track"><div class="fill" style="width:${(n/platMax)*100}%"></div></div><span class="val">${n}</span></div>
        `).join("")}
      </div>
    </div>
  `;
}

function renderGlobalSearch(q) {
  const box = document.getElementById("globalSearchResults");
  if (!q || q.trim().length < 2) { box.innerHTML = ""; return; }
  const query = q.toLowerCase();
  const results = [];

  const searchable = [
    { kind: "content", label: "Calendar Post", items: state.content, field: "title" },
    { kind: "ideas", label: "Idea", items: state.ideas, field: "title" },
    { kind: "hooks", label: "Hook", items: state.hooks, field: "text" },

    { kind: "comments", label: "Comment", items: state.comments, field: "text" },
    { kind: "hashtagSets", label: "Hashtag Set", items: state.hashtagSets, field: "name" },
    { kind: "templates", label: "Template", items: state.templates, field: "name" },
  ];

  searchable.forEach(group => {
    (group.items || []).forEach(it => {
      if (JSON.stringify(it).toLowerCase().includes(query)) {

    `).join("")}

}

}

});

function escAttr(s) { return (s||"").replace(/"/g, "&quot;"); }

/* Shared empty-state component — icon + message + optional single CTA. Used across Dashboard & Content OS. */
function emptyState(title, sub, ctaLabel, ctaOnclick) {
  return `
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>
      </div>
      <div class="empty-title">${title}</div>
      ${sub ? `<div class="empty-sub">${sub}</div>` : ""}
      ${ctaLabel ? `<button class="btn-primary empty-cta" onclick="${ctaOnclick}">${ctaLabel}</button>` : ""}
    </div>
  `;
}

function setModalStage(stage) {
  document.getElementById("f_stage").value = stage;
  const stageIdx = PIPELINE_STAGES.indexOf(stage);
  document.querySelectorAll("#stepperRow .pipeline-step").forEach((el, i) => {
    el.classList.toggle("past", i < stageIdx);
    el.classList.toggle("current", i === stageIdx);
  });
}

function closeModal() { document.getElementById("modalRoot").innerHTML = ""; editingId = null; }

function saveContentModal(id) {
  const get = (k) => document.getElementById(k).value;
  const payload = {
    id, title: get("f_title") || "Untitled Post",
    category: get("f_category"), type: get("f_type"), platform: get("f_platform"),
    priority: get("f_priority"), owner: get("f_owner") || "You", deadline: get("f_deadline"),
    audience: get("f_audience"), goal: get("f_goal"),
    hook: get("f_hook"), body: get("f_body"), caption: get("f_caption"),
    cta: get("f_cta"), firstComment: get("f_firstComment"), hashtags: get("f_hashtags"),
    designNotes: get("f_designNotes"), visualStyle: get("f_visualStyle"), template: get("f_template"),
    publishDay: get("f_publishDay"),
    estWritingTime: Number(get("f_estWritingTime"))||0, estDesignTime: Number(get("f_estDesignTime"))||0,
    actualTime: Number(get("f_actualTime"))||0,
    stage: get("f_stage"), notes: get("f_notes"),
  };
  const existing = state.content.find(x => x.id === id);
  if (existing) Object.assign(existing, payload);
  else state.content.push(payload);
  saveState();
  closeModal();
  render();
  showToast("Content saved");
}

function duplicateContent(id) {
  const item = state.content.find(x => x.id === id);
  if (!item) return;
  const copy = { ...item, id: uid(), title: item.title + " (copy)", stage: "Idea" };
  state.content.push(copy);
  saveState();
  closeModal();
  render();
  showToast("Duplicated");
}

function markComplete(id) {
  const item = state.content.find(x => x.id === id);
  if (item) item.stage = "Published";
  saveState();
  closeModal();
  render();
  showToast("Marked complete");
}

function deleteContent(id) {
  const item = state.content.find(x => x.id === id);
  if (item) item.stage = "Archive";
  saveState();
  closeModal();
  render();
  showToast("Archived");
}

function salesStats() {
  const deals = state.deals || [];
  const openDeals = deals.filter(d => !["Won","Lost"].includes(d.stage));
  const won = deals.filter(d => d.stage === "Won");
  const lost = deals.filter(d => d.stage === "Lost");
  const pipelineValue = openDeals.reduce((s,d) => s + (Number(d.value)||0), 0);
  const wonValue = won.reduce((s,d) => s + (Number(d.value)||0), 0);
  const winRate = (won.length + lost.length) ? Math.round((won.length / (won.length + lost.length)) * 100) : 0;
  const avgDeal = deals.length ? Math.round(deals.reduce((s,d)=>s+(Number(d.value)||0),0) / deals.length) : 0;
  return { total: deals.length, open: openDeals.length, won: won.length, lost: lost.length, pipelineValue, wonValue, winRate, avgDeal };
}

        <div class="kanban-col" data-stage="${stage}" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleSalesKanbanDrop(event, '${stage}')">

function handleSalesKanbanDrop(ev, stage) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drag-over");

    rerenderSalesPipeline();
    showToast(`Moved to ${stage}`);

}

function openSalesModal(kind, id) {
  const cfg = SALES_LIBRARY_CONFIG[kind];
  const item = id ? (state[kind]||[]).find(x => x.id === id) : Object.fromEntries(cfg.fields.map(f => [f.key, f.type === "number" ? 0 : ""]));
  const fieldsHtml = cfg.fields.map(f => {
    const val = item[f.key] ?? "";
    let control;
    if (f.type === "select") control = `<select id="sf_${f.key}">${optionList(f.options, val)}</select>`;
    else if (f.type === "textarea") control = `<textarea id="sf_${f.key}">${val}</textarea>`;
    else control = `<input id="sf_${f.key}" type="${f.type}" value="${escAttr(String(val))}"/>`;
    return `<div class="field ${f.full ? "full" : ""}"><label>${f.label}</label>${control}</div>`;
  }).join("");

  const html = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="width:520px">
      <div class="modal-head">

        </div>
      </div>
    </div>
  </div>`;
  document.getElementById("modalRoot").innerHTML = html;
}

function saveSalesModal(kind, id) {
  const cfg = SALES_LIBRARY_CONFIG[kind];
  const payload = { id: id || lid() };
  cfg.fields.forEach(f => {
    const el = document.getElementById(`sf_${f.key}`);
    payload[f.key] = f.type === "number" ? Number(el.value) || 0 : el.value;
  });
  state[kind] = state[kind] || [];
  const existing = id && state[kind].find(x => x.id === id);
  if (existing) Object.assign(existing, payload);
  else state[kind].push(payload);
  saveState();
  closeModal();
  render();
  showToast(id ? "Saved" : "Added");
}

function deleteSalesItem(kind, id) {
  state[kind] = (state[kind]||[]).filter(x => x.id !== id);
  saveState();
  closeModal();
  render();
  showToast("Deleted");
}

/* ---------- SALES ANALYTICS ---------- */
function renderSalesAnalytics() {
  const s = salesStats();
  const bySource = {};
  (state.deals||[]).forEach(d => { bySource[d.source] = (bySource[d.source]||0) + 1; });
  const sourceEntries = Object.entries(bySource).sort((a,b)=>b[1]-a[1]);
  const maxSource = Math.max(1, ...sourceEntries.map(x=>x[1]));

  return `
    <div class="stat-row dense">
      ${miniStat("Total Deals", s.total)}
      ${miniStat("Won", s.won)}
      ${miniStat("Lost", s.lost)}

/* ---------- SHARED CHART HELPERS (SVG, no libraries, offline) ---------- */
function lineAreaChartSVG(points, opts = {}) {
  const w = opts.width || 640, h = opts.height || 180, pad = 24;
  if (!points.length) return `<div class="lib-empty">Not enough dated activity yet to chart this range.</div>`;
  const max = Math.max(1, ...points.map(p => p.value));
  const stepX = (w - pad * 2) / Math.max(1, points.length - 1);
  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (p.value / max) * (h - pad * 2);
    return [x, y];
  });
  const linePath = coords.map((c, i) => `${i === 0 ? "M" : "L"} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L ${coords[coords.length-1][0].toFixed(1)} ${h-pad} L ${coords[0][0].toFixed(1)} ${h-pad} Z`;
  const gid = "grad" + Math.random().toString(36).slice(2,8);
  return `
  <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${GOLD}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${GOLD}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#${gid})" />
    <path d="${linePath}" fill="none" stroke="${GOLD}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.6" fill="${GOLD}"/>`).join("")}
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:6px">
    <span class="section-meta">${points[0].label}</span>
    <span class="section-meta">${points[points.length-1].label}</span>
  </div>`;
}

function sparklineSVG(values, opts = {}) {
  const w = opts.width || 100, h = opts.height || 28;
  if (!values.length || values.every(v=>v===0)) return `<svg width="${w}" height="${h}"></svg>`;
  const max = Math.max(1, ...values);
  const stepX = w / Math.max(1, values.length - 1);
  const pts = values.map((v,i) => `${(i*stepX).toFixed(1)},${(h - (v/max)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${GOLD}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function donutChartSVG(segments, opts = {}) {
  const size = opts.size || 130, stroke = opts.stroke || 16;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  const r = (size / 2) - stroke;
  const c = 2 * Math.PI * r;
  let offsetAcc = 0;
  const circles = segments.map(seg => {
    const frac = seg.value / total;
    const dash = frac * c;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offsetAcc}" stroke-linecap="butt"/>`;
    offsetAcc += dash;
    return el;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">${circles}</svg>`;
}

function trendChip(deltaPct) {
  if (deltaPct === null || deltaPct === undefined || isNaN(deltaPct)) return `<span class="trend-chip flat">— flat</span>`;
  if (deltaPct > 0.5) return `<span class="trend-chip up">▲ ${deltaPct.toFixed(0)}%</span>`;
  if (deltaPct < -0.5) return `<span class="trend-chip down">▼ ${Math.abs(deltaPct).toFixed(0)}%</span>`;
  return `<span class="trend-chip flat">— flat</span>`;
}

function riskPill(risk) {
  const cls = risk === "Low" ? "strong" : risk === "Moderate" ? "stable" : "risk";
  return `<span class="health-status-pill ${cls}" style="font-size:9px">${risk} Risk</span>`;
}

/* ---------- CORE DATA DERIVATION (read-only, offline) ---------- */
function monthValue(dateStr, monthsAgo) {
  if (!dateStr) return false;
  const now = new Date();
  const ref = new Date(now.getFullYear(), now.getMonth()-monthsAgo, 1);
  const d = new Date(dateStr);
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
}

function computeCompanyHealth() {
  const cs = contentStats();
  const ss = salesStats();
  const lateShare = (state.content.filter(x=>computeContentStatus(x).label==="Late").length / (state.content.length||1))*100;
  const consistency = Math.round((cs.completionPct + (100 - Math.min(100,lateShare))) / 2);
  const efficiency = Math.round((state.productivity || 70));
  const focusScore = Math.min(100, Math.round(((state.focusMinutesToday||0) / FOCUS_DAILY_TARGET_MIN) * 100));
  const momentum = Math.round((state.monthProgress + state.weekProgress) / 2);
  const execution = Math.round((cs.completionPct + ss.winRate) / 2);
  const overall = Math.round((consistency + efficiency + focusScore + momentum + execution) / 5);
  const risk = overall >= 75 ? "Low" : overall >= 50 ? "Moderate" : "High";
  const status = overall >= 80 ? { label: "Strong Growth", cls: "strong" } : overall >= 55 ? { label: "Stable", cls: "stable" } : { label: "Needs Attention", cls: "risk" };
  return { overall, consistency, efficiency, focusScore, momentum, execution, risk, status, growth: state.monthProgress };
}

function computeProductivityAnalytics() {
  const tasks = state.contentTopTasks || [];
  const tasksCreated = tasks.length;
  const tasksCompleted = tasks.filter(t => t.done).length;
  const contentDone = state.content.filter(x => ["Published","Archive"].includes(x.stage) && x.actualTime);
  const avgCompletion = contentDone.length ? Math.round(contentDone.reduce((s,x)=>s+(Number(x.actualTime)||0),0)/contentDone.length) : 0;
  const deepWorkHours = Math.round(((state.focusMinutesToday||0) / 60) * 10) / 10;
  const delayedTasks = state.content.filter(x => computeContentStatus(x).label === "Late").length;
  const efficiencyPct = tasksCreated ? Math.round((tasksCompleted / tasksCreated) * 100) : 0;
  const timeUtilization = Math.min(100, Math.round(((state.focusMinutesToday||0) / FOCUS_DAILY_TARGET_MIN) * 100));
  return { tasksCreated, tasksCompleted, avgCompletion, deepWorkHours, delayedTasks, efficiencyPct, timeUtilization };
}

function computeMarketingAnalytics() {
  const camps = (state.marketing && state.marketing.campaigns) || [];
  const offline = camps.filter(c => c.type === "Offline");
  const online = camps.filter(c => c.type === "Online");
  const flyers = offline.reduce((s,c)=>s+(c.unitsDistributed||0),0);
  const qrScans = camps.reduce((s,c)=>s+(c.qrScans||0),0);
  const socialPosts = online.reduce((s,c)=>s+(c.unitsDistributed||0),0);
  const reach = camps.reduce((s,c)=>s+(c.reach||0),0);
  const leads = camps.reduce((s,c)=>s+(c.leads||0),0);
  const budget = camps.reduce((s,c)=>s+(c.budget||0),0);
  const budgetTotal = (state.marketing && state.marketing.budgetTotal) || 1000;
  const completed = camps.filter(c=>c.status==="Completed").length;
  const completion = camps.length ? Math.round((completed/camps.length)*100) : 0;
  const roiLeadsPer100 = budget > 0 ? Math.round((leads / budget) * 100) : 0;
  const costPerLead = leads > 0 ? Math.round((budget / leads) * 100) / 100 : 0;
  const ranked = [...camps].sort((a,b)=>(b.leads||0)-(a.leads||0));
  const best = ranked[0] || null;
  const worst = ranked[ranked.length-1] || null;
  return { total: camps.length, offline: offline.length, online: online.length, flyers, qrScans, socialPosts, reach, leads, budget, budgetTotal, budgetRemaining: Math.max(0,budgetTotal-budget), completion, roiLeadsPer100, costPerLead, best, worst };
}

function computeRevenueAnalytics() {
  const deals = state.deals || [];
  const won = deals.filter(d => d.stage === "Won");
  const lost = deals.filter(d => d.stage === "Lost");
  const monthlyRevenue = won.filter(d => monthValue(d.closeDate,0)).reduce((s,d)=>s+(Number(d.value)||0),0);
  const lastMonthRevenue = won.filter(d => monthValue(d.closeDate,1)).reduce((s,d)=>s+(Number(d.value)||0),0);
  const growthPct = lastMonthRevenue ? ((monthlyRevenue-lastMonthRevenue)/lastMonthRevenue)*100 : null;
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay());
  const weeklyRevenue = won.filter(d => new Date(d.closeDate) >= weekStart).reduce((s,d)=>s+(Number(d.value)||0),0);
  const expectedRevenue = deals.filter(d=>!["Won","Lost"].includes(d.stage)).reduce((s,d)=>s+(Number(d.value)||0),0);
  const collected = won.reduce((s,d)=>s+(Number(d.value)||0),0);
  const lostRevenue = lost.reduce((s,d)=>s+(Number(d.value)||0),0);

  const byClient = {};
  won.forEach(d => { byClient[d.company] = (byClient[d.company]||0) + (Number(d.value)||0); });
  const clientEntries = Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const bySource = {};
  won.forEach(d => { bySource[d.source||"Other"] = (bySource[d.source||"Other"]||0) + (Number(d.value)||0); });
  const sourceEntries = Object.entries(bySource).sort((a,b)=>b[1]-a[1]);

  const monthBuckets = {};
  won.forEach(d => {
    const dt = new Date(d.closeDate);
    const key = dt.toLocaleDateString("en-US", { month: "short", year: "2-digit" });
    monthBuckets[key] = (monthBuckets[key]||0) + (Number(d.value)||0);
  });
  const bucketEntries = Object.entries(monthBuckets);
  let bestMonth = null, worstMonth = null;
  if (bucketEntries.length) {
    bestMonth = bucketEntries.reduce((a,b)=>b[1]>a[1]?b:a);
    worstMonth = bucketEntries.reduce((a,b)=>b[1]<a[1]?b:a);
  }
  const avgInvoice = won.length ? Math.round(collected/won.length) : 0;
  const avgClientValue = clientEntries.length ? Math.round(collected/clientEntries.length) : 0;

  return { monthlyRevenue, lastMonthRevenue, weeklyRevenue, growthPct, expectedRevenue, collected, pending: expectedRevenue, lostRevenue, clientEntries, sourceEntries, bestMonth, worstMonth, avgInvoice, avgClientValue, revenueGoal: REVENUE_MONTHLY_TARGET, forecast: Math.round(collected + expectedRevenue*0.5) };
}

/* Growth Intelligence — current vs last month across departments */
function computeGrowthIntelligence() {
  const rev = computeRevenueAnalytics();
  const contentThisMonth = state.content.filter(c => monthValue(c.publishDay,0) && ["Published","Archive"].includes(c.stage)).length;
  const contentLastMonth = state.content.filter(c => monthValue(c.publishDay,1) && ["Published","Archive"].includes(c.stage)).length;
  const dealsThisMonth = (state.deals||[]).filter(d => d.stage==="Won" && monthValue(d.closeDate,0)).length;
  const dealsLastMonth = (state.deals||[]).filter(d => d.stage==="Won" && monthValue(d.closeDate,1)).length;
  const clientsThisMonth = new Set((state.deals||[]).filter(d=>monthValue(d.closeDate,0)).map(d=>d.company)).size;
  const clientsLastMonth = new Set((state.deals||[]).filter(d=>monthValue(d.closeDate,1)).map(d=>d.company)).size;
  const leadsThisMonth = (state.marketing?.campaigns||[]).filter(c=>monthValue(c.date,0)).reduce((s,c)=>s+(c.leads||0),0);
  const leadsLastMonth = (state.marketing?.campaigns||[]).filter(c=>monthValue(c.date,1)).reduce((s,c)=>s+(c.leads||0),0);

  const pct = (cur,prev) => prev ? ((cur-prev)/prev)*100 : (cur>0 ? 100 : null);
  const mk = (name, cur, prev) => ({ name, current: cur, lastMonth: prev, diff: cur-prev, growthPct: pct(cur,prev), forecast: Math.round(cur + (cur-prev)) });

  return [
    mk("Content Growth", contentThisMonth, contentLastMonth),
    mk("Sales Growth", dealsThisMonth, dealsLastMonth),
    mk("Revenue Growth", rev.monthlyRevenue, rev.lastMonthRevenue),
    mk("Marketing Growth", leadsThisMonth, leadsLastMonth),
    mk("Client Growth", clientsThisMonth, clientsLastMonth),
  ];
}
