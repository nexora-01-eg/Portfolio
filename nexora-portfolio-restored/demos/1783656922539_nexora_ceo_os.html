function computeDecisionCenter() {
  const candidates = [];
  const priorityWeight = { Critical: 4, High: 3, Medium: 2, Low: 1 };

  state.content.forEach(item => {
    const st = computeContentStatus(item);
    if (["Late","At Risk"].includes(st.label) && !["Published","Archive"].includes(item.stage)) {
      candidates.push({
        title: `Finish "${item.title}"`,
        impact: st.label === "Late" ? "High Impact" : "Medium Impact",
        priority: item.priority || "Medium",
        estRevenue: null,
        estTime: (Number(item.estWritingTime)||0) + (Number(item.estDesignTime)||0),
        difficulty: item.stage === "Design Notes" ? "Medium" : "Easy",
        status: item.stage,
        deadline: item.deadline || item.publishDay,
        department: "Content",
        score: (priorityWeight[item.priority]||2)*2 + (st.label==="Late"?3:1),
        action: () => { state.page="content"; state.contentTab="calendar"; saveState(); render(); setTimeout(()=>openContentModal(item.id),80); },
      });
    }
  });

  (state.deals||[]).forEach(deal => {
    if (["Proposal Sent","Negotiation"].includes(deal.stage)) {
      candidates.push({
        title: `Close "${deal.company}" deal`,
        impact: (Number(deal.value)||0) >= 15000 ? "High Impact" : "Medium Impact",
        priority: deal.priority || "Medium",
        estRevenue: Number(deal.value)||0,
        estTime: 45,
        difficulty: deal.stage === "Negotiation" ? "Hard" : "Medium",
        status: deal.stage,
        deadline: deal.closeDate,
        department: "Sales",
        score: (priorityWeight[deal.priority]||2)*2 + (Number(deal.value)||0)/5000,
        action: () => { state.page="sales"; state.salesTab="pipeline"; saveState(); render(); setTimeout(()=>openSalesModal("deals",deal.id),80); },
      });
    }
  });

  (state.followUps||[]).forEach(f => {
    if (f.status === "Pending") {
      const todayStr = new Date().toISOString().slice(0,10);
      const overdue = f.dueDate < todayStr;
      candidates.push({
        title: f.title,
        impact: overdue ? "High Impact" : "Medium Impact",
        priority: f.priority || "Medium",
        estRevenue: null,
        estTime: 15,
        difficulty: "Easy",
        status: overdue ? "Overdue" : "Pending",
        deadline: f.dueDate,
        department: "Sales",
        score: (priorityWeight[f.priority]||2)*2 + (overdue?3:0),
        action: () => { state.page="sales"; state.salesTab="followUps"; saveState(); render(); setTimeout(()=>openSalesModal("followUps",f.id),80); },
      });
    }
  });

  (state.contentTopTasks||[]).forEach(t => {
    if (!t.done && (t.priority === "Critical" || t.priority === "High")) {
      candidates.push({
        title: t.title,
        impact: "Medium Impact",
        priority: t.priority,
        estRevenue: null,
        estTime: 30,
        difficulty: "Easy",
        status: "Not started",
        deadline: t.deadline || "Today",
        department: "Operations",
        score: (priorityWeight[t.priority]||2)*2,
        action: () => { state.page="dashboard"; saveState(); render(); },
      });
    }
  });

  return candidates.sort((a,b) => b.score - a.score).slice(0, 5);
}

/* ---------- ALERTS CENTER ---------- */
function computeAlerts() {
  const alerts = [];
  const cs = contentStats();
  const ss = salesStats();

  state.content.forEach(item => {
    const st = computeContentStatus(item);
    if (st.label === "Late") alerts.push({ sev: "critical", text: `"${item.title}" missed its deadline`, sub: `Content · due ${item.deadline||item.publishDay}` });
    if (st.label === "At Risk") alerts.push({ sev: "warning", text: `"${item.title}" is due within 24 hours`, sub: `Content · ${item.stage}` });
  });
  (state.deals||[]).forEach(d => {
    if (d.stage === "Negotiation") alerts.push({ sev: "warning", text: `"${d.company}" deal still in negotiation`, sub: `Sales · $${(Number(d.value)||0).toLocaleString()}` });
  });
  const todayStr = new Date().toISOString().slice(0,10);
  (state.followUps||[]).forEach(f => {
    if (f.status === "Pending" && f.dueDate < todayStr) alerts.push({ sev: "critical", text: `Follow-up overdue: ${f.title}`, sub: `Sales · was due ${f.dueDate}` });
  });
  if (cs.completionPct >= 80) alerts.push({ sev: "achievement", text: `Content completion crossed ${cs.completionPct}% this sprint`, sub: "Content · milestone" });
  if (ss.winRate >= 70 && ss.won > 0) alerts.push({ sev: "achievement", text: `Win rate holding at ${ss.winRate}%`, sub: "Sales · milestone" });
  if (state.monthProgress >= 90) alerts.push({ sev: "achievement", text: `Sprint at ${state.monthProgress}% — almost there`, sub: "Operations · milestone" });

  const sevOrder = { critical: 0, warning: 1, achievement: 2 };
  return alerts.sort((a,b) => sevOrder[a.sev]-sevOrder[b.sev]);
}

/* ---------- SMART RECOMMENDATIONS ---------- */
function computeSmartRecommendations() {
  const recos = [];
  state.content.forEach(item => {
    if (item.stage === "Approved") recos.push({ text: `Publish "${item.title}"`, impact: "High Impact", time: "10 min", difficulty: "Easy", priority: "High" });
    if (item.stage === "Design Notes") recos.push({ text: `Finish design for "${item.title}"`, impact: "Medium Impact", time: (item.estDesignTime||25)+" min", difficulty: "Medium", priority: item.priority||"Medium" });
  });
  (state.deals||[]).forEach(d => {
    if (d.stage === "Negotiation") recos.push({ text: `Call ${d.company} to close negotiation`, impact: "High Impact", time: "20 min", difficulty: "Hard", priority: d.priority||"High" });
    if (d.stage === "Lead") recos.push({ text: `Qualify lead: ${d.company}`, impact: "Medium Impact", time: "15 min", difficulty: "Easy", priority: "Medium" });
  });
  (state.marketing?.campaigns||[]).forEach(c => {
    if (c.status === "Active" && c.type === "Offline") recos.push({ text: `Check flyer stock for "${c.name}"`, impact: "Low Impact", time: "10 min", difficulty: "Easy", priority: "Low" });
  });
  if (!recos.length) recos.push({ text: "You're clear — no urgent recommendations right now", impact: "—", time: "—", difficulty: "—", priority: "—" });
  return recos.slice(0, 8);
}

/* ---------- EXECUTIVE TIMELINE ---------- */
function computeExecutiveTimeline() {
  const events = [];
  state.content.forEach(c => {
    if (["Published","Archive"].includes(c.stage)) events.push({ date: c.publishDay, text: `Content Published: "${c.title}"` });
    if (c.stage === "Scheduled") events.push({ date: c.publishDay, text: `Content Scheduled: "${c.title}"` });
  });
  (state.deals||[]).forEach(d => {
    if (d.stage === "Won") events.push({ date: d.closeDate, text: `Client Won: ${d.company} — $${(Number(d.value)||0).toLocaleString()}` });
    if (d.stage === "Proposal Sent") events.push({ date: d.closeDate, text: `Proposal Sent: ${d.company}` });
  });
  (state.marketing?.campaigns||[]).forEach(c => {
    events.push({ date: c.date, text: `Campaign Started: ${c.name}` });
  });
  return events.filter(e=>e.date).sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0, 15);
}

/* ---------- DATE-BUCKETED TREND SERIES (real data, grows more meaningful over time) ---------- */
function buildTrendSeries(metric, range) {
  const now = new Date();
  const days = range === "daily" ? 14 : range === "weekly" ? 56 : range === "monthly" ? 180 : range === "quarterly" ? 365 : 730;
  const bucketFn = range === "daily" ? (d => d.toISOString().slice(0,10))
    : range === "weekly" ? (d => { const s = new Date(d); s.setDate(d.getDate()-d.getDay()); return s.toISOString().slice(0,10); })
    : (d => d.toLocaleDateString("en-US",{month:"short", year:"2-digit"}));

  const buckets = {};
  const order = [];
  for (let i = days; i >= 0; i -= (range==="daily"?1:range==="weekly"?7:30)) {
    const d = new Date(now.getTime() - i*86400000);
    const key = bucketFn(d);
    if (!(key in buckets)) { buckets[key] = 0; order.push(key); }
  }

  const addToBucket = (dateStr, value) => {
    if (!dateStr) return;
    const d = new Date(dateStr);
    if ((now - d) / 86400000 > days) return;
    const key = bucketFn(d);
    if (key in buckets) buckets[key] += value;
  };

  if (metric === "content") {
    state.content.forEach(c => { if (["Published","Archive"].includes(c.stage)) addToBucket(c.publishDay, 1); });
  } else if (metric === "sales") {
    (state.deals||[]).forEach(d => { if (d.stage === "Won") addToBucket(d.closeDate, Number(d.value)||0); });
  } else if (metric === "productivity") {
    state.content.forEach(c => { if (c.actualTime) addToBucket(c.publishDay, Number(c.actualTime)||0); });
  } else if (metric === "marketing") {
    (state.marketing?.campaigns||[]).forEach(c => addToBucket(c.date, c.leads||0));
  }

  const uniqueOrder = [...new Set(order)];
  return uniqueOrder.map(key => ({ label: key.length === 10 ? key.slice(5) : key, value: Math.round(buckets[key]*10)/10 }));
}

/* ---------- 5. SALES INTELLIGENCE ---------- */
function renderSalesIntelligenceTab() {
  const s = salesStats();
  const deals = state.deals || [];
  const leads = (state.leads||[]).length;
  const qualified = (state.leads||[]).filter(l=>l.status==="Qualified").length;
  const meetings = state.salesSummary.meetingsToday||0;
  const proposals = deals.filter(d=>d.stage==="Proposal Sent").length;
  const negotiations = deals.filter(d=>d.stage==="Negotiation").length;
  const conversionRate = leads ? Math.round((s.won/leads)*100) : 0;
  const lossRate = (s.won+s.lost) ? Math.round((s.lost/(s.won+s.lost))*100) : 0;

  const won = deals.filter(d=>d.stage==="Won");
  const byClient = {}; won.forEach(d=>{ byClient[d.company]=(byClient[d.company]||0)+(Number(d.value)||0); });
  const bestClientEntry = Object.entries(byClient).sort((a,b)=>b[1]-a[1])[0];
  const largest = [...deals].sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0))[0];
  const longestNeg = deals.filter(d=>d.stage==="Negotiation").sort((a,b)=>new Date(a.closeDate)-new Date(b.closeDate))[0];

  const bySource = {}; deals.forEach(d=>{ bySource[d.source||"Other"]=(bySource[d.source||"Other"]||0)+1; });
  const sourceEntries = Object.entries(bySource).sort((a,b)=>b[1]-a[1]);
  const maxSource = Math.max(1,...sourceEntries.map(x=>x[1]));

  return `
    <div class="stat-row dense">
      ${miniStat("Pipeline Health", Math.min(100, Math.round((s.pipelineValue/REVENUE_MONTHLY_TARGET)*100)) + "%")}
      ${miniStat("Win Rate", s.winRate + "%")}
      ${miniStat("Loss Rate", lossRate + "%")}
      ${miniStat("Conversion Rate", conversionRate + "%")}
      ${miniStat("Avg. Deal Size", "$"+s.avgDeal.toLocaleString())}
      ${miniStat("Sales Velocity", (s.won||0) + " won/mo")}
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="section-head"><div><div class="section-eyebrow">Funnel</div><div class="section-title">Lead → Qualified → Meeting → Proposal → Negotiation → Won/Lost</div></div></div>
      ${[["Leads",leads],["Qualified",qualified],["Meetings",meetings],["Proposals",proposals],["Negotiations",negotiations],["Won",s.won],["Lost",s.lost]].map(([label,n],i,arr) => `
        <div class="bar-row"><span class="lbl">${label}</span><div class="track"><div class="fill" style="width:${(n/(Math.max(1,...arr.map(x=>x[1]))))*100}%"></div></div><span class="val">${n}</span></div>
      `).join("")}
    </div>
    <div class="two-col" style="margin-bottom:20px">
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Records</div><div class="section-title">Best Client / Largest Deal</div></div></div>
        <div class="row-item" style="margin-bottom:8px"><span>Best Client</span><span class="money">${bestClientEntry ? bestClientEntry[0]+" — $"+bestClientEntry[1].toLocaleString() : "—"}</span></div>
        <div class="row-item" style="margin-bottom:8px"><span>Largest Deal</span><span class="money">${largest ? largest.company+" — $"+(Number(largest.value)||0).toLocaleString() : "—"}</span></div>
        <div class="row-item"><span>Longest Negotiation</span><span class="pill">${longestNeg ? longestNeg.company : "None active"}</span></div>
      </div>
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Sources</div><div class="section-title">Lead Sources</div></div></div>
        ${sourceEntries.map(([name,n]) => `<div class="bar-row"><span class="lbl">${name}</span><div class="track"><div class="fill" style="width:${(n/maxSource)*100}%"></div></div><span class="val">${n}</span></div>`).join("")}

    </div>
  `;
}

function generateReport(key) {
  const cs = contentStats(); const s = salesStats(); const h = computeCompanyHealth();
  const rev = computeRevenueAnalytics(); const mkt = computeMarketingAnalytics();
  const alerts = computeAlerts(); const recos = computeSmartRecommendations();
  const typeInfo = REPORT_TYPES.find(r => r.key === key) || { label: "Report" };
  const today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

  const achievements = alerts.filter(a=>a.sev==="achievement").map(a=>`- ${a.text}`);
  const problems = alerts.filter(a=>a.sev==="critical" || a.sev==="warning").map(a=>`- ${a.text}`);

  const lines = [
    `NEXORA — ${typeInfo.label}`,
    `Generated: ${today}`,
    `${"=".repeat(56)}`,
    ``,
    `EXECUTIVE SUMMARY`,
    `Company Health: ${h.overall}/100 (${h.status.label}, ${h.risk} risk)`,
    `Sprint Progress: ${state.monthProgress}% · Week: ${state.weekProgress}% · Today: ${state.dayProgress}%`,
    ``,
    `ACHIEVEMENTS`,
    achievements.length ? achievements.join("\n") : "- Nothing flagged this period.",
    ``,
    `PROBLEMS`,
    problems.length ? problems.join("\n") : "- No critical issues right now.",
    ``,
    `REVENUE`,
    `This Month: $${rev.monthlyRevenue.toLocaleString()} · Expected: $${rev.expectedRevenue.toLocaleString()} · Collected: $${rev.collected.toLocaleString()} · Goal: $${rev.revenueGoal.toLocaleString()}`,
    ``,
    `CONTENT`,
    `Planned ${cs.planned} · Finished ${cs.finished} · Published ${cs.published} · Completion ${cs.completionPct}%`,
    ``,
    `SALES`,
    `Open ${s.open} · Won ${s.won} · Lost ${s.lost} · Pipeline $${s.pipelineValue.toLocaleString()} · Win Rate ${s.winRate}%`,
    ``,
    `MARKETING`,
    `Campaigns ${mkt.total} · Leads ${mkt.leads} · Reach ${mkt.reach.toLocaleString()} · Cost/Lead $${mkt.costPerLead}`,
    ``,
    `RECOMMENDATIONS / NEXT PRIORITIES`,
    recos.slice(0,5).map(r=>`- ${r.text} (${r.impact}, ${r.time})`).join("\n"),
    ``,
    `Generated locally by NEXORA CEO OS — no data leaves this device.`,
  ];
  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `NEXORA_${typeInfo.label.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`${typeInfo.label} exported`);
}

      </div>
      <div id="settingsTabBody">${renderSettingsTab(tab)}</div>
    </div>
  </div>`;
}

function renderSettingsTab(tab) {
  switch (tab) {
    case "workspace": return renderWorkspaceTab();
    case "brand": return renderBrandIdentityTab();
    case "team": return renderTeamTab();
    case "ai": return renderAiSettingsTab();
    case "contentDefaults": return renderContentDefaultsTab();
    case "automation": return renderAutomationTab();
    case "notifications": return renderNotificationSettingsTab();
    case "integrations": return renderIntegrationsTab();
    case "security": return renderSecurityTab();
    case "billing": return renderBillingTab();
    case "backup": return renderBackupTab();
    case "appearance": return renderAppearanceTab();
    case "dashboardPrefs": return renderDashboardPrefsTab();
    case "dataManagement": return renderDataManagementTab();
    case "activityLogs": return renderActivityLogsTab();
    default: return "";
  }
}

function switchSettingsTab(tab) {
  state.settingsTab = tab;
  saveState();
  document.getElementById("settingsNav").querySelectorAll(".settings-nav-item").forEach((el,i) => el.classList.toggle("active", SETTINGS_TABS[i].key===tab));
  document.getElementById("settingsTabBody").innerHTML = renderSettingsTab(tab);
}

    </div>

      <div class="section-head"><div><div class="section-eyebrow">Auto</div><div class="section-title">Automatic Backup</div></div></div>
      ${toggleRow("Weekly Backup Reminder","We'll nudge you from the Decision Center to export a fresh backup weekly.",state.settings.automation.autoBackup,"toggleAutomation('autoBackup',this.checked)")}

function exportWorkspaceJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  downloadBlob(blob, `NEXORA_Backup_${new Date().toISOString().slice(0,10)}.json`);
  showToast("Backup downloaded");
}
function toCSV(rows, headers) {
  const esc = v => `"${String(v??"").replace(/"/g,'""')}"`;
  return [headers.join(","), ...rows.map(r => headers.map(h=>esc(r[h])).join(","))].join("\n");
}
function exportContentCSV() {
  const csv = toCSV(state.content, ["id","title","category","type","platform","stage","priority","publishDay","deadline","owner"]);
  downloadBlob(new Blob([csv],{type:"text/csv"}), `NEXORA_Content_${new Date().toISOString().slice(0,10)}.csv`);
  showToast("Content CSV downloaded");
}
function exportDealsCSV() {
  const csv = toCSV(state.deals||[], ["id","company","contact","value","stage","priority","source","closeDate"]);
  downloadBlob(new Blob([csv],{type:"text/csv"}), `NEXORA_Deals_${new Date().toISOString().slice(0,10)}.csv`);
  showToast("Deals CSV downloaded");
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportWorkspace(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported || typeof imported !== "object") throw new Error("Invalid file");
      state = imported;
      saveState();
      showToast("Workspace restored — reloading");
      setTimeout(() => location.reload(), 900);
    } catch (e) { showToast("Couldn't read that file"); }
  };
  reader.readAsText(file);
}

/* ---------- CORE COMPUTATION (offline, from real seeded/edited data) ---------- */
function mktOverview() {
  const camps = state.marketing.campaigns;
  const active = camps.filter(c => c.status === "Active");
  const reach = camps.reduce((s,c)=>s+(c.reach||0),0);
  const impressions = camps.reduce((s,c)=>s+(c.impressions||0),0);
  const clicks = camps.reduce((s,c)=>s+(c.clicks||0),0);
  const spend = camps.reduce((s,c)=>s+(c.budget||0),0);
  const leads = camps.reduce((s,c)=>s+(c.leads||0),0);
  const conversions = camps.reduce((s,c)=>s+(c.conversions||0),0);
  const revenue = camps.reduce((s,c)=>s+(c.revenue||0),0);
  const ctr = impressions ? (clicks/impressions*100) : 0;
  const cpc = clicks ? (spend/clicks) : 0;
  const cpm = impressions ? (spend/impressions*1000) : 0;
  const cpl = leads ? (spend/leads) : 0;
  const roi = spend ? ((revenue-spend)/spend*100) : 0;
  const conversionRate = leads ? (conversions/leads*100) : 0;
  const budgetTotal = state.marketing.budgetTotal;
  const healthScore = Math.max(0, Math.min(100, Math.round((Math.min(100,conversionRate*2) + Math.min(100,Math.max(0,roi)) + (active.length ? 60 : 0)) / 3)));
  return { activeCount: active.length, reach, impressions, clicks, ctr, cpc, cpm, spend, leads, conversions, conversionRate, cpl, roi, revenue, budgetTotal, budgetRemaining: Math.max(0,budgetTotal-spend), healthScore };
}

function mktFunnel() {
  const o = mktOverview();
  const awareness = o.impressions || 1;
  const interest = o.clicks;
  const consideration = Math.round(interest * 0.55);
  const lead = o.leads;
  const opportunity = o.conversions;
  const customer = Math.round(opportunity * 0.55);
  const steps = [
    { label: "Awareness", value: awareness },
    { label: "Interest", value: interest },
    { label: "Consideration", value: consideration },
    { label: "Lead", value: lead },
    { label: "Opportunity", value: opportunity },
    { label: "Customer (est.)", value: customer },
  ];
  return steps.map((s,i) => ({ ...s, dropRate: i>0 ? Math.round((1 - s.value/(steps[i-1].value||1))*100) : 0 }));
}

function mktRecommendations() {
  const camps = state.marketing.campaigns;
  const recos = [];
  camps.forEach(c => {
    const spend = c.budget||0, revenue = c.revenue||0;
    const roi = spend ? ((revenue-spend)/spend*100) : 0;
    if (c.status === "Active" && roi >= 100) recos.push({ text: `Scale "${c.name}" — ROI at ${Math.round(roi)}%`, impact: "High Impact", time: "15 min", difficulty: "Easy" });
    if (c.status === "Active" && roi < 20 && spend > 50) recos.push({ text: `Reduce budget for "${c.name}" — ROI only ${Math.round(roi)}%`, impact: "Medium Impact", time: "10 min", difficulty: "Easy" });
    if (c.status === "Paused") recos.push({ text: `Review paused campaign "${c.name}"`, impact: "Low Impact", time: "10 min", difficulty: "Easy" });
  });
  const posts = [...state.marketingOS.contentPosts].filter(p=>p.status==="Published");
  if (posts.length) recos.push({ text: `Top performing content: "${posts[0].title}" — consider a follow-up post`, impact: "Medium Impact", time: "20 min", difficulty: "Medium" });
  const heat = mktHeatmapData();
  const best = heat.best;
  recos.push({ text: `Best posting time: ${best.day} around ${best.hour} — schedule your next post then`, impact: "Medium Impact", time: "5 min", difficulty: "Easy" });
  if (!recos.length) recos.push({ text: "No urgent marketing actions right now", impact: "—", time: "—", difficulty: "—" });
  return recos.slice(0,6);
}

function mktHeatmapData() {
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const blocks = ["6am","10am","2pm","6pm","9pm","12am"];
  let best = { day: days[0], hour: blocks[0], val: -1 };
  const grid = days.map((day,di) => blocks.map((hour,hi) => {
    // deterministic pseudo-intensity so it's stable across renders, not random each time
    const val = Math.round(((Math.sin(di*1.7+hi*0.9)+1)/2) * 70 + ((di===2||di===4)&&hi===3 ? 25:0));
    if (val > best.val) best = { day, hour, val };
    return val;
  }));
  return { days, blocks, grid, best };
}

function saveCampaignModal(id, existing) {
  const get = k => document.getElementById(k).value;
  const num = k => Number(get(k))||0;
  const payload = {
    id, name: get("cm_name")||"Untitled Campaign", platform: get("cm_platform"), objective: get("cm_objective"),
    status: get("cm_status"), stage: get("cm_stage"), owner: get("cm_owner")||"You", date: get("cm_date"),
    budgetAllocated: num("cm_budgetAllocated"), budget: num("cm_budget"), revenue: num("cm_revenue"),
    reach: num("cm_reach"), impressions: num("cm_impressions"), clicks: num("cm_clicks"),
    leads: num("cm_leads"), conversions: num("cm_conversions"), progress: num("cm_progress"),
    type: "Online", unitsDistributed: 0, qrScans: 0,
  };
  if (existing === "true") {
    const c = state.marketing.campaigns.find(x=>x.id===id);
    Object.assign(c, payload);
  } else {
    state.marketing.campaigns.push(payload);
  }
  saveState(); closeModal(); render();
  logMktActivity(`Campaign ${existing==="true"?"Updated":"Created"}: ${payload.name}`, "campaign");
  showToast("Campaign saved");
}
function deleteCampaign(id) {
  state.marketing.campaigns = state.marketing.campaigns.filter(x=>x.id!==id);
  saveState(); closeModal(); render(); showToast("Campaign deleted");
}
function duplicateCampaign(id) {
  const c = state.marketing.campaigns.find(x=>x.id===id);
  if (!c) { showToast("No campaign to duplicate"); return; }
  const copy = { ...c, id: lid(), name: c.name+" (copy)", status: "Draft", stage: "Creative Ready", progress: 0 };
  state.marketing.campaigns.push(copy);
  saveState(); render();
  logMktActivity(`Campaign Duplicated: ${copy.name}`, "campaign");
  showToast("Campaign duplicated");
}

function renderMktKanban(posts) {

      return `
      <div class="kanban-col" data-status="${st}" ondragover="event.preventDefault(); this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handlePostDrop(event,'${st}')">

function handlePostDrop(ev, status) {
  ev.preventDefault(); ev.currentTarget.classList.remove("drag-over");
  const id = ev.dataTransfer.getData("text/plain");
  const p = state.marketingOS.contentPosts.find(x=>x.id===id);
  if (p) { p.status = status; saveState(); document.getElementById("marketingTabBody").innerHTML = renderMktPlannerTab(); showToast(`Moved to ${status}`); }
}
function renderMktCalendar() {
  const gridEl = document.getElementById("mktCalGrid");
  if (!gridEl) return;
  const offset = state.marketingOS.calMonthOffset || 0;
  const base = new Date(); base.setMonth(base.getMonth()+offset);
  const year = base.getFullYear(), month = base.getMonth();
  const label = document.getElementById("mktCalMonthLabel");
  if (label) label.textContent = base.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const byDay = {};
  state.marketingOS.contentPosts.forEach(p => { if(!byDay[p.date]) byDay[p.date]=[]; byDay[p.date].push(p); });
  let html = `<div class="cal-grid">`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for (let i=0;i<firstDay;i++) html += `<div class="cal-day empty"></div>`;
  for (let day=1; day<=daysInMonth; day++) {
    const dateStr = new Date(year,month,day).toISOString().slice(0,10);
    const items = byDay[dateStr]||[]; const first = items[0]; const isToday = dateStr===todayStr;
    if (first) {
      html += `<div class="cal-day ${isToday?"today":""}" onclick="openPostModal('${first.id}')">
        <span class="cal-day-num">${day}</span>
        <div><div class="cal-day-type">${first.status}${items.length>1?` +${items.length-1}`:""}</div><div class="cal-day-plat">${first.platform}</div></div>
      </div>`;
    } else {
      html += `<div class="cal-day ${isToday?"today":""} empty"><span class="cal-day-num">${day}</span></div>`;
    }
  }
  html += `</div>`;
  gridEl.innerHTML = html;
}
function shiftMktCalMonth(d) { state.marketingOS.calMonthOffset = d===0?0:(state.marketingOS.calMonthOffset||0)+d; saveState(); renderMktCalendar(); }
function openPostModal(id) {
  const p = id ? state.marketingOS.contentPosts.find(x=>x.id===id) : { id: lid(), title:"", platform: MKT_PLATFORMS[0], status:"Draft", date: new Date().toISOString().slice(0,10) };

/* ---------- 6. LEADS ---------- */
function renderMktLeadsTab() {
  const sources = state.marketingOS.leadSources;
  const total = sources.reduce((s,x)=>s+x[1],0);
  const colors = [GOLD,"#8b93a0","#5b6270","#3B82F6","#34D399","#F59E0B","#EF4444","#b98af0","#7ba7d9","#6fcf97"];
  const segs = sources.map(([label,value],i) => ({label,value,color:colors[i%colors.length]}));
  const max = Math.max(1,...sources.map(x=>x[1]));
  return `
    <div class="stat-row dense">
      ${miniStat("Total Leads", total)}
      ${miniStat("Top Source", sources.slice().sort((a,b)=>b[1]-a[1])[0][0])}
      ${miniStat("Sources Tracked", sources.length)}
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Distribution</div><div class="section-title">Lead Sources</div></div></div>
        <div class="donut-wrap">${donutChartSVG(segs,{size:150})}<div class="donut-legend">${segs.map(s=>`<div class="donut-legend-item"><span class="donut-legend-dot" style="background:${s.color}"></span>${s.label} · ${s.value}</div>`).join("")}</div></div>
      </div>
      <div class="card">
        <div class="section-head"><div><div class="section-eyebrow">Ranked</div><div class="section-title">All Sources</div></div></div>
        ${sources.slice().sort((a,b)=>b[1]-a[1]).map(([name,n]) => `<div class="bar-row"><span class="lbl">${name}</span><div class="track"><div class="fill" style="width:${(n/max)*100}%"></div></div><span class="val">${n}</span></div>`).join("")}
      </div>
    </div>
  `;
}

/* ---------- 7. BUDGET ---------- */
function renderMktBudgetTab() {
  const o = mktOverview();
  const monthlyBudget = state.marketingOS.budgetCenter.monthlyBudget;
  const profit = o.revenue - o.spend;
  const profitMargin = o.revenue ? Math.round((profit/o.revenue)*100) : 0;
  const pct = Math.min(100, Math.round((o.spend/monthlyBudget)*100));
  return `
    <div class="card" style="margin-bottom:18px">
      <div class="section-head"><div><div class="section-eyebrow">This Month</div><div class="section-title">Budget Utilization</div></div></div>
      <div class="progress-track thick"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="sprint-foot" style="margin-top:8px"><span class="section-meta">$${o.spend.toLocaleString()} spent</span><span class="section-meta">$${monthlyBudget.toLocaleString()} monthly budget</span></div>
    </div>
    <div class="stat-row dense">
      ${miniStat("Monthly Budget", "$"+monthlyBudget.toLocaleString())}
      ${miniStat("Spent", "$"+o.spend.toLocaleString())}
      ${miniStat("Remaining", "$"+Math.max(0,monthlyBudget-o.spend).toLocaleString())}
      ${miniStat("Forecast (EOM)", "$"+Math.round(o.spend*1.3).toLocaleString())}
      ${miniStat("Expected ROI", Math.round(o.roi)+"%")}
      ${miniStat("Revenue Generated", "$"+o.revenue.toLocaleString())}
    </div>
    <div class="stat-row dense">
      ${miniStat("Profit", "$"+profit.toLocaleString())}
      ${miniStat("Profit Margin", profitMargin+"%")}
      ${miniStat("Active Campaigns", o.activeCount)}
    </div>
    <div class="card">
      <div class="section-head"><div><div class="section-eyebrow">Set Target</div><div class="section-title">Monthly Budget</div></div></div>
      <div class="field"><label>Monthly Budget ($)</label><input type="number" value="${monthlyBudget}" onchange="state.marketingOS.budgetCenter.monthlyBudget=Number(this.value)||0; saveState(); document.getElementById('marketingTabBody').innerHTML=renderMktBudgetTab();"/></div>
    </div>
  `;
}

/* ---------- 8. ANALYTICS (Funnel + KPI Wall + Heatmap) ---------- */

  const maxHeat = Math.max(1,...heat.grid.flat());

  return `
    <div class="card" style="margin-bottom:20px">
      <div class="section-head"><div><div class="section-eyebrow">Awareness → Customer</div><div class="section-title">Marketing Funnel</div></div></div>
      <div class="funnel-wrap">
        ${funnel.map((s,i) => `
          <div class="funnel-step" style="width:${100-i*12}%;margin:0 auto">
            <span class="fs-label">${s.label}</span><span class="fs-val">${s.value.toLocaleString()}</span>
          </div>
          ${i < funnel.length-1 ? `<div class="funnel-drop">↓ ${funnel[i+1].dropRate}% drop</div>` : ""}
        `).join("")}
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="section-head"><div><div class="section-eyebrow">Best Posting Time</div><div class="section-title">Engagement Heat Map</div></div></div>
      <div class="heatmap-grid">
        <div></div>
        ${heat.blocks.map(b=>`<div class="heatmap-label" style="justify-content:center">${b}</div>`).join("")}
        ${heat.days.map((day,di) => `
          <div class="heatmap-label">${day}</div>
          ${heat.grid[di].map(v => `<div class="heatmap-cell" style="background:rgba(212,175,55,${(v/maxHeat).toFixed(2)})" title="${v}"></div>`).join("")}
        `).join("")}
      </div>
      <div class="card-desc" style="margin-top:10px">Best time to post: <strong style="color:var(--gold)">${heat.best.day} around ${heat.best.hour}</strong></div>
    </div>

    <div class="card">
      <div class="section-head"><div><div class="section-eyebrow">40+ Metrics</div><div class="section-title">Marketing KPI Wall</div></div></div>
      <div class="kpi-wall-grid">
        ${[["Reach",o.reach.toLocaleString()],["Impressions",o.impressions.toLocaleString()],["Clicks",o.clicks.toLocaleString()],["CTR",o.ctr.toFixed(2)+"%"],
           ["CPC","$"+o.cpc.toFixed(2)],["CPM","$"+o.cpm.toFixed(2)],["CPA","$"+o.cpl.toFixed(2)],["ROAS",(o.spend?(o.revenue/o.spend).toFixed(2):"0")+"x"],
           ["ROI",Math.round(o.roi)+"%"],["Revenue","$"+o.revenue.toLocaleString()],["Leads",o.leads],["Customers",Math.round(o.conversions*0.55)],
           ["Engagement Rate",(state.marketingOS.socialPlatforms.reduce((s,p)=>s+p.engagement,0)/state.marketingOS.socialPlatforms.length).toFixed(1)+"%"]]
          .map(([label,val]) => `<div class="kpi-wall-tile"><div class="kwt-val">${val}</div><div class="kwt-lbl">${label}</div></div>`).join("")}
      </div>
    </div>
  `;
}

/* ---------- 9. AUTOMATION ---------- */
function renderMktAutomationTab() {
  const a = state.marketingOS.automation;
  return `

      <div class="card-desc" style="margin-bottom:8px">NEXORA never contacts external services. These reflect intent and are saved locally — most require a live connection to actually run.</div>

function toggleMktAutomation(key,val) { state.marketingOS.automation[key]=val; saveState(); showToast(val?"Enabled":"Disabled"); }

/* ---------- 10. REPORTS ---------- */
const MKT_REPORT_TYPES = [
  { key:"daily", label:"Daily Report" }, { key:"weekly", label:"Weekly Report" }, { key:"monthly", label:"Monthly Report" },
  { key:"quarterly", label:"Quarterly Report" }, { key:"yearly", label:"Yearly Report" },
];
function renderMktReportsTab() {
  return `
    <div class="card" style="margin-bottom:18px">
      <div class="section-head"><div><div class="section-eyebrow">Export-Ready</div><div class="section-title">Reports Center</div></div></div>
      ${MKT_REPORT_TYPES.map(r => `
        <div class="report-card">
          <div><div class="rc-title">${r.label}</div><div class="rc-sub">Campaigns, reach, leads, and ROI summary</div></div>
          <div style="display:flex;gap:8px">
            <button class="btn-ghost" onclick="exportMktReportTXT('${r.key}')">TXT</button>
            <button class="btn-ghost" onclick="exportMktCampaignsCSV()">CSV</button>
            <button class="btn-ghost" onclick="exportMktReportJSON()">JSON</button>
            <button class="btn-primary" onclick="window.print()">Print / PDF</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="card">
      <div class="section-head"><div><div class="section-eyebrow">Live</div><div class="section-title">Full Activity Feed</div></div></div>
      ${state.marketingOS.activityFeed.length ? `<div class="timeline-wrap">${state.marketingOS.activityFeed.map(a=>`<div class="timeline-item"><div class="timeline-date">${a.time}</div><div class="timeline-text">${a.text}</div></div>`).join("")}</div>` : emptyState("No activity yet","")}
    </div>
  `;
}
function exportMktReportTXT(key) {
  const o = mktOverview();
  const typeInfo = MKT_REPORT_TYPES.find(r=>r.key===key) || {label:"Report"};
  const lines = [
    `NEXORA — Marketing ${typeInfo.label}`,
    `Generated: ${new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}`,
    "=".repeat(50), "",
    `Active Campaigns: ${o.activeCount}`,
    `Reach: ${o.reach.toLocaleString()} · Impressions: ${o.impressions.toLocaleString()} · Clicks: ${o.clicks.toLocaleString()}`,
    `CTR: ${o.ctr.toFixed(2)}% · CPC: $${o.cpc.toFixed(2)} · CPM: $${o.cpm.toFixed(2)}`,
    `Leads: ${o.leads} · Conversions: ${o.conversions} · Conversion Rate: ${o.conversionRate.toFixed(1)}%`,
    `Spend: $${o.spend.toLocaleString()} · Revenue: $${o.revenue.toLocaleString()} · ROI: ${Math.round(o.roi)}%`,
    "", "Generated locally by NEXORA CEO OS — no data leaves this device.",
  ];
  downloadBlob(new Blob([lines.join("\n")],{type:"text/plain"}), `NEXORA_Marketing_${typeInfo.label.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.txt`);
  showToast("Report exported");
}
function exportMktCampaignsCSV() {
  const csv = toCSV(state.marketing.campaigns, ["id","name","platform","objective","status","budgetAllocated","budget","reach","impressions","clicks","leads","conversions","revenue","owner","progress"]);
  downloadBlob(new Blob([csv],{type:"text/csv"}), `NEXORA_Campaigns_${new Date().toISOString().slice(0,10)}.csv`);
  showToast("Campaigns CSV exported");
}
function exportMktReportJSON() {
  downloadBlob(new Blob([JSON.stringify({ overview: mktOverview(), campaigns: state.marketing.campaigns, social: state.marketingOS.socialPlatforms, audience: state.marketingOS.audience }, null, 2)],{type:"application/json"}), `NEXORA_Marketing_${new Date().toISOString().slice(0,10)}.json`);
  showToast("JSON exported");
}

/* ---------- SHARED: activity log + search + CSV import ---------- */
function logMktActivity(text, type) {
  state.marketingOS.activityFeed.unshift({ text, time: "just now", type });
  saveState();
}
function handleMktImportCSV(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split("\n").filter(l=>l.trim());
    showToast(`Imported ${Math.max(0,lines.length-1)} row(s) — review them in Campaigns`);
    logMktActivity(`Imported CSV: ${file.name}`, "campaign");
  };
  reader.readAsText(file);
  ev.target.value = "";
}
function renderMktSearch(q) {
  const box = document.getElementById("mktSearchResults");
  if (!q || q.trim().length < 2) { box.innerHTML = ""; return; }
  const query = q.toLowerCase();
  const results = [];
  state.marketing.campaigns.forEach(c => { if (c.name.toLowerCase().includes(query)) results.push({ label:"Campaign", title:c.name, action:`openCampaignModal('${c.id}')` }); });
  state.marketingOS.contentPosts.forEach(p => { if (p.title.toLowerCase().includes(query)) results.push({ label:"Post", title:p.title, action:`openPostModal('${p.id}')` }); });
  state.marketingOS.socialPlatforms.forEach(p => { if (p.name.toLowerCase().includes(query)) results.push({ label:"Platform", title:p.name, action:`switchMarketingTab('social')` }); });
  box.innerHTML = results.length ? `<div class="global-search-results">${results.slice(0,15).map(r=>`<div class="gsr-item" onclick="${r.action}; document.getElementById('mktSearchResults').innerHTML='';"><span class="t">${r.title}</span><span class="pill">${r.label}</span></div>`).join("")}</div>` : `<div class="global-search-results"><div class="gsr-empty">No matches</div></div>`;
}

/* ---------- SHARED NAV / DASHBOARD LOGIC ---------- */
function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (task) task.done = !task.done;
  saveState();
  render();
}
window.toggleTask = toggleTask;

const PAGES = {
  dashboard: renderDashboard,
  content: renderContentFactory,
  sales: renderSalesModule,
  marketing: renderMarketingOSModule,
  analytics: renderAnalyticsModule,
  settings: renderSettingsModule,
};

function render() {
  document.getElementById("content").innerHTML = PAGES[state.page]();
  if (state.page === "content") renderCalendar();
}

function setupNav() {
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.page = btn.dataset.page;
      saveState();
      render();
    });
  });
  const initial = document.querySelector(`.nav-item[data-page="${state.page}"]`);
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  if (initial) initial.classList.add("active");
}

function tickClock() {
  const now = new Date();
  document.getElementById("clockTime").textContent = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  document.getElementById("clockDate").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}

function animateProductivity() {
  let n = 0;
  const target = state.productivity;
  const el = document.getElementById("prodScore");
  const fill = document.getElementById("prodFill");
  fill.style.width = target + "%";
  const t = setInterval(() => {
    n += Math.ceil(target / 30);
    if (n >= target) { n = target; clearInterval(t); }
    el.textContent = n;
  }, 25);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

function renderBootSkeleton() {
  const el = document.getElementById("content");
  if (!el) return;
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="skeleton skeleton-row" style="width:220px;height:22px"></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        ${Array(4).fill(0).map(() => `
          <div class="skeleton-card">
            <div class="skeleton skeleton-row" style="width:60%"></div>
            <div class="skeleton skeleton-row" style="width:40%;height:20px"></div>
          </div>
        `).join("")}
      </div>
      <div class="skeleton-card">
        <div class="skeleton skeleton-row" style="width:30%"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row" style="width:70%"></div>
      </div>
    </div>
  `;
}

renderBootSkeleton();
setupNav();
setTimeout(() => {
  render();
  tickClock();
  setInterval(tickClock, 1000);
  animateProductivity();
  if (isFreshInstall) showWelcomeModal();
}, 260);

/* ---------- FIRST-RUN ONBOARDING: real empty workspace vs sample data ---------- */
function showWelcomeModal() {
  const html = `
  <div class="modal-overlay">
    <div class="modal" style="width:480px;text-align:center">
      <img src="${LOGO}" alt="NEXORA" style="width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:block;box-shadow:0 0 0 1px rgba(212,175,55,0.35), 0 0 18px rgba(212,175,55,0.15)"/>
      <div class="h1" style="font-size:20px;margin-bottom:6px">Welcome to NEXORA</div>
      <div class="card-desc" style="margin-bottom:22px">How do you want to start? You can switch anytime from Settings → Data Management.</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn-primary" style="justify-content:center;padding:13px" onclick="startEmptyWorkspace()">Start Empty — I'll enter my real company data</button>
        <button class="btn-ghost" style="justify-content:center;padding:13px" onclick="closeModal()">Explore First — Keep the Sample Data</button>
      </div>
    </div>
  </div>`;
  document.getElementById("modalRoot").innerHTML = html;
}

function startEmptyWorkspace() {
  state.content = [];
  state.ideas = []; state.hooks = []; state.captions = []; state.ctas = [];
  state.comments = []; state.hashtagSets = []; state.templates = []; state.brandAssets = [];
  state.deals = []; state.leads = []; state.followUps = [];
  state.marketing.campaigns = [];
  state.marketingOS.contentPosts = [];
  state.marketingOS.activityFeed = [];
  state.tasks = []; state.contentTopTasks = []; state.notifications = []; state.activity = [];
  state.demoDataLoaded = false;
  saveState();
  closeModal();
  render();
  showToast("Empty workspace ready — add your first real record");
}

</script>
