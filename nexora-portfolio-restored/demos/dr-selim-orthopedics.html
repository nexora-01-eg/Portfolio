<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>د. محمود سليم — استشاري جراحة العظام والمفاصل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A6%B4%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Cairo', 'ui-sans-serif', 'system-ui'] },
      }
    }
  }
</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --accent: #4A7FB5; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Cairo', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    opacity: 0;
    animation: vip-fade-in .5s ease forwards;
  }
  @keyframes vip-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 55%, transparent) transparent; }
  button, a, [role="button"] { transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #root { min-height: 100vh; }
  #vip-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 9999; transition: opacity .4s ease;
  }
  #vip-loading .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: vip-spin .8s linear infinite;
  }
  @keyframes vip-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="vip-loading"><div class="spinner"></div></div>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import * as ReactDOM from "react-dom/client";
import React, { useState } from "react";
import {
  Bone, Search, Bell, Plus, X, Users, Activity, Scissors, Award,
} from "lucide-react";

const BG = "#080A0C";
const PANEL = "#0F1317";
const CARD = "#141A1F";
const BORDER = "#232B32";
const TEXT = "#EFF2F5";
const MUTED = "#8B939B";
const GOLD = "#C9A227";
const STEEL = "#4A7FB5";
const STEEL_SOFT = "rgba(74,127,181,0.16)";
const GREEN = "#3FA66B";
const RED = "#C24A4A";

const RAIL = [
  { icon: Users, label: "الحالات" }, { icon: Scissors, label: "الجراحات المجدولة" }, { icon: Activity, label: "العلاج الطبيعي" },
];

const career = [
  { label: "سنوات الخبرة", value: "١٥" }, { label: "عملية عظام أُجريت", value: "١,١٠٠+" },
  { label: "نسبة نجاح استبدال المفاصل", value: "٪٩٧" }, { label: "حالات هذا الشهر", value: "٥٢" },
];

const initialCases = [
  { name: "وائل الجندي", issue: "كسر في عظمة الفخذ", status: "بعد الجراحة", severity: "متوسط" },
  { name: "رنا سامح", issue: "خشونة الركبة", status: "متابعة", severity: "منخفض" },
  { name: "حسين مراد", issue: "انزلاق غضروفي", status: "قبل الجراحة", severity: "مرتفع" },
];

const surgeries = [
  { patient: "حسين مراد", type: "استئصال غضروف", date: "١٤ يوليو", room: "غرفة عمليات ٢" },
  { patient: "سلوى فؤاد", type: "استبدال مفصل ورك", date: "١٦ يوليو", room: "غرفة عمليات ١" },
];

const physio = [
  { patient: "وائل الجندي", sessions: "٤ / ١٠", focus: "استعادة حركة الفخذ" },
  { patient: "رنا سامح", sessions: "٧ / ١٢", focus: "تقوية عضلات الركبة" },
];

function Card({ children, className = "", style = {} }) {
  return <div className={`rounded-2xl border ${className}`} style={{ background: CARD, borderColor: BORDER, ...style }}>{children}</div>;
}
function TopBar({ title, subtitle, onAdd, addLabel }) {
  return (
    <div className="flex items-center justify-between mb-8">
      <div><h1 className="text-2xl font-semibold tracking-tight">{title}</h1>{subtitle && <p className="text-sm mt-1" style={{ color: MUTED }}>{subtitle}</p>}</div>
      <div className="flex items-center gap-3">
        <div className="flex items-center gap-2 px-4 py-2.5 rounded-xl border" style={{ borderColor: BORDER, background: PANEL }}><Search size={15} style={{ color: MUTED }} /><span className="text-sm" style={{ color: MUTED }}>بحث...</span></div>
        {onAdd && <button onClick={onAdd} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm" style={{ background: STEEL, color: "#070C10" }}><Plus size={15} />{addLabel}</button>}
        <div className="w-10 h-10 rounded-xl border flex items-center justify-center" style={{ borderColor: BORDER, background: PANEL }}><Bell size={17} style={{ color: MUTED }} /></div>
      </div>
    </div>
  );
}
function Modal({ title, note, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-24" style={{ background: "rgba(0,0,0,0.55)" }}>
      <Card className="w-full max-w-md p-7 relative" style={{ borderColor: STEEL }}>
        <button onClick={onClose} className="absolute left-5 top-5" style={{ color: MUTED }}><X size={18} /></button>
        <div className="text-lg font-semibold mb-1">{title}</div>
        <div className="text-xs mb-6" style={{ color: MUTED }}>{note}</div>
        {children}
      </Card>
    </div>
  );
}
const inputStyle = { background: "#0B0E11", borderColor: BORDER, color: TEXT };
const Field = ({ label, ...props }) => (
  <div className="mb-4">
    <label className="text-xs" style={{ color: MUTED }}>{label}</label>
    <input {...props} className="w-full mt-1.5 px-3.5 py-2.5 rounded-xl border text-sm outline-none" style={inputStyle} />
  </div>
);
function NewCaseModal({ onClose, onCreate }) {
  const [name, setName] = useState(""); const [issue, setIssue] = useState("");
  return (
    <Modal title="إضافة حالة جديدة" note="بيانات محاكاة أمامية فقط" onClose={onClose}>
      <Field label="اسم المريض" value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: بسام عادل" />
      <Field label="الإصابة / الحالة" value={issue} onChange={(e) => setIssue(e.target.value)} placeholder="مثال: كسر في الساعد" />
      <button onClick={() => name.trim() && onCreate({ name, issue: issue || "فحص عام", status: "متابعة", severity: "منخفض" })}
        className="w-full py-3 rounded-xl text-sm font-medium" style={{ background: STEEL, color: "#070C10" }}>إضافة الحالة</button>
    </Modal>
  );
}

function CasesScreen({ cases, onAdd }) {
  return (
    <>
      <div className="flex items-center gap-1.5 text-xs mb-2" style={{ color: GOLD }}><Award size={13} />زميل الكلية الملكية الأمريكية لجراحة العظام</div>
      <TopBar title="د. محمود سليم" subtitle="استشاري جراحة العظام والمفاصل" onAdd={onAdd} addLabel="حالة جديدة" />
      <div className="grid grid-cols-4 gap-5 mb-7">
        {career.map((k) => <Card key={k.label} className="p-5"><div className="text-xs mb-3" style={{ color: MUTED }}>{k.label}</div><div className="text-2xl font-semibold tracking-tight" style={{ color: STEEL }}>{k.value}</div></Card>)}
      </div>
      <Card className="p-2">
        {cases.map((c, i) => (
          <div key={c.name} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== cases.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div><div className="text-sm font-medium">{c.name}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{c.issue}</div></div>
            <div className="flex items-center gap-4">
              <span className="text-xs" style={{ color: MUTED }}>{c.status}</span>
              <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: c.severity === "مرتفع" ? RED : c.severity === "متوسط" ? GOLD : GREEN, background: `${c.severity === "مرتفع" ? RED : c.severity === "متوسط" ? GOLD : GREEN}1A`, border: `1px solid ${c.severity === "مرتفع" ? RED : c.severity === "متوسط" ? GOLD : GREEN}` }}>خطورة {c.severity}</span>
            </div>
          </div>
        ))}
      </Card>
    </>
  );
}

function SurgeriesScreen() {
  return (
    <>
      <TopBar title="الجراحات المجدولة" subtitle={`${surgeries.length} عملية قادمة`} />
      <div className="grid grid-cols-2 gap-5">
        {surgeries.map((s) => (
          <Card key={s.patient} className="p-6">
            <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: STEEL_SOFT }}><Scissors size={16} style={{ color: STEEL }} /></div>
            <div className="text-sm font-medium">{s.patient}</div>
            <div className="text-xs mt-1" style={{ color: MUTED }}>{s.type}</div>
            <div className="text-xs mt-3" style={{ color: STEEL }}>{s.date} · {s.room}</div>
          </Card>
        ))}
      </div>
    </>
  );
}

function PhysioScreen() {
  return (
    <>
      <TopBar title="العلاج الطبيعي" subtitle="متابعة برامج التأهيل" />
      <Card className="p-2">
        {physio.map((p, i) => (
          <div key={p.patient} className="flex items-center justify-between px-5 py-4" style={{ borderBottom: i !== physio.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div><div className="text-sm font-medium">{p.patient}</div><div className="text-xs mt-0.5" style={{ color: MUTED }}>{p.focus}</div></div>
            <span className="text-xs px-3 py-1.5 rounded-full" style={{ color: STEEL, background: STEEL_SOFT, border: `1px solid ${STEEL}` }}>{p.sessions} جلسات</span>
          </div>
        ))}
      </Card>
    </>
  );
}

function DrSelimOrthopedics() {
  const [rail, setRail] = useState(0);
  const [cases, setCases] = useState(initialCases);
  const [showModal, setShowModal] = useState(false);

  const screens = [<CasesScreen cases={cases} onAdd={() => setShowModal(true)} />, <SurgeriesScreen />, <PhysioScreen />];

  return (
    <div dir="rtl" className="w-full min-h-screen flex font-sans" style={{ background: BG, color: TEXT }}>
      <aside className="w-20 shrink-0 flex flex-col items-center py-7 gap-3 border-l" style={{ background: PANEL, borderColor: BORDER }}>
        <div className="w-11 h-11 rounded-2xl flex items-center justify-center mb-4" style={{ background: STEEL_SOFT, border: `1px solid ${STEEL}` }}><Bone size={19} style={{ color: STEEL }} /></div>
        {RAIL.map((item, i) => {
          const Icon = item.icon;
          return (
            <button key={item.label} onClick={() => setRail(i)} title={item.label}
              className="w-11 h-11 rounded-2xl flex items-center justify-center transition-colors"
              style={{ background: rail === i ? STEEL_SOFT : "transparent", border: rail === i ? `1px solid ${STEEL}` : "1px solid transparent" }}>
              <Icon size={18} style={{ color: rail === i ? STEEL : MUTED }} />
            </button>
          );
        })}
      </aside>
      <main className="flex-1 px-10 py-8 overflow-y-auto">{screens[rail]}</main>
      {showModal && <NewCaseModal onClose={() => setShowModal(false)} onCreate={(c) => { setCases((p) => [c, ...p]); setShowModal(false); }} />}
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<DrSelimOrthopedics />);
const loading = document.getElementById("vip-loading");
if (loading) { loading.style.opacity = "0"; setTimeout(() => loading.remove(), 400); }
</script>
</body>
</html>
