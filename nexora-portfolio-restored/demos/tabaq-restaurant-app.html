<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طبق — إدارة مطعمك اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lemonada:wght@500;600;700&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#211A16; --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(230,163,45,0.2), transparent 60%), radial-gradient(ellipse 700px 500px at 0% 100%, rgba(212,74,52,0.14), transparent 55%), #211A16;
  --raised:#2B2119; --card:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.09);
  --saffron:#E6A32D; --saffron-soft:rgba(230,163,45,0.17); --tomato:#D44A34; --tomato-soft:rgba(212,74,52,0.16);
  --olive:#8A9A5B; --olive-soft:rgba(138,154,91,0.16); --cream:#F6EEDF; --muted:#B8A48E; --faint:#71604C;
  --r-lg:26px; --ease:cubic-bezier(.22,1,.36,1); --shadow:0 20px 46px -22px rgba(0,0,0,0.55);
  --font-display:'Lemonada', sans-serif; --font-body:'Tajawal', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--cream); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
.device{ width:100%; max-width:430px; background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px), var(--raised); border-radius:34px; border:1px solid var(--border); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; } .avatar{ width:44px; height:44px; border-radius:16px; background:linear-gradient(150deg, var(--tomato), #8a2f1f); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px; flex-shrink:0; }
.hello .greet{ font-size:12.5px; color:var(--muted); } .hello .name{ font-family:var(--font-display); font-weight:700; font-size:17px; margin-top:1px; }
.icon-btn{ width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; position:relative; } .icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.icon-btn .dot{ position:absolute; top:7px; left:7px; width:7px; height:7px; border-radius:50%; background:var(--tomato); box-shadow:0 0 0 2px var(--raised); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; } .scroll::-webkit-scrollbar{ display:none; }
.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(230,163,45,0.22), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--saffron); text-transform:uppercase; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:700; font-size:20px; margin-top:12px; line-height:1.55; position:relative; z-index:1; } .hero-title span{ color:var(--tomato); }
.stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:18px; font-weight:700; } .stat span{ font-size:10px; color:var(--muted); }
.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; } .qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; }
.sec-head h2{ font-family:var(--font-display); font-weight:700; font-size:17px; } .sec-head .more{ font-size:11px; color:var(--saffron); }
.order-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; margin-bottom:9px; }
.order-num{ width:36px; height:36px; border-radius:11px; background:var(--saffron-soft); color:var(--saffron); font-family:var(--font-mono); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.order-info{ flex:1; min-width:0; } .order-info .on{ font-weight:700; font-size:13px; } .order-info .om{ font-size:11px; color:var(--muted); margin-top:2px; }
.stage-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; }
.stage-badge.new{ background:var(--saffron-soft); color:var(--saffron); } .stage-badge.cooking{ background:var(--tomato-soft); color:var(--tomato); } .stage-badge.out{ background:var(--olive-soft); color:var(--olive); }
.self-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; margin-bottom:9px; background:linear-gradient(120deg, var(--olive-soft), transparent); border:1px dashed rgba(138,154,91,0.4); }
.self-card .ic{ width:40px; height:40px; border-radius:13px; background:var(--olive-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .self-card .ic svg{ width:18px; height:18px; color:var(--olive); }
.self-card b{ font-size:12.5px; display:block; } .self-card span{ font-size:11px; color:var(--muted); }
.chart-card{ padding:18px; margin-top:4px; } .chart-top{ display:flex; justify-content:space-between; align-items:center; } .chart-top h3{ font-family:var(--font-display); font-size:14.5px; font-weight:700; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--olive); background:var(--olive-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:700; font-size:23px; margin-top:8px; } .chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }
.dish-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); } .dish-row:first-child{ border-top:none; padding-top:0; }
.d-icon{ width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
.dish-row .info{ flex:1; min-width:0; } .dish-row .dn{ font-size:12.5px; font-weight:700; } .dish-row .dm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.sold-badge{ font-family:var(--font-mono); font-size:10px; color:var(--saffron); }
.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:16px; background:linear-gradient(150deg, var(--tomato), #8a2f1f); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(212,74,52,0.5); z-index:20; } .fab svg{ width:22px; height:22px; color:#fff; }
.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(33,26,22,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; } .tab svg{ width:19px; height:19px; } .tab.active{ color:var(--tomato); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar">
    <div class="hello"><div class="avatar">م ص</div><div><div class="greet">مساء الخير يا شيف</div><div class="name">مطعم الأصايل</div></div></div>
    <button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
  </div>
  <div class="scroll">
    <div class="glass hero-card">
      <span class="hero-eyebrow">شغل الوردية</span>
      <div class="hero-title">عندك <span>١٤ أوردر</span> النهاردة<br>و٣ أوردرات جاهزين للتسليم 🍽️</div>
      <div class="stat-row">
        <div class="stat"><b id="s1">0</b><span>أوردرات</span></div>
        <div class="stat"><b id="s2">0</b><span>عملا جدد</span></div>
        <div class="stat"><b id="s3">0</b><span>مبيعات ج.م</span></div>
      </div>
    </div>
    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--saffron-soft); color:var(--saffron);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>أوردر جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--tomato-soft); color:var(--tomato);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9l7 7v9H4z"/></svg></div><span>المنيو</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--olive-soft); color:var(--olive);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 14c.4 1.1.5 2.2.3 3.2-.7.3-1.9.2-3-.4-2.6-1.4-4.8-3.6-6.2-6.2-.6-1.1-.7-2.3-.4-3 1-.2 2.1-.1 3.2.3"/><circle cx="12" cy="12" r="9"/></svg></div><span>واتساب</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--saffron-soft); color:var(--saffron);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
    </div>
    <div class="sec-head"><h2>أوردرات النهاردة</h2><span class="more">الكل</span></div>
    <div id="orderList"></div>
    <div class="sec-head"><h2>نمو المطعم</h2></div>
    <div class="glass chart-card"><div class="chart-top"><h3>مبيعات أسبوعيًا</h3><span class="chart-badge">▲ ١٨٪</span></div><div class="chart-num">٢٦,٤٠٠ <small>جنيه هذا الأسبوع</small></div><svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg></div>
    <div class="sec-head"><h2>الأكتر طلبًا</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="dishList"></div>
  </div>
  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9l7 7v9H4z"/></svg>الأوردرات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>العملا</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>
<script>
function animateCount(el,target,dur=1000){ const start=performance.now(); function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); } requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),14); animateCount(document.getElementById('s2'),5); animateCount(document.getElementById('s3'),5200); },300);
const orders=[
  {id:'٤٤١', name:'محمود سامي', meta:'مشاوي مشكل + أرز', stage:'cooking'},
  {id:'٤٤٢', name:'هبة الديب', meta:'كشري كبير + سلطة', stage:'new'},
  {note:true, title:'٣ أوردرات جاهزين للتسليم', sub:'كلم الديليفري قبل ما الأكل يبرد'},
  {id:'٤٤٣', name:'زياد رمزي', meta:'فراخ مشوية + بطاطس', stage:'out'},
  {id:'٤٤٤', name:'مريم توفيق', meta:'مكرونة بشاميل', stage:'new'},
];
document.getElementById('orderList').innerHTML = orders.map(o=>{
  if(o.note){ return `<div class="self-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 11-8-8"/><path d="M12 4v8l5 3"/></svg></div><div><b>${o.title}</b><span>${o.sub}</span></div></div>`; }
  const labels={new:'جديد', cooking:'بيتحضر', out:'في الطريق'};
  return `<div class="glass order-card"><div class="order-num">#${o.id}</div><div class="order-info"><div class="on">${o.name}</div><div class="om">${o.meta}</div></div><span class="stage-badge ${o.stage}">${labels[o.stage]}</span></div>`;
}).join('');
(function(){ const svg=document.getElementById('spark'); const vals=[26,30,28,34,32,40,44]; const W=340,H=70,pad=4,max=48; const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`; vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; }); const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`; svg.innerHTML=`<defs><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--olive)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--olive)" stop-opacity="0"/></linearGradient></defs><path d="${fillD}" fill="url(#gt)" stroke="none"/><path d="${d}" fill="none" stroke="var(--olive)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();
const dishes=[ {n:'مشاوي مشكل', meta:'الأكتر طلبًا', emoji:'🍢', sold:'٢٤٠ طلب'}, {n:'كشري كبير', meta:'', emoji:'🍚', sold:'١٩٠ طلب'}, {n:'فراخ مشوية', meta:'', emoji:'🍗', sold:'١٦٠ طلب'} ];
document.getElementById('dishList').innerHTML = dishes.map(d=>`<div class="dish-row"><div class="d-icon">${d.emoji}</div><div class="info"><div class="dn">${d.n}</div><div class="dm">${d.meta}</div></div><span class="sold-badge">${d.sold}</span></div>`).join('');
</script>
</body>
</html>
