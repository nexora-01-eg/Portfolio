<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرص — إدارة الفرن اليومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2B1E14; --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(196,122,52,0.2), transparent 60%), radial-gradient(ellipse 700px 500px at 0% 100%, rgba(178,58,58,0.14), transparent 55%), #2B1E14;
  --raised:#38281A; --card:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.09);
  --caramel:#C47A34; --caramel-soft:rgba(196,122,52,0.18); --cherry:#B23A3A; --cherry-soft:rgba(178,58,58,0.16);
  --cream:#F6E8D3; --cream-soft:rgba(246,232,211,0.12); --muted:#C7AE94; --faint:#7A6249;
  --r-lg:26px; --ease:cubic-bezier(.22,1,.36,1); --shadow:0 20px 46px -22px rgba(0,0,0,0.55);
  --font-display:'Baloo 2', sans-serif; --font-body:'Tajawal', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--cream); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
.device{ width:100%; max-width:430px; background:linear-gradient(180deg, rgba(255,255,255,.02), transparent 200px), var(--raised); border-radius:34px; border:1px solid var(--border); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; } .avatar{ width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg, var(--caramel), #8a541f); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:16px; color:#2B1E14; flex-shrink:0; }
.hello .greet{ font-size:12.5px; color:var(--muted); } .hello .name{ font-family:var(--font-display); font-weight:700; font-size:18px; margin-top:1px; }
.icon-btn{ width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; position:relative; } .icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.icon-btn .dot{ position:absolute; top:7px; left:7px; width:7px; height:7px; border-radius:50%; background:var(--cherry); box-shadow:0 0 0 2px var(--raised); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; } .scroll::-webkit-scrollbar{ display:none; }
.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(196,122,52,0.22), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--caramel); text-transform:uppercase; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:700; font-size:20px; margin-top:12px; line-height:1.55; position:relative; z-index:1; } .hero-title span{ color:var(--cherry); }
.stat-row{ display:flex; gap:10px; margin-top:16px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:18px; font-weight:700; } .stat span{ font-size:10px; color:var(--muted); }
.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; } .qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; } .sec-head h2{ font-family:var(--font-display); font-weight:700; font-size:17px; } .sec-head .more{ font-size:11px; color:var(--caramel); }
.order-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; margin-bottom:9px; }
.order-emoji{ font-size:20px; flex-shrink:0; } .order-info{ flex:1; min-width:0; } .order-info .on{ font-weight:700; font-size:13px; } .order-info .om{ font-size:11px; color:var(--muted); margin-top:2px; }
.stage-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; } .stage-badge.new{ background:var(--caramel-soft); color:var(--caramel); } .stage-badge.baking{ background:var(--cherry-soft); color:var(--cherry); } .stage-badge.ready{ background:var(--cream-soft); color:var(--cream); }
.self-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; margin-bottom:9px; background:linear-gradient(120deg, var(--cream-soft), transparent); border:1px dashed rgba(246,232,211,0.3); }
.self-card .ic{ width:40px; height:40px; border-radius:13px; background:var(--cream-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .self-card .ic svg{ width:18px; height:18px; color:var(--cream); }
.self-card b{ font-size:12.5px; display:block; } .self-card span{ font-size:11px; color:var(--muted); }
.chart-card{ padding:18px; margin-top:4px; } .chart-top{ display:flex; justify-content:space-between; align-items:center; } .chart-top h3{ font-family:var(--font-display); font-size:14.5px; font-weight:700; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--caramel); background:var(--caramel-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:700; font-size:23px; margin-top:8px; } .chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }
.item-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); } .item-row:first-child{ border-top:none; padding-top:0; }
.i-emoji{ font-size:18px; width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.item-row .info{ flex:1; min-width:0; } .item-row .dn{ font-size:12.5px; font-weight:700; } .item-row .dm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.sold-badge{ font-family:var(--font-mono); font-size:10px; color:var(--caramel); }
.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:50%; background:linear-gradient(150deg, var(--cherry), #7a2626); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(178,58,58,0.5); z-index:20; } .fab svg{ width:22px; height:22px; color:#fff; }
.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(43,30,20,0.88); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; } .tab svg{ width:19px; height:19px; } .tab.active{ color:var(--cherry); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar"><div class="hello"><div class="avatar">فر</div><div><div class="greet">صباح الفل يا معلم</div><div class="name">فرن الأصايل</div></div></div><button class="icon-btn"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button></div>
  <div class="scroll">
    <div class="glass hero-card">
      <span class="hero-eyebrow">شغل الفرن</span>
      <div class="hero-title">عندك <span>١٨ أوردر</span> النهاردة<br>وكنافة عيد ميلاد جاهزة 🎂</div>
      <div class="stat-row"><div class="stat"><b id="s1">0</b><span>أوردرات</span></div><div class="stat"><b id="s2">0</b><span>عملا جدد</span></div><div class="stat"><b id="s3">0</b><span>مبيعات ج.م</span></div></div>
    </div>
    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--caramel-soft); color:var(--caramel);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>أوردر جديد</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--cherry-soft); color:var(--cherry);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9l7 7v9H4z"/></svg></div><span>المنتجات</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--cream-soft); color:var(--cream);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 14c.4 1.1.5 2.2.3 3.2-.7.3-1.9.2-3-.4-2.6-1.4-4.8-3.6-6.2-6.2-.6-1.1-.7-2.3-.4-3 1-.2 2.1-.1 3.2.3"/><circle cx="12" cy="12" r="9"/></svg></div><span>واتساب</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--caramel-soft); color:var(--caramel);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
    </div>
    <div class="sec-head"><h2>أوردرات النهاردة</h2><span class="more">الكل</span></div>
    <div id="orderList"></div>
    <div class="sec-head"><h2>نمو الفرن</h2></div>
    <div class="glass chart-card"><div class="chart-top"><h3>مبيعات أسبوعيًا</h3><span class="chart-badge">▲ ١٦٪</span></div><div class="chart-num">١٥,٢٠٠ <small>جنيه هذا الأسبوع</small></div><svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg></div>
    <div class="sec-head"><h2>الأكتر طلبًا</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="itemList"></div>
  </div>
  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h9l7 7v9H4z"/></svg>الأوردرات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>العملا</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>
<script>
function animateCount(el,target,dur=1000){ const start=performance.now(); function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); } requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),18); animateCount(document.getElementById('s2'),6); animateCount(document.getElementById('s3'),4100); },300);
const orders=[
  {emoji:'🎂', name:'تورتة عيد ميلاد — منى راضي', meta:'٢ كيلو · شوكولاتة', stage:'baking'},
  {emoji:'🥐', name:'كرواسون فرنساوي — طلب شركة', meta:'٥٠ قطعة', stage:'new'},
  {note:true, title:'كنافة عيد الميلاد جاهزة', sub:'عميل: عمرو الديب — استلام الساعة ٦'},
  {emoji:'🍞', name:'خبز صحي — طلب أسبوعي', meta:'٢٠ رغيف', stage:'ready'},
];
document.getElementById('orderList').innerHTML = orders.map(o=>{
  if(o.note){ return `<div class="self-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></div><div><b>${o.title}</b><span>${o.sub}</span></div></div>`; }
  const labels={new:'جديد', baking:'بيتخبز', ready:'جاهز'};
  return `<div class="glass order-card"><span class="order-emoji">${o.emoji}</span><div class="order-info"><div class="on">${o.name}</div><div class="om">${o.meta}</div></div><span class="stage-badge ${o.stage}">${labels[o.stage]}</span></div>`;
}).join('');
(function(){ const svg=document.getElementById('spark'); const vals=[16,20,18,24,22,28,32]; const W=340,H=70,pad=4,max=36; const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`; vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; }); const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`; svg.innerHTML=`<defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--caramel)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--caramel)" stop-opacity="0"/></linearGradient></defs><path d="${fillD}" fill="url(#gk)" stroke="none"/><path d="${d}" fill="none" stroke="var(--caramel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();
const items=[ {emoji:'🥐', n:'كرواسون فرنساوي', sold:'٣١٠ قطعة'}, {emoji:'🎂', n:'تورتة شوكولاتة', sold:'٨٤ تورتة'}, {emoji:'🍞', n:'خبز صحي', sold:'٤٢٠ رغيف'} ];
document.getElementById('itemList').innerHTML = items.map(i=>`<div class="item-row"><div class="i-emoji">${i.emoji}</div><div class="info"><div class="dn">${i.n}</div></div><span class="sold-badge">${i.sold}</span></div>`).join('');
</script>
</body>
</html>
