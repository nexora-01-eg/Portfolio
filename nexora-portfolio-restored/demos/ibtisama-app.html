<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابتسامة — عيادتك في جيبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1FA;
  --bg-deep: radial-gradient(ellipse 900px 600px at 90% -10%, rgba(107,78,142,0.10), transparent 60%),
             radial-gradient(ellipse 700px 500px at 0% 100%, rgba(127,217,196,0.16), transparent 55%),
             #F4F1FA;
  --raised:#FFFFFF;
  --card: rgba(107,78,142,0.045);
  --border: rgba(107,78,142,0.12);
  --plum:#6B4E8E;
  --plum-soft: rgba(107,78,142,0.12);
  --mint:#3FAF95;
  --mint-soft: rgba(63,175,149,0.14);
  --coral:#E8607A;
  --coral-soft: rgba(232,96,122,0.14);
  --gold:#D9A441;
  --gold-soft: rgba(217,164,65,0.16);
  --ink:#231A33;
  --muted:#7C6E95;
  --faint:#B3A8C7;
  --r-lg:26px;
  --ease: cubic-bezier(.22,1,.36,1);
  --shadow: 0 24px 50px -26px rgba(107,78,142,0.35);
  --font-display:'El Messiri', serif;
  --font-body:'Cairo', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg-deep); color:var(--ink); font-family:var(--font-body); min-height:100vh; display:flex; justify-content:center; padding:26px 14px 0; }
a{color:inherit; text-decoration:none;} button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
:focus-visible{ outline:2px solid var(--plum); outline-offset:2px; border-radius:8px; }
.device{ width:100%; max-width:430px; background:var(--raised); border-radius:32px; border:1px solid var(--border); box-shadow:0 60px 120px -50px rgba(107,78,142,0.4); overflow:hidden; min-height:calc(100vh - 26px); display:flex; flex-direction:column; position:relative; }
@media (min-width:540px){ body{padding-top:40px;} .device{min-height:900px;} }
.glass{ background:linear-gradient(180deg, #FFFFFF, #FBFAFE); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.hello{ display:flex; align-items:center; gap:12px; }
.avatar{ width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg, var(--plum), #4a3565); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px; color:#fff; flex-shrink:0; }
.hello .greet{ font-size:12px; color:var(--muted); }
.hello .name{ font-family:var(--font-display); font-weight:700; font-size:16px; margin-top:1px; }
.icon-btn{ width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
.icon-btn svg{ width:17px; height:17px; color:var(--muted); }
.scroll{ flex:1; overflow-y:auto; padding:14px 20px 100px; scrollbar-width:none; }
.scroll::-webkit-scrollbar{ display:none; }

.hero-card{ padding:22px 20px; margin-top:6px; position:relative; overflow:hidden; background:linear-gradient(155deg, #6B4E8E, #4A3565); color:#fff; }
.hero-card::after{ content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 0%, rgba(63,175,149,0.35), transparent 55%); pointer-events:none; }
.hero-eyebrow{ font-family:var(--font-mono); font-size:10.5px; color:#CDBEE4; text-transform:uppercase; letter-spacing:.06em; position:relative; z-index:1;}
.hero-title{ font-family:var(--font-display); font-weight:700; font-size:22px; margin-top:12px; line-height:1.45; position:relative; z-index:1; }
.hero-title span{ color:#8FE3CD; }
.smile-arc{ width:100%; height:44px; margin-top:12px; position:relative; z-index:1;}
.stat-row{ display:flex; gap:10px; margin-top:14px; position:relative; z-index:1; }
.stat{ flex:1; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); border-radius:14px; padding:10px 12px; text-align:center; }
.stat b{ display:block; font-family:var(--font-display); font-size:18px; font-weight:700; }
.stat span{ font-size:10px; color:#CDBEE4; }

.qa-row{ display:flex; gap:10px; margin-top:18px; overflow-x:auto; }
.qa-pill{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px; width:74px; }
.qa-ic{ width:52px; height:52px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
.qa-ic svg{ width:21px; height:21px; }
.qa-pill span{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.3; }

.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px; }
.sec-head h2{ font-family:var(--font-display); font-weight:700; font-size:16px; }
.sec-head .more{ font-size:11px; color:var(--plum); }

.appt-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:18px; margin-bottom:9px; }
.appt-time{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:46px; flex-shrink:0; }
.appt-time b{ font-family:var(--font-mono); font-size:13px; color:var(--plum); }
.appt-time span{ font-size:9px; color:var(--faint); }
.appt-line{ width:1px; align-self:stretch; background:var(--border); }
.appt-info{ flex:1; min-width:0; }
.appt-info .pname{ font-weight:700; font-size:13px; }
.appt-info .ptype{ font-size:11px; color:var(--muted); margin-top:2px; }
.tooth-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 9px; border-radius:20px; }
.tooth-badge.checkup{ background:var(--mint-soft); color:var(--mint); }
.tooth-badge.treat{ background:var(--coral-soft); color:var(--coral); }
.tooth-badge.cosmetic{ background:var(--gold-soft); color:var(--gold); }

.reminder-card{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; margin-bottom:9px; background:linear-gradient(120deg, var(--mint-soft), transparent); border:1px dashed rgba(63,175,149,0.4); }
.reminder-card .ic{ width:40px; height:40px; border-radius:13px; background:var(--mint-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.reminder-card .ic svg{ width:18px; height:18px; color:var(--mint); }
.reminder-card b{ font-size:12.5px; display:block; }
.reminder-card span{ font-size:11px; color:var(--muted); }

.chart-card{ padding:18px; margin-top:4px; }
.chart-top{ display:flex; justify-content:space-between; align-items:center; }
.chart-top h3{ font-family:var(--font-display); font-size:14.5px; font-weight:700; }
.chart-badge{ font-family:var(--font-mono); font-size:10.5px; color:var(--mint); background:var(--mint-soft); padding:3px 9px; border-radius:20px; }
.chart-num{ font-family:var(--font-display); font-weight:700; font-size:24px; margin-top:8px; }
.chart-num small{ font-size:11px; color:var(--muted); font-weight:400; font-family:var(--font-body); }

.patient-row{ display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--border); }
.patient-row:first-child{ border-top:none; padding-top:0; }
.p-avatar{ width:36px; height:36px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--plum); flex-shrink:0; }
.patient-row .info{ flex:1; min-width:0; }
.patient-row .pn{ font-size:12.5px; font-weight:700; }
.patient-row .pm{ font-size:10.5px; color:var(--muted); margin-top:1px; }
.pay-badge{ font-family:var(--font-mono); font-size:9.5px; padding:3px 8px; border-radius:20px; }
.pay-badge.paid{ background:var(--mint-soft); color:var(--mint); }
.pay-badge.due{ background:var(--coral-soft); color:var(--coral); }

.fab{ position:absolute; left:20px; bottom:92px; width:54px; height:54px; border-radius:50%; background:linear-gradient(150deg, var(--plum), #4a3565); display:flex; align-items:center; justify-content:center; box-shadow:0 14px 28px -8px rgba(107,78,142,0.5); z-index:20; }
.fab svg{ width:22px; height:22px; color:#fff; }

.tabbar{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:12px 10px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,0.9); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:15; }
.tab{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--faint); font-size:9.5px; }
.tab svg{ width:19px; height:19px; }
.tab.active{ color:var(--plum); }
</style>
</head>
<body>
<div class="device">
  <div class="topbar">
    <div class="hello">
      <div class="avatar">ند</div>
      <div><div class="greet">صباح النور يا دكتورة</div><div class="name">د. ندى وهبة</div></div>
    </div>
    <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>
  </div>

  <div class="scroll">
    <div class="glass hero-card">
      <div class="hero-eyebrow">جلسات النهاردة</div>
      <div class="hero-title">عندك <span>٧ جلسات</span><br>وابتسامتين تركيب جاهزين</div>
      <svg class="smile-arc" id="smileArc" viewBox="0 0 380 44"></svg>
      <div class="stat-row">
        <div class="stat"><b id="s1">0</b><span>جلسات</span></div>
        <div class="stat"><b id="s2">0</b><span>حالات جديدة</span></div>
        <div class="stat"><b id="s3">0</b><span>تحصيل ج.م</span></div>
      </div>
    </div>

    <div class="qa-row">
      <div class="qa-pill"><div class="qa-ic" style="background:var(--plum-soft); color:var(--plum);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span>حجز جلسة</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--mint-soft); color:var(--mint);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg></div><span>حالة جديدة</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--coral-soft); color:var(--coral);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 14c.4 1.1.5 2.2.3 3.2-.7.3-1.9.2-3-.4-2.6-1.4-4.8-3.6-6.2-6.2-.6-1.1-.7-2.3-.4-3 1-.2 2.1-.1 3.2.3"/><circle cx="12" cy="12" r="9"/></svg></div><span>واتساب</span></div>
      <div class="qa-pill"><div class="qa-ic" style="background:var(--gold-soft); color:var(--gold);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg></div><span>تحصيل</span></div>
    </div>

    <div class="sec-head"><h2>جلسات النهاردة</h2><span class="more">الكل</span></div>
    <div id="apptList"></div>

    <div class="sec-head"><h2>نمو العيادة</h2></div>
    <div class="glass chart-card">
      <div class="chart-top"><h3>الحالات أسبوعيًا</h3><span class="chart-badge">▲ ١١٪</span></div>
      <div class="chart-num">٦٤ <small>حالة في آخر ٧ أيام</small></div>
      <svg id="spark" viewBox="0 0 340 70" style="width:100%; height:70px; margin-top:10px;"></svg>
    </div>

    <div class="sec-head"><h2>أحدث المريضات والمرضى</h2><span class="more">الكل</span></div>
    <div class="glass" style="padding:6px 14px;" id="patientList"></div>
  </div>

  <button class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="tabbar">
    <div class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الرئيسية</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>الجلسات</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M4 20c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>المرضى</div>
    <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>حسابي</div>
  </div>
</div>

<script>
function animateCount(el,target,dur=1000){ const start=performance.now();
  function frame(t){ const p=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e).toLocaleString('ar-EG'); if(p<1) requestAnimationFrame(frame); }
  requestAnimationFrame(frame); }
setTimeout(()=>{ animateCount(document.getElementById('s1'),7); animateCount(document.getElementById('s2'),2); animateCount(document.getElementById('s3'),5400); },300);

(function(){
  const svg=document.getElementById('smileArc');
  svg.innerHTML=`<path d="M10,10 Q190,44 370,10" fill="none" stroke="#8FE3CD" stroke-width="2.6" stroke-linecap="round"
    style="stroke-dasharray:420; stroke-dashoffset:420; animation:drawSmile 1.6s cubic-bezier(.22,1,.36,1) forwards;"/>
    <style>@keyframes drawSmile{ to{ stroke-dashoffset:0; } }</style>`;
})();

const appts=[
  {time:'٩:٠٠', period:'ص', name:'رنا كامل', type:'كشف وتنظيف', tag:'checkup'},
  {time:'٩:٥٠', period:'ص', name:'يوسف بدوي', type:'حشو عصب', tag:'treat'},
  {note:true, title:'تذكير: تركيب ابتسامة هوليوود', sub:'المريضة: لارا فوزي — الساعة ١٢'},
  {time:'١:٠٠', period:'م', name:'لارا فوزي', type:'تركيب فينير', tag:'cosmetic'},
  {time:'٢:٣٠', period:'م', name:'كريم عادل', type:'تقويم متابعة', tag:'checkup'},
];
document.getElementById('apptList').innerHTML = appts.map(a=>{
  if(a.note){
    return `<div class="reminder-card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18l6-6-6-6" transform="scale(-1,1) translate(-24,0)"/></svg></div><div><b>${a.title}</b><span>${a.sub}</span></div></div>`;
  }
  const labels={checkup:'كشف', treat:'علاج', cosmetic:'تجميل'};
  return `<div class="glass appt-card">
    <div class="appt-time"><b>${a.time}</b><span>${a.period}</span></div>
    <div class="appt-line"></div>
    <div class="appt-info"><div class="pname">${a.name}</div><div class="ptype">${a.type}</div></div>
    <span class="tooth-badge ${a.tag}">${labels[a.tag]}</span>
  </div>`;
}).join('');

(function(){ const svg=document.getElementById('spark'); const vals=[26,30,28,34,32,38,42]; const W=340,H=70,pad=4,max=46;
  const stepX=(W-pad*2)/(vals.length-1); let d=`M ${pad} ${H-pad-(vals[0]/max)*(H-pad*2)}`;
  vals.forEach((v,i)=>{ if(i===0) return; d+=` L ${pad+i*stepX} ${H-pad-(v/max)*(H-pad*2)}`; });
  const fillD=d+` L ${pad+(vals.length-1)*stepX} ${H-pad} L ${pad} ${H-pad} Z`;
  svg.innerHTML=`<defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--mint)" stop-opacity="0.32"/><stop offset="100%" stop-color="var(--mint)" stop-opacity="0"/></linearGradient></defs>
  <path d="${fillD}" fill="url(#g3)" stroke="none"/><path d="${d}" fill="none" stroke="var(--mint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`; })();

const patients=[
  {name:'رنا كامل', meta:'كشف وتنظيف · النهاردة', init:'رك', pay:'paid'},
  {name:'يوسف بدوي', meta:'حشو عصب · النهاردة', init:'يب', pay:'due'},
  {name:'لارا فوزي', meta:'فينير · النهاردة', init:'لف', pay:'due'},
  {name:'كريم عادل', meta:'تقويم · النهاردة', init:'كع', pay:'paid'},
];
document.getElementById('patientList').innerHTML = patients.map(p=>`
  <div class="patient-row"><div class="p-avatar">${p.init}</div>
    <div class="info"><div class="pn">${p.name}</div><div class="pm">${p.meta}</div></div>
    <span class="pay-badge ${p.pay}">${p.pay==='paid'?'اتحصّل':'لسه'}</span>
  </div>`).join('');
</script>
</body>
</html>
