<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="core/css/tokens.css" />

  <script src="core/js/helpers.js"></script>
  <script src="core/js/theme.js"></script>
